name: Proof book revision checks
on:
  push:
    branches: [book/proof-evolution-20261006]
    paths:
      - books/proof-evolution/**
      - .github/workflows/proof-review-check.yml
permissions:
  contents: write
jobs:
  check:
    if: github.repository == 'C-ZW/ai-infra-book' && github.ref == 'refs/heads/book/proof-evolution-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Clarify the finite-state premise
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          p=Path('books/proof-evolution/book-src/ch09-incompleteness-and-computation.md')
          t=p.read_text()
          old='若真的把記憶體限制固定，而且程式沒有新的外部輸入，確定性的機器只剩有限多種完整狀態。'
          new='若把所有會影響後續運算的狀態都限制在有限集合內——不只是工作記憶體，也包括控制位置、可讀寫檔案與會再被讀取的輸出——而且沒有新的外部輸入，確定性的機器才只剩有限多種完整狀態。'
          if new not in t:
              assert t.count(old)==1
              p.write_text(t.replace(old,new))
          PY
      - name: Build and verify this book only
        working-directory: books/proof-evolution
        run: |
          set -eu
          python3 scripts/build-figures.py
          node scripts/build-reader.mjs
          node scripts/verify.mjs
          node scripts/build-reader.mjs --check
      - name: Commit only the checked book to the existing PR branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- books/proof-evolution
          if ! git diff --cached --quiet; then
            if git diff --cached --name-only | grep -v '^books/proof-evolution/'; then exit 1; fi
            git commit -m 'book: clarify finite-state assumptions and rebuild checked reader'
            git push origin HEAD:refs/heads/book/proof-evolution-20261006
          fi
          git rev-parse HEAD
      - name: Package the checked book
        run: tar --exclude=.review-output -czf "$RUNNER_TEMP/proof-book.tar.gz" books/proof-evolution
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof-book-checked
          path: ${{ runner.temp }}/proof-book.tar.gz
          retention-days: 2
          if-no-files-found: error
