死胡同，透過換動詞、換尺規、找缺席者或翻轉公設，將模糊感嘆收斂為精準可驗證的問句。\n  4. **日常顯影**（The Everyday Lens）：將歷史現場提煉為認知透鏡，重返日常生活察覺身邊被忽視的真問題。\n- **關聯詞彙**：認知節能（`ch01`）、問題顯影地圖（`ch12`）。\n\n### 2. 思想實驗的內部矛盾法（Thought Experiment \u0026 Internal Contradiction）\n- **首次登場**：`ch02`（伽利略的兩塊石頭）\n- **白話定義**：完全接受對方的理論前提，順著對手的邏輯往前推演至極端，證明該前提必然導出兩個互相衝突、無法共存的矛盾結論。\n- **歷史現場**：伽利略面對亞里斯多德「重物下落快於輕物（v ∝ W）」的兩千年教條，假設重石速度為 8、輕石速度為 4。若綁在一起：慢石拖慢快石則速度 `\u003c 8`；總重量加重依常識速度又應 `\u003e 8`（基準數字 B1）。同一常識推出雙向互斥結論，教條不攻自破（見 ch02）。\n- **日常透鏡**：當身邊所有人都堅稱「這件事本來就這樣」時，試著將支持該說法的兩條推論綁在一起推到極限，看它們是否會彼此打架。\n- **關聯詞彙**：稀釋重力（`ch02`）、歸謬法（`ch09`）。\n\n### 3. 稀釋重力（Diluting Gravity）\n- **首次登場**：`ch02`（伽利略的兩塊石頭）\n- **白話定義**：當物理現象變化太過迅猛、現有測量工具無法捕捉其細節時，透過幾何路徑（如光滑斜面）將劇烈動作依精確幾何比例放慢，從而將不可測的困惑轉化為可精確計量的運動規律。\n- **歷史現場**：自由落體垂直墜落轉瞬即逝，十七世紀初既無高速攝影機亦無電子計時器。伽利略以光滑斜面滾動銅球，利用水鐘與音樂節拍測出銅球在連續時間間隔內的下落距離呈奇數比例（1 : 3 : 5 : 7），總距離與時間平方成正比（d ∝ t²）。\n- **日常透鏡**：當一個生活或工作衝突爆發得太快難以分析時，刻意拉長回饋週期或設置多道緩衝步驟，將快節奏的混亂放慢拆解。\n- **關聯詞彙**：奇數定律（`ch02`）、變數隔離（`ch04`）。\n\n### 4. 負面證據／缺席的異常（Negative Evidence / Absence of Anomaly）\n- **首次登場**：`ch03`（倫敦的水井與爪哇的米糠）\n- **白話定義**：當所有人的目光都聚焦在顯眼的受害者、損壞或強烈訊號時，刻意尋找「照理應該發生、身處風暴中心卻完全沒有發生」的沉默例外，用缺席的拼圖鎖定關鍵因。\n- **歷史現場**：1854 年倫敦寬街霍亂奪走五百多條人命，全城醫生歸咎於空氣惡臭。約翰·斯諾緊盯疫區正中央兩處安靜孤島：波蘭街濟貧院 535 人僅 5 死、寬街獅子釀酒廠約 70 名工人 0 死（基準數字 B2）。空氣無孔不入，若瘴氣致病，為何釀酒廠工人全員倖免？最終查明他們飲用自有深井水源，成功鎖定被污染的寬街水井（見 ch03）。\n- **日常透鏡**：面對系統性故障或團隊危機時，別只問「誰出事了」，先去調查「誰明明處於同樣危險環境卻安然無恙」。\n- **關聯詞彙**：控制對照（`ch03`）、訊號脫鉤（`ch05`）。\n\n### 5. 控制對照（Controlled Comparison）\n- **首次登場**：`ch03`（倫敦的水井與爪哇的米糠）\n- **白話定義**：在研究複雜現象時，透過人為設置或自然形成的平行組別，確保兩組在其他所有環境條件完全一致，僅在單一關鍵變數上存在差異，以此剔除環境混雜干擾。\n- **歷史現場**：艾克曼實驗室的病雞因廚師換餵糙米而意外全數康復（B4）；隨後艾克曼與福德曼調查爪哇 101 所監獄近三十萬名囚犯，發現吃精製白米監獄發病率 1/39（約 2.56%），吃未精製糙米監獄僅 1/10,725（約 0.0093%），兩者相差近 300 倍（基準數字 B3），以無可辯駁的對照數據敲定飲食差異。\n- **日常透鏡**：在嘗試新工作法或調整生活習慣時，避免同時改變十種變數；保持背景穩定，一次只調整一個習慣以觀察淨效果。\n- **關聯詞彙**：負面證據（`ch03`）、營養缺乏症（`ch03`）。\n\n### 6. 營養缺乏症與減法思維（Nutritional Deficiency \u0026 Subtractive Etiology）\n- **首次登場**：`ch03`（倫敦的水井與爪哇的米糠）\n- **白話定義**：打破「任何不良結果必因外來多出有害成分（如病菌、毒素、外力干擾）」的加法直覺，轉而追問「在精煉、加工或簡化過程中，是否少掉了某種維持系統平衡不可或缺的微量要素」。\n- **歷史現場**：十九世紀末巴斯德與科赫細菌學大盛，醫學界深信腳氣病必由多出來的細菌所致。艾克曼起初也尋找病菌與白米毒素，直到格林斯於 1901 年徹底翻轉問題方向：「不再追問白米裡多出了什麼毒，改問把糙米碾成白米時丟掉了什麼必需營養？」，由此誕生維生素 B1 與營養缺乏概念（見 ch03）。\n- **日常透鏡**：當一個原本運轉順暢的組織或個人突然陷入疲憊與機能低落時，別急著猜測「進來了什麼破壞者」，先檢查「最近是否減掉了某個看似不起眼的生活習慣或溝通環節」。\n- **關聯詞彙**：語意切除（`ch11`）、減法提問（`ch11`）。\n\n### 7. 拆解複合公式與懷疑常數（Formula Decomposition \u0026 Constant Scrutiny）\n- **首次登場**：`ch04`（萊特兄弟的風洞）\n- **白話定義**：當實測結果與教科書權威公式推導出的數值產生巨大落差時，不盲目懷疑自身工藝，而是將複合相乘的黑盒子公式拆成獨立變量，逐一查驗其中被視為神聖真理、沿用數十上百年的經驗常數。\n- **歷史現場**：1901 年萊特兄弟在小鷹鎮試飛滑翔機，實測升力只有理論計算值的三分之一。他們拆開升力公式 L ＝ k · S · V² · C_L，在風洞中測量逾兩百種機翼曲面，發現自 1759 年起被工程界抄了一百五十年的斯米頓氣壓係數（k ＝ 0.005）虛胖了近五成，實測值其實接近 0.0033（基準數字 B5），一舉解開升力崩塌之謎（見 ch04）。\n- **日常透鏡**：當業務預估或財務模型出現嚴重失準時，檢查算式裡那些無人質疑、據說是「產業慣例」的基準轉換率與係數。\n- **關聯詞彙**：風洞與變數隔離（`ch04`）、殘差不丟棄原則（`ch06`）。\n\n### 8. 訊號脫鉤（Signal-Quantity Decoupling）\n- **首次登場**：`ch05`（塞西莉亞·佩恩的星光）\n- **白話定義**：破除「儀器上最顯眼粗黑、振幅最強的訊號必定對應數量最多的實體」這層感官混淆，體認到訊號強度是由「實體數量」與「當前環境激發機率」兩者共同決定的乘積。\n- **歷史現場**：二十世紀初天文學界根據太陽光譜中鐵與鈣的暗線最粗最黑，斷定太陽成分與地球地殼相同（主要是鐵與岩石）。塞西莉亞·佩恩引入薩哈熱游離方程式，證明在恆星表面溫度下，只有十億分之一的氫原子處於吸收可見光的激發狀態；還原激發機率後，太陽中的氫與氦豐度實際上比鐵高出一萬到一百萬倍（10⁶，基準數字 B6）。\n- **日常透鏡**：在公眾討論或社交媒體上，叫聲最響亮、反應最激烈的意見，往往只是激發條件剛好合適的極少數，絕非沉默大眾的真實分佈。\n- **關聯詞彙**：熱游離理論（`ch05`）、負面證據（`ch03`）。\n\n### 9. 殘差不丟棄原則（The Non-Discarded Residual Principle）\n- **首次登場**：`ch06`（鴿子糞便與宇宙餘溫）\n- **白話定義**：在精密實驗或工程校準中，當窮盡所有已知干擾源後依然頑固存在的微小偏差，絕不可為了圖方便用旋鈕強制歸零或當成雜訊丟棄；頑固的殘差往往標誌著既有體系的邊界。\n- **歷史現場**：1964 年彭齊亞斯與威爾遜利用貝爾實驗室號角天線測量銀河邊緣，在 4080 MHz 頻段無論對準何處、日夜四季皆測得約 3.5 K 的超額天線噪聲（基準數字 B7）。他們拆解接縫貼鋁箔膠帶、清除鴿巢與糞便，確認殘差不減且無損耗，拒絕強行歸零，最終與普林斯頓理論家合作確立了大霹靂的宇宙微波背景輻射（見 ch06）。\n- **日常透鏡**：記帳月結或排程管理中反覆出現的微小差額，別隨手填入「雜項微差」一筆帶過，認真端詳那往往是流程盲點所在。\n- **關聯詞彙**：零基準校準（`ch06`）、拆解複合公式（`ch04`）。\n\n### 10. 平坦旋轉曲線與暗物質暈（Flat Rotation Curve \u0026 Dark Matter Halo）\n- **首次登場**：`ch07`（薇拉·魯賓的星系邊緣）\n- **白話定義**：螺旋星系外圍發光氣體雲的旋轉速度並未如克卜勒定律（v ∝ 1/√r）隨半徑衰減，而是維持恆定高速度的觀測現象；打破了「發光物質等於全部質量」的沉默假設，推導出星系外圍包覆著巨大的非發光暗物質暈。\n- **歷史現場**：1970 年薇拉·魯賓與肯特·福特利用影像管光譜儀測量仙女座星系 M31 從距中心 3 kpc 到 24 kpc 的 67 個發射區（基準數字 B8），發現外圍旋轉曲線平坦停留在約 200 km/s，證明星系總質量隨半徑線性增加（M(r) ∝ r），揭開暗物質存在的核心觀測證據（見 ch07）。\n- **日常透鏡**：在評估團隊或專案運轉時，別把所有產出歸功於站在台上發光發熱的少數明星，去尋找那些支撐著系統高運轉的「隱形暗質量」。\n- **關聯詞彙**：邊緣觀測（`ch07`）、訊號脫鉤（`ch05`）。\n\n### 11. 動態秩序與轉座子（Dynamic Order \u0026 Transposon）\n- **首次登場**：`ch08`（麥克林托克的玉米田）\n- **白話定義**：不將看似隨機斑駁的表象視為雜亂無章的瑕疵，而是從其空間尺寸與發生時機解碼出背後受調控的動態開關機制；證實遺傳單元並非如念珠般固定在染色體上，而是具備自主或受控移動位置的能力。\n- **歷史現場**：1940 年代遺傳學界視染色體為靜態座位表。麥克林托克在冷泉港觀察玉米籽粒斑點，發現斑點大小反映突變發生的細胞分裂代數（早變大斑、晚變小斑），進一步抓出第 9 號染色體斷裂點會移動，發現由活化子（Ac）調控解離子（Ds）跳躍的控制系統，創立轉座子理論（見 ch08）。\n- **日常透鏡**：面對日常中斷斷續續出現的瑕疵或波動，不要輕率視為運氣不好，分析其發生的時間間隔與規模，尋找背後的節奏觸發器。\n- **關聯詞彙**：殘差不丟棄原則（`ch06`）、動詞拆解（`ch11`）。\n\n### 12. 翻轉隱藏公設（Axiom Reversal）\n- **首次登場**：`ch09`（兩千年的平行線執念）\n- **白話定義**：當一個問題歷經數百年、無數頂尖心智正面攻堅依然無法證明時，問題往往不在於論證技巧，而是題目本身暗中預設了一條「不必為真」的隱形公設；將該假定否定或替換，即可開啟全新範式。\n- **歷史現場**：歐幾里得《幾何原本》第五公設（平行公設）歷經兩千年證明皆告循環論證。薩凱里於 1733 年用反證法推出雙曲幾何定理卻因恐懼退縮；匈牙利青年博伊亞伊於 1823 年 11 月 3 日（基準數字 B9）頓悟「證不出是因為它不必為真」，與羅巴切夫斯基各自創立非歐幾何，為後續愛因斯坦廣義相對論奠定時空彎曲語言。\n- **日常透鏡**：當一個困局陷入曠日持久的爭吵且毫無進展時，退後一步列出大家「沒有明說但暗中默許遵守」的潛規則，問一句：「如果我們把這條規則拿掉呢？」。\n- **關聯詞彙**：非歐幾何（`ch09`）、尺度依賴（`ch10`）。\n\n### 13. 尺度依賴與分數維度（Scale-Dependence \u0026 Fractional Dimension）\n- **首次登場**：`ch10`（英國的海岸線有多長）\n- **白話定義**：自然界中高度粗糙不規則的幾何邊界，其「長度」並非客觀固定的單一數值，而是隨測量工具步長縮小而呈冪律發散（L(ε) ∝ ε^(1−D)）；描述此種填滿空間能力的指數 D 即為分數維度，以此重鑄假問題。\n- **歷史現場**：理查森發現西班牙與葡萄牙官方記載國界長度相差逾 20%（987 km vs 1214 km）；曼德博於 1967 年指出「海岸線有多長」是預設平滑世界的假問題，測量結果完全取決於尺規步長，計算出英國西海岸分數維度 D ≈ 1.25（基準數字 B10），並於 1975 年命名碎形（fractal）（見 ch10）。\n- **日常透鏡**：在爭論「一個任務需要花多久時間」或「一段關係有多複雜」時，先確認雙方拿的是多大解析度的尺規；不談顆粒度，討論指標毫無意義。\n- **關聯詞彙**：翻轉隱藏公設（`ch09`）、動詞拆解（`ch11`）。\n\n### 14. 動詞拆解與圖靈機（Action Decomposition \u0026 Turing Machine）\n- **首次登場**：`ch11`（把「計算」與「訊息」拆開）\n- **白話定義**：剝離人類心智、主觀意識與神經生理修辭，將看似高深莫測的動詞（如「心算」「推理」）還原為一條格子紙帶、一個讀寫頭與有限內部狀態跳轉的最極簡離散物理動作集。\n- **歷史現場**：1936 年圖靈面對希爾伯特判定問題，沒有陷入意識本質的形上學爭論，而是仔細觀察小學生在方格紙上算加法的具體動作，將其拆解為「看格子符號、擦除、重寫新符號、左移或右移一格、轉換狀態」五步有限機械規則，證明通用圖靈機存在與停機問題不可解，奠定現代計算機科學（見 ch11）。\n- **日常透鏡**：當一個龐大名詞（如「提升創造力」「具備戰略思維」）讓人無從下手時，把它切碎為「每天早晨打開哪份文件、寫下哪三行文字」的具體物理動作。\n- **關聯詞彙**：語意切除（`ch11`）、位元與資訊熵（`ch11`）。\n\n### 15. 語意切除與位元資訊熵（Semantic Stripping, Bit \u0026 Information Entropy）\n- **首次登場**：`ch11`（把「計算」與「訊息」拆開）\n- **白話定義**：在研究通訊與資訊傳輸時，大刀闊斧將思想、喜怒哀樂與文字含義排除於工程之外；純粹將「資訊」定義為「在接收端消除不確定性的能力」，以二元猜測次數（bit）量化資訊熵（H = −Σ pᵢ log₂ pᵢ）。\n- **歷史現場**：1948 年夏農在貝爾實驗室發表〈通訊的數學理論〉，宣布「通訊的語意面向與工程問題完全無關」。無論電纜裡流淌的是莎士比亞十四行詩還是隨機亂碼，只要在接收端消除相同的或然率不確定性，所消耗的容量完全相同，促成數位通訊革命（見 ch11）。\n- **日常透鏡**：在需要高效跨部門傳遞訊息時，切除客套修飾與情緒語氣，直接列出選項分支與二元確認清單，以最低的不確定性完成對齊。\n- **關聯詞彙**：動詞拆解（`ch11`）、減法思維（`ch03`）。\n\n### 16. 專有名詞的麻醉術（Label Anesthesia）\n- **首次登場**：`ch12`（在日常裡養出問題感）\n- **白話定義**：人類心智在面對未知或困惑時，誤以為只要給該現象貼上一個成熟的專業術語標籤（如「那是慣性」「那是重力」「那是轉座子」），就等於自己已經理解了其深層本質，從而過早關閉好奇心開關的防衛習慣。\n- **歷史現場**：費曼童年時父親告誡他：知道一隻鳥的名字（如褐斑鶇），對這隻鳥在做什麼、為何梳理羽毛一無所知。全書十二位探索者皆拒絕接受同時代權威賦予的標籤（「瘴氣」「天然運動」「地面雜訊」「念珠座位」），重新撬開名字背後的物理運作。\n- **日常透鏡**：當自己或他人脫口說出「因為這是某某效應」或「這本來就是某某現象」時，警惕麻醉感，多問一句：「如果拿掉這個名詞，它到底在做什麼動作？」。\n- **關聯詞彙**：問題顯影地圖（`ch12`）、動詞拆解（`ch11`）。\n"}, {"id": "style-guide", "file": "style-guide.md", "group": "內部文件（_meta）", "title": "寫作風格指南（內部文件，非書籍內容）", "md": "# 寫作風格指南（內部文件，非書籍內容）\n\n本文件是《問題誕生之前：從理所當然到值得追問》的寫作契約。每一章都必須遵守，否則全書會失去一致性。\n\n## 這本書是什麼、不是什麼\n\n- **是**：一本給對世界好奇的一般讀者的「問題誕生學」深讀作品（form = `narrative`，reader register = `general`）。透過歷史上科學家、哲學家、數學家、發明家的真實探索歷程，帶讀者走進「解答出現之前」的那段幽暗時刻：\n  1. **當時的人（包含探索者自己）原本把什麼視為理所當然？**\n  2. **哪一個格格不入的微小細節、殘差或矛盾引起了注意？**\n  3. **最初模糊、說不上來的困惑，如何經過拆解、轉換尺度或翻轉前提，逐漸收斂成一個「值得追問、可以回答」的真問題？**\n- **不是**：\n  - 不是科學史流水帳或偉人傳記合輯——不寫生平大事紀，不造神，不灌雞湯，不喊「只要堅持就能成功」；歷史場景唯一的作用，是讓讀者親身經歷「問題在眼前卻還看不見」的認知張力。\n  - 不是「提問技巧速成手冊」——不列空洞的口號公式、不用六段固定教條模板；本書希望讀者跟著故事自己慢慢領悟，在讀完每一章時，不知不覺學會一種觀看日常的新眼光。\n  - 不是某個行業的內部筆記——**全書面向一般受過基礎教育、對世界好奇的讀者，不假設任何專業背景，絕不寫入任何個人履歷、公司或工程師行話**。當需要連結到讀者的日常經驗時，一律使用每個人都經歷過的普遍生活場景（搭車、看地圖、廚房、看診、修理家電、看氣象預報）。\n\n## 脊椎（貫穿全書的單一主線）\n\n**每一個改變世界的答案，都始於有人對一句「本來就這樣」起了疑心，並把一團模糊的困惑鍛造成一把精準的問號。**\n\n這條脊椎在全書每一章都以「**問題顯影四階**（The Four Stages of Question Genesis）」作為內在敘事弧線（融入連續散文敘事中，不作為生硬的填空表格）：\n1. **背景噪音**（The Taken-for-Granted）：當時所有人覺得天經地義、甚至不覺得那裡有問題的「透明前提」。\n2. **刺眼裂縫**（The Snag / Anomaly）：一個怎麼抹都抹不掉的怪異細節——一個多出來的數字、一群「應該生病卻沒生病」的人、一條不肯下降的曲線、兩句合在一起會打架的常識。\n3. **困惑對焦**（From Fog to Focus）：探索者最初怎麼問錯問題、撞上死胡同，最後如何換一個動詞、換一把尺、或切掉多餘的雜訊，把「怎麼會這樣？」變成「如果 A 成立，B 應該是多少？」。\n4. **日常顯影**（The Everyday Lens）：章末不寫「課後測驗」，而是留給讀者一個生活中的微觀觀察鏡頭——當你走出這一章，今天在街上、廚房或新聞裡，哪一句「本來就這樣」值得你多看兩眼？\n\n## 讀者校準（Reader Profile \u0026 Register）\n\n- **目標讀者**：對世界充滿好奇、喜歡思考、但不一定具備理工或哲學專業背景的一般讀者（Reader register: `general`）。\n- **預設已具備**（Assume-known）：日常生活常識、國中至高中基礎算術與幾何直覺（比例、速度＝距離÷時間、平均數、三角形內角和 180°、簡單的面積與距離概念）。\n- **當場用白話與直覺帶出**（Teach-in-context）：凡是故事中涉及的科學或數學概念（如游離、光譜暗線、角動量與引力平衡、資訊熵、分數維度、非歐幾何公設），一律用故事現場的具體事物與數字一步步算給讀者看，不甩專業術語，不假設讀者背過公式。\n- **個人材料規則**：遵守 `zh-prose.md`，不引用任何個人履歷、職涯或特定技術系統。\n\n## 章節排序原則（Chapter-Arc Principle）\n\n全書 12 章按「**問題生成的四種深層機制**（難度由淺入深、從感官走向抽象）」排列：\n- **Part I｜撬開「本來就這樣」**（ch01–ch03）：問題被「太熟悉的常識」擋住。探索者必須先讓熟悉的事物變陌生（伽利略的落體與思想實驗、斯諾地圖上「沒生病的人」與艾克曼吃白米生病的爪哇雞群）。\n- **Part II｜聽見「不對勁的雜訊」**（ch04–ch06）：問題藏在「跟預期差一點點」的殘差裡。多數人把誤差掃進地毯下，探索者卻緊咬那個微小的不合（萊特兄弟少掉三分之二的升力、塞西莉亞·佩恩被權威斥為荒謬的太陽氫譜線、彭齊亞斯與威爾遜除不掉的 3.5 K 雜訊）。\n- **Part III｜看穿「沉默的預設」**（ch07–ch09）：問題卡在「所有人共用的隱形框架」。要問出真問題，必須先看見自己站在什麼假設上（薇拉·魯賓不肯慢下來的星系邊緣、麥克林托克玉米粒上的跳躍基因、博伊亞伊與羅巴切夫斯基放棄證明第五公設）。\n- **Part IV｜重鑄「問題的形狀」**（ch10–ch12）：最高階的提問——原本的問題根本問錯了。探索者透過換一把尺、剝離無關維度，把一團哲學迷霧變成可計算的新世界（曼德博的英國海岸線、圖靈與夏農如何把「計算」與「訊息」拆成動作與位元、以及 ch12 收官：在日常生活中培養「問題感」的完整地圖）。\n\n## Form Contract — Narrative（深讀散文體契約）\n\n1. **一章一核心主題，連續散文推進**：\n   - **禁止使用 `instructional` 的六段固定標題骨架**（不得出現 `## 從你已知的出發`、`## 直覺的陷阱`、`## 紙上推演`、`## 自我檢核`、`## 延伸閱讀` 等教科書欄位）。\n   - 每章內部的小節標題（`##`）必須跟隨該章的人物故事與推理轉折量身命名，服務於敘事張力。\n2. **零灌水**（Zero Filler）：\n   - 每一段文字都必須推進故事或深化「問題如何成形」的洞察。禁止「本章我們將介紹…」「總結來說，以上我們看到了…」這類空洞過渡段。\n3. **跨章概念與交叉引用**（Mandatory Cross-references）：\n   - 每個核心方法論概念（如「思想實驗的內部矛盾法」「負面證據／缺席的異常」「殘差不丟棄原則」「公設翻轉」「尺度依賴」）在首次登場的章節完整定義與展開；後續章節再次觸及時，以「（見 chNN）」自然回扣，不重複定義。\n4. **深度與具體算例**（Depth \u0026 Concrete Walkthrough）：\n   - 雖然是面對大眾的敘事體，**絕不犧牲具體性**。每章必須維持充足深度（5,000–8,000 中文字），並包含**至少一個放在 ` ```text ` 圍欄區塊內的具體數字／邏輯推演對照框**（例如：伽利略綁石頭的速度矛盾推演、倫敦寬街霍亂未發病者與爪哇監獄白米對糙米的發病率對照表、萊特兄弟斯米頓係數的升力落差試算、海岸線隨尺規縮小的長度倍增表），讓一般讀者親眼看見「模糊困惑如何變成精確問題」。\n   - ASCII 圖表或資訊框必須遵守 CJK=2 欄寬對齊規則，並通過 `check_diagrams.py`。\n5. **史實與數字鐵律**：\n   - 所有歷史年份、數據、人物引述與傳說標註，嚴格對齊 `_meta/landscape-2026-10.md` 與 `outline.md` 的基準數字表。傳說（如比薩斜塔丟球、比薩教堂吊燈）必須誠實點明是傳記作者記載的傳說，並說明為何「真實的思維過程比傳說更精彩」。\n\n## zh-TW 措辭契約（白話直述，動詞優先）\n\n寫給人讀的繁體中文（台灣慣用語），不是譯稿。判斷標準：一句話唸出聲，像不像一個博學而誠懇的朋友在跟你講故事。\n\n### 禁止簡體字與中國大陸慣用語\n- 機率（不用「概率」）、資訊（不用「信息」）、預設（不用「默認」）、演算法（不用「算法」）、品質（不用「質量」指好壞）、常態（不用「正態」）、變異（不用「方差」）、網路（不用「網絡」）、透過／藉由（不用「通過…來」表手段）。\n\n### 禁止的翻譯腔模式（lint 以 WARN 偵測）\n\n| 模式 | 改法 | 例 |\n|---|---|---|\n| 「進行／加以」＋動作名詞 | 直接用動詞 | 進行觀察 → 觀察；進行分析 → 分析 |\n| 「透過…的方式」 | 用／靠／以 | 透過測量的方式發現 → 測量後發現 |\n| 「在…的情況下」 | 當／若／…時 | 在沒有望遠鏡的情況下 → 沒有望遠鏡時 |\n| 「對於…而言」 | 對… | 對於當時的醫生而言 → 對當時的醫生來說 |\n| 「存在著」 | 有 | 存在著一個矛盾 → 有一個矛盾 |\n| 「是…的」空殼斷言連用 | 拆掉空殼 | 這是不可能的 → 這不可能 |\n| 「作為（一個）…」開頭 | 換主語直述 | 作為一個年輕學者，他… → 年輕的他… |\n\n### 節奏與句構\n- 一段一個核心畫面或論點；綿密的歷史細節描寫之後，用一個乾淨有力的短句收束。\n- 名詞化堆疊（「…的…的…的」三連以上）一律拆開重寫。\n- 被動語態「被」只在受事者是焦點時使用；平常一律用主動語態。\n"}, {"id": "outline", "file": "outline.md", "group": "內部文件（_meta）", "title": "大綱與各章規格（內部文件，非書籍內容）", "md": "# 大綱與各章規格（內部文件，非書籍內容）\n\n書名（工作名）：《問題誕生之前：從理所當然到值得追問》\n定位：面向對世界好奇的一般讀者的「問題誕生學」深讀作品（form = `narrative`，reader register = `general`）。不假設專業背景，透過科學、數學、哲學、發明史上的真實探索現場，帶讀者體會：人們原本把什麼當成理所當然、哪個微小細節刺破了常識、模糊的困惑又如何被鍛造成值得追問的問題。\n\n## 全書脊椎（Spine）\n\n「**問題顯影四階**（The Four Stages of Question Genesis）」：\n每一個偉大發現的起點，都不是靈光一閃的答案，而是一場「把背景變成前景」的視覺轉換：\n1. **理所當然的背景**（The Taken-for-Granted）：當時所有人（包括探索者自己）習焉不察、覺得「本來就這樣」的隱形前提。\n2. **刺眼的微小細節**（The Snag / Anomaly）：一個不肯乖乖聽話的例外——一塊矛盾的石頭、一群沒生病的釀酒工、一個差了三分之二的升力、一段抹不掉的 3.5 K 雜訊。\n3. **從迷霧到對焦**（From Fog to Focus）：探索者如何擺脫最初問錯的死胡同，透過「拆開重組」「換一把尺」「找缺席者」或「翻轉公設」，把模糊的困惑收斂成精準可解的問題。\n4. **日常的回聲**（The Everyday Lens）：當讀者合上這一章，如何把這副透鏡帶回自己的日常生活，看見身邊那些被「本來就這樣」蓋住的問題。\n\n每一章的規格皆明確交代該章如何扣合這條脊椎。\n\n## 全書路線圖（各 Part 首章 ch01 / ch04 / ch07 / ch10 置於章首引言後）\n\n```text\n問題誕生之前 — 四個部分・十二章\n\n  Part I   撬開「本來就這樣」──── ch01 看不見的空氣：一個問題如何誕生\n  │                               ch02 伽利略的兩塊石頭：把常識逼到自相矛盾\n  │                               ch03 倫敦的水井與爪哇的米糠：看見「缺席的東西」\n  │\n  Part II  聽見「不對勁的雜訊」── ch04 萊特兄弟的風洞：當教科書讓你摔進沙丘\n  │                               ch05 塞西莉亞・佩恩的星光：全世界都以為太陽是鐵做的\n  │                               ch06 鴿子糞便與宇宙餘溫：除不掉的 3.5 度雜訊\n  │\n  Part III 看穿「沉默的預設」──── ch07 薇拉・魯賓的星系邊緣：為什麼外圍的星星沒有慢下來\n  │                               ch08 麥克林托克的玉米田：誰說基因必須乖乖坐好\n  │                               ch09 兩千年的平行線執念：如果證不出來是因為它不必為真\n  │\n  Part IV  重鑄「問題的形狀」──── ch10 英國的海岸線有多長：當答案取決於你拿什麼尺\n                                  ch11 把「計算」與「訊息」拆開：圖靈的紙帶與夏農的位元\n                                  ch12 在日常裡養出問題感：十二把拆開理所當然的透鏡\n```\n\n## 基準數字表（canonical；`_meta/running-examples.md` 是本表的逐字副本，禁止手改副本）\n\n| 代號 | 數值 | 單位／意義 | 擁有概念 | 引用章節 |\n|---|---|---|---|---|\n| B1 | 8 與 4 | 伽利略綁石頭思想實驗：重石下落速度 8、輕石 4，綁在一起時同時推出 `\u003c 8` 與 `\u003e 8` 的矛盾 | 思想實驗的內部矛盾法 | ch01, ch02, ch12 |\n| B2 | 535 人死 5 人（釀酒廠 70 人 0 死） | 1854 倫敦寬街霍亂疫區核心的波蘭街濟貧院（自有水井）535 人僅 5 死；緊鄰幫浦的獅子釀酒廠約 70 名工人 0 死（地圖共標 578 例死亡） | 負面證據（缺席的異常） | ch01, ch03, ch12 |\n| B3 | 1/39 vs 1/10,725 | 1897 爪哇 101 所監獄（近 30 萬囚犯）腳氣病調查：吃精製白米發病率 1/39（約 2.56%），吃未精製糙米僅 1/10,725（相差近 300 倍） | 從「多出什麼毒」翻轉為「少掉什麼營養」 | ch03, ch12 |\n| B4 | 1889–1890 | 艾克曼實驗室病雞因廚師停餵軍醫院剩餘精製白米、改餵廉價糙米而意外全數康復的轉折年 | 偶然事件中的對照組 | ch03, ch12 |\n| B5 | 0.005 vs 0.0033 | 萊特兄弟抓出被盲信 150 年的斯米頓氣壓係數（0.005 高估約 50%，實測近 0.0033），解釋 1901 滑翔機升力僅預期約 1/3 的落差 | 拆解複合公式與懷疑常數 | ch04, ch12 |\n| B6 | 100 萬倍（10⁶） | 塞西莉亞・佩恩 1925 博士論文推算出恆星大氣中氫與氦的豐度比鐵等重元素高出約一百萬倍 | 區分「訊號強度」與「真實數量」 | ch05, ch12 |\n| B7 | 3.5 K（4080 MHz） | 彭齊亞斯與威爾遜 1964 在波長 7.35 cm（4080 MHz）量到除不掉的 3.5 K 背景殘差（宇宙微波背景輻射 CMB，現代精確值 2.725 K） | 殘差不丟棄原則 | ch06, ch12 |\n| B8 | 67 個區域（至 24 kpc） | 薇拉・魯賓與福特 1970 量測仙女座星系 M31 從 3 到 24 kpc 共 67 個發射區，發現旋轉曲線平坦（約 200 km/s 不隨 1/√r 衰減） | 預期曲線與邊界觀測 | ch07, ch12 |\n| B9 | 1823 年 11 月 3 日 | 博伊亞伊致信父親宣告「從虛無中創造了奇異新世界」，放棄用前四公設證明第五公設（1832 發表；羅巴切夫斯基 1829 發表） | 翻轉隱藏公設 | ch09, ch12 |\n| B10 | D ≈ 1.25 | 曼德博 1967 英國西海岸線分數維度（理查森發現西葡邊界記載差逾 20%：987 km vs 1214 km，長度隨尺規縮小呈 L(ε) ∝ ε^(1−D) 發散） | 尺度依賴與重鑄問題 | ch10, ch12 |\n\n---\n\n# 各章規格\n\n## Part I — 撬開「本來就這樣」\n\n### ch01 — 看不見的空氣：一個問題如何誕生\n- **檔案**：`ch01-invisible-air.md`\n- **目標**：作為全書總序章，打破讀者對「天才總是靈光一閃想到答案」的迷思。用三個橫跨時代的微型現場（日常裡每天走過卻說不出有幾階的樓梯、伽利略對「重物落得快」的起疑 B1、約翰·斯諾在倫敦霍亂疫區核心盯著「沒生病的釀酒廠工人與濟貧院院民」B2），建立全書的脊椎——「**問題顯影四階**」：理所當然的背景 → 刺眼的微小細節 → 從迷霧到對焦 → 日常的回聲。\n- **與脊椎的連結**：正面定義並示範全書脊椎「問題顯影四階」，作為後續每一章的觀看框架。\n- **必涵蓋**：\n  1. 為什麼「發現問題」比「解決問題」更難？因為大腦為了省力，會自動把熟悉的事物壓縮成看不見的「背景」（習慣化與理所當然的保護殼）。\n  2. 兩個歷史快門的對比預告：伽利略如何不靠精密儀器，光靠把兩塊速度 8 與 4 的石頭綁在一起（B1），就發現人們信了兩千年的常識在邏輯上自相矛盾；1854 年倫敦蘇活區爆發奪走五百多條人命的猛烈霍亂時，所有醫生都在空氣臭味（瘴氣）裡打轉，約翰·斯諾（John Snow）卻緊盯著疫區正中央兩群「不該平安無事卻活得好好的缺席者」——波蘭街濟貧院 535 人僅 5 死、寬街獅子釀酒廠約 70 名工人 0 死（B2）。\n  3. 模糊的困惑（「怪怪的、哪裡不對勁」）為什麼還不是一個好問題？一個「值得追問的問題」具備什麼特徵（把籠統的感嘆句，收斂成有邊界、可檢驗、能指出矛盾點的問句）。\n  4. 帶讀者做一次紙上顯影：拿一個日常生活裡人人都說「本來就這樣」的現象（為什麼鏡子只顛倒左右、不顛倒上下？），一步步拆解我們原本把什麼當成理所當然、哪個細節不對勁、最後如何問出真正的問題。\n  5. 全書四個 Part 的路線圖與邀請。\n- **必不涵蓋**：伽利略斜面實驗的完整推導（見 ch02）；斯諾追查遠方漢普斯特德寡婦案與艾克曼爪哇病雞／白米腳氣病的完整調查過程（見 ch03）。\n- **具體推演框**（` ```text `）：\n  - 全書路線圖（Part I 首章必放）。\n  - 「鏡子為什麼顛倒左右卻不顛倒上下？」的四階問題顯影拆解表（展示從「假問題」到「真問題：其實鏡子顛倒的是前後軸 Z→−Z」的完整收斂過程），並並列 B1（速度 8 與 4）與 B2（濟貧院 535 死 5、釀酒廠 70 人 0 死）作為歷史對照。\n\n### ch02 — 伽利略的兩塊石頭：把常識逼到自相矛盾\n- **檔案**：`ch02-galileo-stones.md`\n- **目標**：透過伽利略對自由落體與單擺的研究，理解當一個常識（「重的東西掉得比較快」）因為符合日常經驗而堅不可摧時，探索者如何利用**思想實驗的內部矛盾**撬開縫隙，再透過「把快動作放慢（斜面稀釋重力）」把無法測量的困惑變成可測量的問題。\n- **與脊椎的連結**：展現脊椎第一型——當「理所當然」來自每天親眼所見的感官經驗（羽毛確實比石頭慢）時，如何用邏輯矛盾（B1）刺破感官假象，並把「為什麼會掉下來」重鑄為「怎麼掉下來（距離與時間的關係）」。\n- **必涵蓋**：\n  1. 亞里斯多德的常識為什麼統治了兩千年？因為它在生活裡「看起來每天都對」（金幣比紙片快）。\n  2. 誠實破除兩個著名傳說（照 landscape）：比薩斜塔丟鐵球與 1583 年比薩主教座堂看吊燈，皆出自晚年學生ヴィヴィアーニ（Viviani, 1654）的傳記；說明為何真實的伽利略（1590《論運動》與 1638《兩門新科學》的思想實驗、1602 致友人的信）比傳說更深刻。\n  3. 綁石頭思想實驗（B1：重石速度 8、輕石 4，綁在一起既 `\u003c 8` 又 `\u003e 8`）如何不花一毛錢就擊碎兩千年的教條。\n  4. 從「發現舊說法有錯」到「形成新問題」的關鍵一躍：放棄追問亞里斯多德式的「物體為什麼要往下掉（目的論）」，改問「物體下落的距離如何隨時間變化？」；以及如何用斜面滾銅球解決「掉太快量不到」的困境（奇數定律 `1, 3, 5, 7` 與 `d ∝ t²`）。\n- **必不涵蓋**：牛頓萬有引力與星系旋轉曲線（見 ch07）。\n- **具體推演框**（` ```text `）：綁石頭思想實驗的速度矛盾推演（8 與 4 的雙向夾擊 B1）＋ 斜面滾球在連續相等時間間隔內的距離比（`1 : 3 : 5 : 7` 累加為平方數 `1, 4, 9, 16`）。\n\n### ch03 — 倫敦的水井與爪哇的米糠：看見「缺席的東西」\n- **檔案**：`ch03-soho-and-java.md`\n- **目標**：透過 1854 年約翰·斯諾的倫敦寬街霍亂調查（B2）與 1889–1897 年克里斯蒂安·艾克曼（Christiaan Eijkman）在爪哇的腳氣病與白米調查（B3, B4），理解探索者如何突破「只盯著受害者與顯眼病因」的盲點，學會看見「**該生病卻沒生病的缺席者**」以及「**不是多出了什麼毒，而是少掉了什麼營養**」。\n- **與脊椎的連結**：展現脊椎中「刺眼的微小細節」最隱蔽卻最強大的姿態——**缺席**（Absence）。在斯諾眼中，是疫區中心「缺席的死亡（B2）」；在艾克曼與格林斯眼中，是細菌學黃金時代裡「缺席的病菌」與白米碾磨後「缺席的米糠（B3, B4）」。\n- **必涵蓋**：\n  1. 1854 年 8 月底倫敦蘇活區寬街霍亂大爆發（首週末 89 死、總計約 500–600 死，斯諾地圖標註 578 例）：全城深信臭氣（瘴氣）致病，但斯諾問了一個反過來的問題——如果空氣有毒，為什麼緊鄰寬街水井的波蘭街濟貧院 535 名收容人只死 5 人、寬街獅子釀酒廠約 70 名工人 0 死（B2）？以及遠在漢普斯特德（Hampstead）卻因每天派人去寬街打水喝而暴斃的寡婦 Susannah Eley，這兩塊正反拼圖如何把問題鎖定在「誰喝了那口井的水」。\n  2. 1880 年代末荷屬東印度爪哇的另一場瘟疫——腳氣病（beriberi）：當時巴斯德與科赫的細菌學說剛大獲全勝，所有醫學家都把「找病源」等同於「在顯微鏡下找多出來的細菌或毒素」。\n  3. 1889–1890 年巴達維亞實驗室的離奇轉折（B4）：艾克曼養的雞群突然集體出現酷似腳氣病的雙腿癱瘓，幾個月後卻又莫名其妙全數康復！追查之下才發現，前任廚師貪圖方便拿軍醫院廚房煮給軍官吃的**精製白米**剩飯餵雞，新廚師上任後認為「不該拿高級軍用白米餵民用雞」，改回廉價的**未精製糙米**，病雞竟然就不藥而癒。\n  4. 1897 年爪哇 101 所監獄（近 30 萬囚犯）的大規模對照（B3）：吃精製白米的監獄發病率高達 1/39（約 2.56%），吃糙米的監獄卻只有 1/10,725（相差近 300 倍）！以及艾克曼與助手格林斯（Gerrit Grijns, 1901）如何完成問題的終極翻轉：停止追問「白米裡有什麼細菌或毒素？」，改問「**把糙米碾成白米時，我們丟掉了什麼維持生命不可或缺的微量物質？**」（維生素 B1 與營養缺乏症概念的誕生）。\n- **必不涵蓋**：維生素 B1 化學結構的現代有機合成細節。\n- **具體推演框**（` ```text `）：斯諾寬街霍亂「疫區內沒死的人 vs 疫區外卻死的人」雙向異常對照框（B2）＋ 1897 爪哇 101 所監獄白米 vs 糙米發病率（1/39 vs 1/10,725，差近 300 倍 B3, B4）與問題翻轉推演框。\n\n## Part II — 聽見「不對勁的雜訊」\n\n### ch04 — 萊特兄弟的風洞：當教科書讓你摔進沙丘\n- **檔案**：`ch04-wright-wind-tunnel.md`\n- **目標**：透過萊特兄弟在 1900–1901 年小鷹鎮試飛挫敗後的研究轉折，理解當一個人照著權威公式做出來的東西卻只有預期效果的三分之一時，如何從「懷疑自己手藝不好」轉向「懷疑公式裡那個被沿用了 150 年的常數（B5）」。\n- **與脊椎的連結**：展現脊椎第二型——當實測與理論出現巨大殘差時，多數人怪罪運氣或放棄，真正的提問者卻把一條複合公式拆開，逐一拷問每一個被視為神聖不可侵犯的零件。\n- **必涵蓋**：\n  1. Part II 首章路線圖。\n  2. 萊特兄弟並不是靠蠻力試誤的腳踏車工匠：他們出發前熟讀了當時最權威的李林塔爾（Lilienthal）氣動力學表與升力公式。\n  3. 1900 與 1901 年小鷹鎮沙丘上的困惑：1901 年滑翔機實際產生的升力只有公式計算值的約三分之一。\n  4. 模糊的挫折如何變成精準的問題：「到底是我們的機翼縫歪了、李林塔爾的升力係數錯了，還是那個自 1759 年起全世界的工程師都抄了 150 年的斯米頓氣壓係數（Smeaton coefficient `k = 0.005`）根本是錯的？」\n  5. 腳踏車前輪上的第三個輪子與 1901 年底自製的六英尺風洞：把真實天空的亂流關進木箱，抓出 `k` 其實接近 `0.0033`（B5，舊值高估了約 50%），並重測逾 200 種機翼剖面。\n- **必不涵蓋**：1903 年之後的專利戰與航空商業史。\n- **具體推演框**（` ```text `）：Part II 路線圖 ＋ 萊特兄弟拆解升力公式 `L = k · S · V² · C_L` 的除錯對照框（B5：`k = 0.005` vs `0.0033` 如何造成升力預期崩塌）。\n\n### ch05 — 塞西莉亞・佩恩的星光：全世界都以為太陽是鐵做的\n- **檔案**：`ch05-cecilia-payne-stars.md`\n- **目標**：透過 1925 年塞西莉亞·佩恩發現「恆星主要由氫與氦構成（B6）」的歷程，理解人們如何因為**把「最顯眼的訊號」直接等同於「數量最多的東西」這件事**而看錯整個宇宙，以及一個年輕研究者如何在權威的反對下看穿這層混淆。\n- **與脊椎的連結**：展現「刺眼細節」如何來自跨領域工具的碰撞（把印度物理學家薩哈的量子熱游離公式帶進哈佛天文台的玻璃底片室），揭露「看得見的暗線強弱 ≠ 元素多寡」這個被全體天文學家忽略的前提。\n- **必涵蓋**：\n  1. 1920 年代前的天文學鐵律：地球與太陽同源，太陽表面光譜裡鐵、鈣的吸收暗線最黑最粗，所以太陽的成分一定跟地球地殼差不多（主要是鐵、矽、鈣）。\n  2. 佩恩帶進哈佛天文台的新問題：如果把薩哈（Meghnad Saha, 1920）剛提出的「高溫游離方程式」算進恆星光譜，那些暗線的強弱到底代表「元素有多少」，還是代表「當時的溫度剛好讓幾分之幾的原子處於能吸收光的狀態」？\n  3. 震撼的計算結果：氫在多數恆星表面溫度下要嘛還沒激發、要嘛已經被剝光電子，只有極小比例能產生可見光暗線；一旦還原這個比例，太陽與恆星裡的氫與氦竟比鐵等重元素多出一百萬倍（`10⁶`，B6）！\n  4. 權威羅素（Henry Norris Russell）為何斷言「顯然不可能」，迫使佩恩在 1925 年博士論文寫下「幾乎肯定不是真實的」，以及 1929 年羅素如何自己重算後低頭承認。\n- **必不涵蓋**：核融合（貝特 Hans Bethe 1930s）的詳細核反應鏈。\n- **具體推演框**（` ```text `）：「顯眼程度 ≠ 真實數量」的光譜游離還原算例框（示範為何 100 萬個氫原子裡只有極少數在特定溫度下顯影，卻能跟少數鐵原子畫出差不多深的暗線，B6）。\n\n### ch06 — 鴿子糞便與宇宙餘溫：除不掉的 3.5 度雜訊\n- **檔案**：`ch06-cosmic-hiss.md`\n- **目標**：透過 1964 年彭齊亞斯與威爾遜發現宇宙微波背景輻射（CMB，B7）的故事，理解當實驗裡出現一段怎麼清都清不掉的「雜訊」時，它如何從一個令人抓狂的工程故障，轉變成回答宇宙起源的鑰匙。\n- **與脊椎的連結**：展現脊椎中「別人的垃圾是你的問題」——當探索者拒絕假裝沒看到那 3.5 K 的殘差，並與另一群正在尋找答案卻苦無天線的理論家相遇時，模糊的雜訊瞬間對焦成宇宙級的問題。\n- **必涵蓋**：\n  1. 1964 年紐澤西州貝爾實驗室的 20 英尺號角天線：彭齊亞斯與威爾遜原本根本不是在找宇宙起源，他們只想把天線校準成「絕對安靜」的零基準，好測量銀河系微弱射電訊號。\n  2. 那個不肯消失的 3.5 K（波長 7.35 公分、頻率 4080 MHz，B7）：不管對準天空哪個方向、白天或半夜、夏天或冬天，總有一陣相當於絕對零度以上約 3.5 度的「嘶嘶聲」。\n  3. 窮盡一切「理所當然的故障原因」：檢查液態氦冷卻源、拆開接頭貼鋁箔膠帶、甚至爬進號角天線誘捕一對白鴿並刷洗「白色介電物質（鴿糞）」——雜訊依然分毫不減。\n  4. 問題的轉向：當所有「儀器壞了、地面干擾、太陽系干擾」都被畫上叉，剩下的問題只剩一個：「什麼樣的訊號，能夠從整個宇宙四面八方完全均勻地射向地球？」以及他們如何透過一通電話連上幾十公里外普林斯頓大學的迪克（Robert Dicke）團隊。\n- **必不涵蓋**：暴脹理論與現代 CMB 各向異性功率譜細節。\n- **具體推演框**（` ```text `）：彭齊亞斯與威爾遜的 4080 MHz 天線溫度拆解帳本（大氣貢獻 + 天線本體與地面貢獻 + 無法解釋的 3.5 K 殘差 B7，以及逐項排除表）。\n\n## Part III — 看穿「沉默的預設」\n\n### ch07 — 薇拉・魯賓的星系邊緣：為什麼外圍的星星沒有慢下來\n- **檔案**：`ch07-vera-rubin-galaxy.md`\n- **目標**：透過薇拉·魯賓與肯特·福特在 1970 年代量測仙女座星系（M31）旋轉曲線（B8）的歷程，理解當所有人都在熱門的星系中心爭論時，走到「沒人去看的邊緣」去檢驗一個「大家都覺得不用驗」的常識，會如何撬開暗物質的大門。\n- **與脊椎的連結**：展現脊椎第三型——看穿「沉默的預設（看得見的光＝全部的質量）」。魯賓並不是一開始就想找暗物質，她只是去量那條「理應照克卜勒定律往下掉」的曲線，結果曲線卻平得像一把尺。\n- **必涵蓋**：\n  1. Part III 首章路線圖。\n  2. 天文學界視為天經地義的預期：就像太陽系裡越遠的行星繞得越慢（水星約 47 km/s、海王星約 5.4 km/s，遵循 `v ∝ 1/√r`），螺旋星系的光芒全集中在中心，外圍黑漆漆一片，所以外圍的氣體雲一定轉得很慢。\n  3. 為什麼以前沒人認真量外圍？因為外圍太暗，傳統光譜儀拍一張要曝光幾十個小時；直到福特（Kent Ford）帶著新研發的影像管光譜儀與魯賓合作。\n  4. 1970 年仙女座星系（M31）的 67 個發射區（從距中心 3 kpc 一路量到 24 kpc，B8）：數據點一個個點上去，速度居然停在約 200 km/s 完全不肯掉下來！\n  5. 當預期曲線與實測曲線分道揚鑣，問題如何從「我是不是量錯了？」收斂為兩個驚心動魄的二選一：「要嘛牛頓引力在星系尺度失效了，要嘛星系外圍包著一團我們完全看不見、質量卻比發光星體大上好幾倍的東西（暗物質）。」\n- **必不涵蓋**：粒子物理學對暗物質候選粒子（WIMP、軸子）的偵測實驗細節。\n- **具體推演框**（` ```text `）：Part III 路線圖 ＋ 太陽系克卜勒衰減（`v ∝ 1/√r`）對照仙女座星系 M31 實測平坦曲線（3–24 kpc, 67 個區域 B8）的數據與隱藏假設拆解框。\n\n### ch08 — 麥克林托克的玉米田：誰說基因必須乖乖坐好\n- **檔案**：`ch08-mcclintock-corn.md`\n- **目標**：透過芭芭拉·麥克林托克在 1940 年代從玉米籽粒的斑點看出「跳躍基因（轉座子）」的故事，理解當整個學界都被「基因像念珠一樣固定在染色體上」這幅靜態圖景綁住時，一個人如何靠著對微小斑點規律的極致凝視，問出比時代早三十年的問題。\n- **與脊椎的連結**：展現「異常不是雜亂無章，而是另一種還沒被讀懂的秩序」——別人把斑駁玉米粒當成隨機突變的瑕疵，麥克林托克卻在斑點的「大小與時機」裡看見了開關。\n- **必涵蓋**：\n  1. 1940 年代遺傳學的「念珠串（beads on a string）」常識：染色體是張固定座位表，基因一輩子坐在同一個位子上，頂多壞掉（突變）或整段交換。\n  2. 麥克林托克在冷泉港玉米田裡盯著什麼看？一顆玉米粒上深深淺淺的紫色與黃色斑點——大斑點代表細胞在發育很早期就改變了顏色，小斑點代表很晚期才變。\n  3. 刺眼的細節：為什麼有些品系的玉米，第 9 號染色體總是在「同一個特定位置」斷裂？而且這種斷裂與顏色開關，竟然會在一代代之間「換位置」？\n  4. 從困惑到 Ac/Ds 控制元件問題的形成：如果基因位子是固定的，就不可能解釋這種有節奏的開關；除非染色體上有某個元件（解離子 Ds）會在另一個元件（活化子 Ac）的指揮下，從一個座位跳到另一個座位！以及 1951 年發表時的冰冷沉默與 1983 年的諾貝爾獎平反。\n- **必不涵蓋**：現代 CRISPR 或分子選殖的實驗操作步驟。\n- **具體推演框**（` ```text `）：玉米籽粒斑點大小 ↔ 發育細胞分裂代數 ↔ Ac/Ds 跳躍時機的邏輯推演圖。\n\n### ch09 — 兩千年的平行線執念：如果證不出來是因為它不必為真\n- **檔案**：`ch09-fifth-postulate.md`\n- **目標**：透過歐幾里得第五公設（平行公設）兩千年證明史，一路走到薩凱里（Saccheri）的擦肩而過與博伊亞伊（Bolyai, 1823 B9）、羅巴切夫斯基的徹底翻轉，理解當無數聰明人卡在同一個問題兩千年時，真正的突破往往不是「更用力地解題」，而是看穿「**這個問題本身預設了一個不必為真的前提**」。\n- **與脊椎的連結**：展現脊椎第三型的極致——把「我怎麼樣才能證明 A？」翻轉成「如果 A 根本不是定理，而是一條可以替換的遊戲規則呢？」。\n- **必涵蓋**：\n  1. 歐幾里得《幾何原本》裡的那根刺：前四條公設短小精悍、一目了然，唯獨第五公設（等價於：過直線外一點，恰有一條平行線）像極了還沒證出來的定理。\n  2. 薩凱里（Girolamo Saccheri, 1733）的悲喜劇：他為了用歸謬法證明第五公設，大膽假設「過線外一點有不止一條平行線（銳角假設）」，一口氣推導出幾十條雙曲幾何的正確定理——卻在最後關頭因為覺得「太違反直覺」，硬拗說這違反直線的本性，親手把新世界關上。\n  3. 博伊亞伊父子的警告與突破：父親 Farkas 苦勸兒子「千萬別碰平行線，那會奪走你的健康與快樂」，年輕的亞諾什·博伊亞伊卻在 1823 年 11 月 3 日（B9）恍然大悟：**我們一直找不到矛盾，是不是因為它根本沒有矛盾？**\n  4. 從「唯一的真實空間」到「可替換的公設系統」：當問題從「怎麼證明第五公設」變成「換掉第五公設會長出什麼樣的宇宙」，非歐幾何誕生，並在近百年後成為愛因斯坦廣義相對論描寫彎曲時空的語言。\n- **必不涵蓋**：黎曼流形張量微積分的具體算式。\n- **具體推演框**（` ```text `）：歐氏幾何 vs 薩凱里／博伊亞伊雙曲幾何 vs 球面幾何的三欄對照框（平行線條數、三角形內角和、薩凱里在哪一步退縮 vs 博伊亞伊 1823 年 B9 在哪一步跨過去）。\n\n## Part IV — 重鑄「問題的形狀」\n\n### ch10 — 英國的海岸線有多長：當答案取決於你拿什麼尺\n- **檔案**：`ch10-coastline-of-britain.md`\n- **目標**：透過理查森（Richardson）對國界長度的困惑與曼德博（Mandelbrot, 1967 B10）的〈英國的海岸線有多長？〉，理解有些看似簡單直白的問題（「這條線有多長？」），其實在現實中沒有單一答案；只有當你發現「答案隨測量的尺規而變」，把問題重鑄為「它隨尺度變化的規律是什麼」，才會打開全新的視野。\n- **與脊椎的連結**：展現脊椎第四型——重鑄問題的形狀。當不同的人對同一個問題給出截然不同卻各自合理的數字時，別急著吵誰量錯了，先問「我們拿的尺是不是預設了平滑的世界？」。\n- **必涵蓋**：\n  1. Part IV 首章路線圖。\n  2. 理查森翻百科全書發現的怪事：為什麼西班牙人說西葡邊界長 987 公里，葡萄牙人卻說是 1214 公里，差了超過 20%（B10）？\n  3. 拿分規在地圖上跨步：用 100 公里的尺量、用 10 公里的尺量、用 1 公里的尺量、甚至繞著海邊每一顆鵝卵石量——圓周的長度會收斂到 `2πr`，但海岸線的長度 `L(ε)` 卻隨著尺規 `ε` 縮小而無止境地變長！\n  4. 曼德博 1967 年的致命一問：如果「英國海岸線有多長」這個問題的答案是「看你拿多小的尺（趨近無限大）」，那「長度」在這裡就是個問錯的問題！真正該問的問題是：**當尺縮小一半時，多出來的皺褶遵循什麼比例？**\n  5. 分數維度（英國西海岸 `D ≈ 1.25`，B10）與碎形（fractal）的誕生：一條比一維直線更曲折、卻還沒填滿二維平面的線，以及這個視角如何改變我們看待雲朵、血管、山脈與日常爭議的方式。\n- **必不涵蓋**：複數平面曼德博集合（`z_{n+1} = z_n² + c`）的混沌動力學細節。\n- **具體推演框**（` ```text `）：Part IV 路線圖 ＋ 尺規步長 `ε` 每次縮小為 `1/3` 時，平滑直線 vs 科赫曲線／粗糙海岸線的長度倍增與維度計算框（B10：`D ≈ 1.25`）。\n\n### ch11 — 把「計算」與「訊息」拆開：圖靈的紙帶與夏農的位元\n- **檔案**：`ch11-turing-and-shannon.md`\n- **目標**：透過 1936 年圖靈對「計算（computation）」的拆解與 1948 年夏農對「訊息（information）」的拆解，理解面對像「思考」「計算」「溝通」這樣龐大、模糊、充滿人類主觀色彩的詞彙時，探索者如何靠著「**大刀闊斧切掉無關的心理與語意雜訊**」，提煉出乾淨到可以用數學回答的核心問題。\n- **與脊椎的連結**：展現問題成形的最高手藝——「減法的提問」。當問題因為塞進太多日常意義而動彈不得時，先問：「如果把意義跟情緒全部拿掉，剩下的最基本動作是什麼？」\n- **必涵蓋**：\n  1. 1930 年代的迷霧：數學家希爾伯特問「有沒有一套機械化程序能判定所有數學命題？」，但沒有人說得清楚什麼叫做「機械化程序（計算）」。\n  2. 圖靈（1936）不去看高深的公式，反而盯著「一個正在算算術的人類計算員」問：他眼睛看哪裡、手寫什麼、腦子裡需要記住幾個狀態？從而把「計算」收斂成一條格子紙帶、一個讀寫頭與一張狀態表（圖靈機）。\n  3. 夏農（1937 碩士論文把邏輯變開關；1948〈通訊的數學理論〉）面對的另一團迷霧：電話線跟電報到底在傳送什麼？如果一句話有喜怒哀樂、有深奧意義，怎麼可能用數學算它的「容量」？\n  4. 夏農的驚人一刀：「**通訊的語意面向與工程問題完全無關。**」 不管你傳的是莎士比亞十四行詩還是午餐菜單，訊息的本質就只是「替接收端消除了多少不確定性（幾次二元猜測 bit）」。\n- **必不涵蓋**：停機問題的對角線法完整形式證明（指向《這句話無法被證明》）；現代編碼理論細節。\n- **具體推演框**（` ```text `）：圖靈把「人類心算加法」拆解成紙帶動作的四步狀態表 ＋ 夏農把「一句話的資訊量」剝離語意後化為二元提問次數（bit）的對照框。\n\n### ch12 — 在日常裡養出問題感：十二把拆開理所當然的透鏡\n- **檔案**：`ch12-everyday-lenses.md`\n- **目標**：全書收官。不寫空泛的勵志結語，而是將前 11 章歷史人物從「理所當然 → 刺眼細節 → 模糊困惑 → 精準問題」的探索歷程，提煉成一般讀者在生活、閱讀、工作與觀察世界時隨時可用的「問題顯影地圖」，並完整回收 B1–B10 所有基準案例。\n- **與脊椎的連結**：把全書脊椎「問題顯影四階」正式移交給讀者，將歷史人物的眼光轉化為讀者自己的日常習慣。\n## 必涵蓋：\n  1. 回顧全書十個歷史現場與基準數字（B1 伽利略 8 與 4、B2 斯諾濟貧院 535 死 5 與釀酒廠 70 人 0 死、B3 艾克曼與爪哇 101 所監獄白米對糙米發病率 1/39 vs 1/10,725、B4 1889–1890 病雞因換回糙米康復、B5 萊特兄弟斯米頓係數 0.005 vs 0.0033、B6 佩恩恆星氫豐度 100 萬倍、B7 彭齊亞斯與威爾遜 3.5 K / 4080 MHz、B8 魯賓 M31 的 67 個區域至 24 kpc、B9 博伊亞伊 1823 年 11 月 3 日的平行線翻轉、B10 曼德博海岸線 D ≈ 1.25 與理查森 20% 邊界差、以及圖靈與夏農的減法拆解）。\n  2. 為什麼我們長大後問題變少了？不是因為我們都懂了，而是因為我們學會了用「專有名詞」貼標籤（說出「那是慣性」「那是基因」「那是通膨」，就以為自己懂了，從而關掉了追問的開關）。\n  3. 給讀者的五個日常提問觸發器：\n     - 當大家都說「本來就這樣」時，試著把兩個常識綁在一起看會不會打架（伽利略鏡片）。\n     - 當一場災難或現象發生時，別只看「誰中招了」，去問「誰明明在旁邊卻沒事？」（斯諾鏡片）。\n     - 當結果跟預期差一截時，別急著怪自己手拙，把規則拆開看哪個常數是抄來的（萊特／佩恩／彭齊亞斯鏡片）。\n     - 當一個問題卡死很久時，檢查題目裡是不是偷偷塞了一條沒人承認的假設（魯賓／麥克林托克／博伊亞伊鏡片）。\n     - 當兩個答案吵不完時，看看是不是尺規不同，或者詞彙裡塞了太多需要切掉的雜質（曼德博／圖靈／夏農鏡片）。\n  4. 結尾實戰：帶讀者用這套眼光，重新走過一次每天早晨出門到晚間回家的日常街道，指出三個原本透明、現在卻閃閃發光的好問題。\n- **必不涵蓋**：不引入任何新的歷史人物長篇故事。\n- **具體推演框**（` ```text `）：全書「問題誕生總表」（人物 × 原本理所當然的前提 × 刺眼的微小細節 × 轉換後的真問題 × 基準數據 B1–B10 全回收）。\n\n## 附錄（P2.5 後編纂）\n\n- **附錄 A — 歷史探索者與問題誕生年表**（`appendix-a-timeline.md`）：按時間軸整理書中登場人物、所處時代背景、打破的常識與關鍵年份。\n- **附錄 B — 概念與思維工具索引**（`appendix-b-glossary.md`）：思想實驗、負面證據、控制對照、殘差、熱游離、旋轉曲線、轉座子、平行公設、分數維度、圖靈機、資訊熵等核心詞彙的白話定義與首次登場章節。\n"}, {"id": "running-examples", "file": "running-examples.md", "group": "內部文件（_meta）", "title": "大綱與各章規格（內部文件，非書籍內容）", "md": "# 大綱與各章規格（內部文件，非書籍內容）\n\n書名（工作名）：《問題誕生之前：從理所當然到值得追問》\n定位：面向對世界好奇的一般讀者的「問題誕生學」深讀作品（form = `narrative`，reader register = `general`）。不假設專業背景，透過科學、數學、哲學、發明史上的真實探索現場，帶讀者體會：人們原本把什麼當成理所當然、哪個微小細節刺破了常識、模糊的困惑又如何被鍛造成值得追問的問題。\n\n## 全書脊椎（Spine）\n\n「**問題顯影四階**（The Four Stages of Question Genesis）」：\n每一個偉大發現的起點，都不是靈光一閃的答案，而是一場「把背景變成前景」的視覺轉換：\n1. **理所當然的背景**（The Taken-for-Granted）：當時所有人（包括探索者自己）習焉不察、覺得「本來就這樣」的隱形前提。\n2. **刺眼的微小細節**（The Snag / Anomaly）：一個不肯乖乖聽話的例外——一塊矛盾的石頭、一群沒生病的釀酒工、一個差了三分之二的升力、一段抹不掉的 3.5 K 雜訊。\n3. **從迷霧到對焦**（From Fog to Focus）：探索者如何擺脫最初問錯的死胡同，透過「拆開重組」「換一把尺」「找缺席者」或「翻轉公設」，把模糊的困惑收斂成精準可解的問題。\n4. **日常的回聲**（The Everyday Lens）：當讀者合上這一章，如何把這副透鏡帶回自己的日常生活，看見身邊那些被「本來就這樣」蓋住的問題。\n\n每一章的規格皆明確交代該章如何扣合這條脊椎。\n\n## 全書路線圖（各 Part 首章 ch01 / ch04 / ch07 / ch10 置於章首引言後）\n\n```text\n問題誕生之前 — 四個部分・十二章\n\n  Part I   撬開「本來就這樣」──── ch01 看不見的空氣：一個問題如何誕生\n  │                               ch02 伽利略的兩塊石頭：把常識逼到自相矛盾\n  │                               ch03 倫敦的水井與爪哇的米糠：看見「缺席的東西」\n  │\n  Part II  聽見「不對勁的雜訊」── ch04 萊特兄弟的風洞：當教科書讓你摔進沙丘\n  │                               ch05 塞西莉亞・佩恩的星光：全世界都以為太陽是鐵做的\n  │                               ch06 鴿子糞便與宇宙餘溫：除不掉的 3.5 度雜訊\n  │\n  Part III 看穿「沉默的預設」──── ch07 薇拉・魯賓的星系邊緣：為什麼外圍的星星沒有慢下來\n  │                               ch08 麥克林托克的玉米田：誰說基因必須乖乖坐好\n  │                               ch09 兩千年的平行線執念：如果證不出來是因為它不必為真\n  │\n  Part IV  重鑄「問題的形狀」──── ch10 英國的海岸線有多長：當答案取決於你拿什麼尺\n                                  ch11 把「計算」與「訊息」拆開：圖靈的紙帶與夏農的位元\n                                  ch12 在日常裡養出問題感：十二把拆開理所當然的透鏡\n```\n\n## 基準數字表（canonical；`_meta/running-examples.md` 是本表的逐字副本，禁止手改副本）\n\n| 代號 | 數值 | 單位／意義 | 擁有概念 | 引用章節 |\n|---|---|---|---|---|\n| B1 | 8 與 4 | 伽利略綁石頭思想實驗：重石下落速度 8、輕石 4，綁在一起時同時推出 `\u003c 8` 與 `\u003e 8` 的矛盾 | 思想實驗的內部矛盾法 | ch01, ch02, ch12 |\n| B2 | 535 人死 5 人（釀酒廠 70 人 0 死） | 1854 倫敦寬街霍亂疫區核心的波蘭街濟貧院（自有水井）535 人僅 5 死；緊鄰幫浦的獅子釀酒廠約 70 名工人 0 死（地圖共標 578 例死亡） | 負面證據（缺席的異常） | ch01, ch03, ch12 |\n| B3 | 1/39 vs 1/10,725 | 1897 爪哇 101 所監獄（近 30 萬囚犯）腳氣病調查：吃精製白米發病率 1/39（約 2.56%），吃未精製糙米僅 1/10,725（相差近 300 倍） | 從「多出什麼毒」翻轉為「少掉什麼營養」 | ch03, ch12 |\n| B4 | 1889–1890 | 艾克曼實驗室病雞因廚師停餵軍醫院剩餘精製白米、改餵廉價糙米而意外全數康復的轉折年 | 偶然事件中的對照組 | ch03, ch12 |\n| B5 | 0.005 vs 0.0033 | 萊特兄弟抓出被盲信 150 年的斯米頓氣壓係數（0.005 高估約 50%，實測近 0.0033），解釋 1901 滑翔機升力僅預期約 1/3 的落差 | 拆解複合公式與懷疑常數 | ch04, ch12 |\n| B6 | 100 萬倍（10⁶） | 塞西莉亞・佩恩 1925 博士論文推算出恆星大氣中氫與氦的豐度比鐵等重元素高出約一百萬倍 | 區分「訊號強度」與「真實數量」 | ch05, ch12 |\n| B7 | 3.5 K（4080 MHz） | 彭齊亞斯與威爾遜 1964 在波長 7.35 cm（4080 MHz）量到除不掉的 3.5 K 背景殘差（宇宙微波背景輻射 CMB，現代精確值 2.725 K） | 殘差不丟棄原則 | ch06, ch12 |\n| B8 | 67 個區域（至 24 kpc） | 薇拉・魯賓與福特 1970 量測仙女座星系 M31 從 3 到 24 kpc 共 67 個發射區，發現旋轉曲線平坦（約 200 km/s 不隨 1/√r 衰減） | 預期曲線與邊界觀測 | ch07, ch12 |\n| B9 | 1823 年 11 月 3 日 | 博伊亞伊致信父親宣告「從虛無中創造了奇異新世界」，放棄用前四公設證明第五公設（1832 發表；羅巴切夫斯基 1829 發表） | 翻轉隱藏公設 | ch09, ch12 |\n| B10 | D ≈ 1.25 | 曼德博 1967 英國西海岸線分數維度（理查森發現西葡邊界記載差逾 20%：987 km vs 1214 km，長度隨尺規縮小呈 L(ε) ∝ ε^(1−D) 發散） | 尺度依賴與重鑄問題 | ch10, ch12 |\n\n---\n\n# 各章規格\n\n## Part I — 撬開「本來就這樣」\n\n### ch01 — 看不見的空氣：一個問題如何誕生\n- **檔案**：`ch01-invisible-air.md`\n- **目標**：作為全書總序章，打破讀者對「天才總是靈光一閃想到答案」的迷思。用三個橫跨時代的微型現場（日常裡每天走過卻說不出有幾階的樓梯、伽利略對「重物落得快」的起疑 B1、約翰·斯諾在倫敦霍亂疫區核心盯著「沒生病的釀酒廠工人與濟貧院院民」B2），建立全書的脊椎——「**問題顯影四階**」：理所當然的背景 → 刺眼的微小細節 → 從迷霧到對焦 → 日常的回聲。\n- **與脊椎的連結**：正面定義並示範全書脊椎「問題顯影四階」，作為後續每一章的觀看框架。\n- **必涵蓋**：\n  1. 為什麼「發現問題」比「解決問題」更難？因為大腦為了省力，會自動把熟悉的事物壓縮成看不見的「背景」（習慣化與理所當然的保護殼）。\n  2. 兩個歷史快門的對比預告：伽利略如何不靠精密儀器，光靠把兩塊速度 8 與 4 的石頭綁在一起（B1），就發現人們信了兩千年的常識在邏輯上自相矛盾；1854 年倫敦蘇活區爆發奪走五百多條人命的猛烈霍亂時，所有醫生都在空氣臭味（瘴氣）裡打轉，約翰·斯諾（John Snow）卻緊盯著疫區正中央兩群「不該平安無事卻活得好好的缺席者」——波蘭街濟貧院 535 人僅 5 死、寬街獅子釀酒廠約 70 名工人 0 死（B2）。\n  3. 模糊的困惑（「怪怪的、哪裡不對勁」）為什麼還不是一個好問題？一個「值得追問的問題」具備什麼特徵（把籠統的感嘆句，收斂成有邊界、可檢驗、能指出矛盾點的問句）。\n  4. 帶讀者做一次紙上顯影：拿一個日常生活裡人人都說「本來就這樣」的現象（為什麼鏡子只顛倒左右、不顛倒上下？），一步步拆解我們原本把什麼當成理所當然、哪個細節不對勁、最後如何問出真正的問題。\n  5. 全書四個 Part 的路線圖與邀請。\n- **必不涵蓋**：伽利略斜面實驗的完整推導（見 ch02）；斯諾追查遠方漢普斯特德寡婦案與艾克曼爪哇病雞／白米腳氣病的完整調查過程（見 ch03）。\n- **具體推演框**（` ```text `）：\n  - 全書路線圖（Part I 首章必放）。\n  - 「鏡子為什麼顛倒左右卻不顛倒上下？」的四階問題顯影拆解表（展示從「假問題」到「真問題：其實鏡子顛倒的是前後軸 Z→−Z」的完整收斂過程），並並列 B1（速度 8 與 4）與 B2（濟貧院 535 死 5、釀酒廠 70 人 0 死）作為歷史對照。\n\n### ch02 — 伽利略的兩塊石頭：把常識逼到自相矛盾\n- **檔案**：`ch02-galileo-stones.md`\n- **目標**：透過伽利略對自由落體與單擺的研究，理解當一個常識（「重的東西掉得比較快」）因為符合日常經驗而堅不可摧時，探索者如何利用**思想實驗的內部矛盾**撬開縫隙，再透過「把快動作放慢（斜面稀釋重力）」把無法測量的困惑變成可測量的問題。\n- **與脊椎的連結**：展現脊椎第一型——當「理所當然」來自每天親眼所見的感官經驗（羽毛確實比石頭慢）時，如何用邏輯矛盾（B1）刺破感官假象，並把「為什麼會掉下來」重鑄為「怎麼掉下來（距離與時間的關係）」。\n- **必涵蓋**：\n  1. 亞里斯多德的常識為什麼統治了兩千年？因為它在生活裡「看起來每天都對」（金幣比紙片快）。\n  2. 誠實破除兩個著名傳說（照 landscape）：比薩斜塔丟鐵球與 1583 年比薩主教座堂看吊燈，皆出自晚年學生ヴィヴィアーニ（Viviani, 1654）的傳記；說明為何真實的伽利略（1590《論運動》與 1638《兩門新科學》的思想實驗、1602 致友人的信）比傳說更深刻。\n  3. 綁石頭思想實驗（B1：重石速度 8、輕石 4，綁在一起既 `\u003c 8` 又 `\u003e 8`）如何不花一毛錢就擊碎兩千年的教條。\n  4. 從「發現舊說法有錯」到「形成新問題」的關鍵一躍：放棄追問亞里斯多德式的「物體為什麼要往下掉（目的論）」，改問「物體下落的距離如何隨時間變化？」；以及如何用斜面滾銅球解決「掉太快量不到」的困境（奇數定律 `1, 3, 5, 7` 與 `d ∝ t²`）。\n- **必不涵蓋**：牛頓萬有引力與星系旋轉曲線（見 ch07）。\n- **具體推演框**（` ```text `）：綁石頭思想實驗的速度矛盾推演（8 與 4 的雙向夾擊 B1）＋ 斜面滾球在連續相等時間間隔內的距離比（`1 : 3 : 5 : 7` 累加為平方數 `1, 4, 9, 16`）。\n\n### ch03 — 倫敦的水井與爪哇的米糠：看見「缺席的東西」\n- **檔案**：`ch03-soho-and-java.md`\n- **目標**：透過 1854 年約翰·斯諾的倫敦寬街霍亂調查（B2）與 1889–1897 年克里斯蒂安·艾克曼（Christiaan Eijkman）在爪哇的腳氣病與白米調查（B3, B4），理解探索者如何突破「只盯著受害者與顯眼病因」的盲點，學會看見「**該生病卻沒生病的缺席者**」以及「**不是多出了什麼毒，而是少掉了什麼營養**」。\n- **與脊椎的連結**：展現脊椎中「刺眼的微小細節」最隱蔽卻最強大的姿態——**缺席**（Absence）。在斯諾眼中，是疫區中心「缺席的死亡（B2）」；在艾克曼與格林斯眼中，是細菌學黃金時代裡「缺席的病菌」與白米碾磨後「缺席的米糠（B3, B4）」。\n- **必涵蓋**：\n  1. 1854 年 8 月底倫敦蘇活區寬街霍亂大爆發（首週末 89 死、總計約 500–600 死，斯諾地圖標註 578 例）：全城深信臭氣（瘴氣）致病，但斯諾問了一個反過來的問題——如果空氣有毒，為什麼緊鄰寬街水井的波蘭街濟貧院 535 名收容人只死 5 人、寬街獅子釀酒廠約 70 名工人 0 死（B2）？以及遠在漢普斯特德（Hampstead）卻因每天派人去寬街打水喝而暴斃的寡婦 Susannah Eley，這兩塊正反拼圖如何把問題鎖定在「誰喝了那口井的水」。\n  2. 1880 年代末荷屬東印度爪哇的另一場瘟疫——腳氣病（beriberi）：當時巴斯德與科赫的細菌學說剛大獲全勝，所有醫學家都把「找病源」等同於「在顯微鏡下找多出來的細菌或毒素」。\n  3. 1889–1890 年巴達維亞實驗室的離奇轉折（B4）：艾克曼養的雞群突然集體出現酷似腳氣病的雙腿癱瘓，幾個月後卻又莫名其妙全數康復！追查之下才發現，前任廚師貪圖方便拿軍醫院廚房煮給軍官吃的**精製白米**剩飯餵雞，新廚師上任後認為「不該拿高級軍用白米餵民用雞」，改回廉價的**未精製糙米**，病雞竟然就不藥而癒。\n  4. 1897 年爪哇 101 所監獄（近 30 萬囚犯）的大規模對照（B3）：吃精製白米的監獄發病率高達 1/39（約 2.56%），吃糙米的監獄卻只有 1/10,725（相差近 300 倍）！以及艾克曼與助手格林斯（Gerrit Grijns, 1901）如何完成問題的終極翻轉：停止追問「白米裡有什麼細菌或毒素？」，改問「**把糙米碾成白米時，我們丟掉了什麼維持生命不可或缺的微量物質？**」（維生素 B1 與營養缺乏症概念的誕生）。\n- **必不涵蓋**：維生素 B1 化學結構的現代有機合成細節。\n- **具體推演框**（` ```text `）：斯諾寬街霍亂「疫區內沒死的人 vs 疫區外卻死的人」雙向異常對照框（B2）＋ 1897 爪哇 101 所監獄白米 vs 糙米發病率（1/39 vs 1/10,725，差近 300 倍 B3, B4）與問題翻轉推演框。\n\n## Part II — 聽見「不對勁的雜訊」\n\n### ch04 — 萊特兄弟的風洞：當教科書讓你摔進沙丘\n- **檔案**：`ch04-wright-wind-tunnel.md`\n- **目標**：透過萊特兄弟在 1900–1901 年小鷹鎮試飛挫敗後的研究轉折，理解當一個人照著權威公式做出來的東西卻只有預期效果的三分之一時，如何從「懷疑自己手藝不好」轉向「懷疑公式裡那個被沿用了 150 年的常數（B5）」。\n- **與脊椎的連結**：展現脊椎第二型——當實測與理論出現巨大殘差時，多數人怪罪運氣或放棄，真正的提問者卻把一條複合公式拆開，逐一拷問每一個被視為神聖不可侵犯的零件。\n- **必涵蓋**：\n  1. Part II 首章路線圖。\n  2. 萊特兄弟並不是靠蠻力試誤的腳踏車工匠：他們出發前熟讀了當時最權威的李林塔爾（Lilienthal）氣動力學表與升力公式。\n  3. 1900 與 1901 年小鷹鎮沙丘上的困惑：1901 年滑翔機實際產生的升力只有公式計算值的約三分之一。\n  4. 模糊的挫折如何變成精準的問題：「到底是我們的機翼縫歪了、李林塔爾的升力係數錯了，還是那個自 1759 年起全世界的工程師都抄了 150 年的斯米頓氣壓係數（Smeaton coefficient `k = 0.005`）根本是錯的？」\n  5. 腳踏車前輪上的第三個輪子與 1901 年底自製的六英尺風洞：把真實天空的亂流關進木箱，抓出 `k` 其實接近 `0.0033`（B5，舊值高估了約 50%），並重測逾 200 種機翼剖面。\n- **必不涵蓋**：1903 年之後的專利戰與航空商業史。\n- **具體推演框**（` ```text `）：Part II 路線圖 ＋ 萊特兄弟拆解升力公式 `L = k · S · V² · C_L` 的除錯對照框（B5：`k = 0.005` vs `0.0033` 如何造成升力預期崩塌）。\n\n### ch05 — 塞西莉亞・佩恩的星光：全世界都以為太陽是鐵做的\n- **檔案**：`ch05-cecilia-payne-stars.md`\n- **目標**：透過 1925 年塞西莉亞·佩恩發現「恆星主要由氫與氦構成（B6）」的歷程，理解人們如何因為**把「最顯眼的訊號」直接等同於「數量最多的東西」這件事**而看錯整個宇宙，以及一個年輕研究者如何在權威的反對下看穿這層混淆。\n- **與脊椎的連結**：展現「刺眼細節」如何來自跨領域工具的碰撞（把印度物理學家薩哈的量子熱游離公式帶進哈佛天文台的玻璃底片室），揭露「看得見的暗線強弱 ≠ 元素多寡」這個被全體天文學家忽略的前提。\n- **必涵蓋**：\n  1. 1920 年代前的天文學鐵律：地球與太陽同源，太陽表面光譜裡鐵、鈣的吸收暗線最黑最粗，所以太陽的成分一定跟地球地殼差不多（主要是鐵、矽、鈣）。\n  2. 佩恩帶進哈佛天文台的新問題：如果把薩哈（Meghnad Saha, 1920）剛提出的「高溫游離方程式」算進恆星光譜，那些暗線的強弱到底代表「元素有多少」，還是代表「當時的溫度剛好讓幾分之幾的原子處於能吸收光的狀態」？\n  3. 震撼的計算結果：氫在多數恆星表面溫度下要嘛還沒激發、要嘛已經被剝光電子，只有極小比例能產生可見光暗線；一旦還原這個比例，太陽與恆星裡的氫與氦竟比鐵等重元素多出一百萬倍（`10⁶`，B6）！\n  4. 權威羅素（Henry Norris Russell）為何斷言「顯然不可能」，迫使佩恩在 1925 年博士論文寫下「幾乎肯定不是真實的」，以及 1929 年羅素如何自己重算後低頭承認。\n- **必不涵蓋**：核融合（貝特 Hans Bethe 1930s）的詳細核反應鏈。\n- **具體推演框**（` ```text `）：「顯眼程度 ≠ 真實數量」的光譜游離還原算例框（示範為何 100 萬個氫原子裡只有極少數在特定溫度下顯影，卻能跟少數鐵原子畫出差不多深的暗線，B6）。\n\n### ch06 — 鴿子糞便與宇宙餘溫：除不掉的 3.5 度雜訊\n- **檔案**：`ch06-cosmic-hiss.md`\n- **目標**：透過 1964 年彭齊亞斯與威爾遜發現宇宙微波背景輻射（CMB，B7）的故事，理解當實驗裡出現一段怎麼清都清不掉的「雜訊」時，它如何從一個令人抓狂的工程故障，轉變成回答宇宙起源的鑰匙。\n- **與脊椎的連結**：展現脊椎中「別人的垃圾是你的問題」——當探索者拒絕假裝沒看到那 3.5 K 的殘差，並與另一群正在尋找答案卻苦無天線的理論家相遇時，模糊的雜訊瞬間對焦成宇宙級的問題。\n- **必涵蓋**：\n  1. 1964 年紐澤西州貝爾實驗室的 20 英尺號角天線：彭齊亞斯與威爾遜原本根本不是在找宇宙起源，他們只想把天線校準成「絕對安靜」的零基準，好測量銀河系微弱射電訊號。\n  2. 那個不肯消失的 3.5 K（波長 7.35 公分、頻率 4080 MHz，B7）：不管對準天空哪個方向、白天或半夜、夏天或冬天，總有一陣相當於絕對零度以上約 3.5 度的「嘶嘶聲」。\n  3. 窮盡一切「理所當然的故障原因」：檢查液態氦冷卻源、拆開接頭貼鋁箔膠帶、甚至爬進號角天線誘捕一對白鴿並刷洗「白色介電物質（鴿糞）」——雜訊依然分毫不減。\n  4. 問題的轉向：當所有「儀器壞了、地面干擾、太陽系干擾」都被畫上叉，剩下的問題只剩一個：「什麼樣的訊號，能夠從整個宇宙四面八方完全均勻地射向地球？」以及他們如何透過一通電話連上幾十公里外普林斯頓大學的迪克（Robert Dicke）團隊。\n- **必不涵蓋**：暴脹理論與現代 CMB 各向異性功率譜細節。\n- **具體推演框**（` ```text `）：彭齊亞斯與威爾遜的 4080 MHz 天線溫度拆解帳本（大氣貢獻 + 天線本體與地面貢獻 + 無法解釋的 3.5 K 殘差 B7，以及逐項排除表）。\n\n## Part III — 看穿「沉默的預設」\n\n### ch07 — 薇拉・魯賓的星系邊緣：為什麼外圍的星星沒有慢下來\n- **檔案**：`ch07-vera-rubin-galaxy.md`\n- **目標**：透過薇拉·魯賓與肯特·福特在 1970 年代量測仙女座星系（M31）旋轉曲線（B8）的歷程，理解當所有人都在熱門的星系中心爭論時，走到「沒人去看的邊緣」去檢驗一個「大家都覺得不用驗」的常識，會如何撬開暗物質的大門。\n- **與脊椎的連結**：展現脊椎第三型——看穿「沉默的預設（看得見的光＝全部的質量）」。魯賓並不是一開始就想找暗物質，她只是去量那條「理應照克卜勒定律往下掉」的曲線，結果曲線卻平得像一把尺。\n- **必涵蓋**：\n  1. Part III 首章路線圖。\n  2. 天文學界視為天經地義的預期：就像太陽系裡越遠的行星繞得越慢（水星約 47 km/s、海王星約 5.4 km/s，遵循 `v ∝ 1/√r`），螺旋星系的光芒全集中在中心，外圍黑漆漆一片，所以外圍的氣體雲一定轉得很慢。\n  3. 為什麼以前沒人認真量外圍？因為外圍太暗，傳統光譜儀拍一張要曝光幾十個小時；直到福特（Kent Ford）帶著新研發的影像管光譜儀與魯賓合作。\n  4. 1970 年仙女座星系（M31）的 67 個發射區（從距中心 3 kpc 一路量到 24 kpc，B8）：數據點一個個點上去，速度居然停在約 200 km/s 完全不肯掉下來！\n  5. 當預期曲線與實測曲線分道揚鑣，問題如何從「我是不是量錯了？」收斂為兩個驚心動魄的二選一：「要嘛牛頓引力在星系尺度失效了，要嘛星系外圍包著一團我們完全看不見、質量卻比發光星體大上好幾倍的東西（暗物質）。」\n- **必不涵蓋**：粒子物理學對暗物質候選粒子（WIMP、軸子）的偵測實驗細節。\n- **具體推演框**（` ```text `）：Part III 路線圖 ＋ 太陽系克卜勒衰減（`v ∝ 1/√r`）對照仙女座星系 M31 實測平坦曲線（3–24 kpc, 67 個區域 B8）的數據與隱藏假設拆解框。\n\n### ch08 — 麥克林托克的玉米田：誰說基因必須乖乖坐好\n- **檔案**：`ch08-mcclintock-corn.md`\n- **目標**：透過芭芭拉·麥克林托克在 1940 年代從玉米籽粒的斑點看出「跳躍基因（轉座子）」的故事，理解當整個學界都被「基因像念珠一樣固定在染色體上」這幅靜態圖景綁住時，一個人如何靠著對微小斑點規律的極致凝視，問出比時代早三十年的問題。\n- **與脊椎的連結**：展現「異常不是雜亂無章，而是另一種還沒被讀懂的秩序」——別人把斑駁玉米粒當成隨機突變的瑕疵，麥克林托克卻在斑點的「大小與時機」裡看見了開關。\n- **必涵蓋**：\n  1. 1940 年代遺傳學的「念珠串（beads on a string）」常識：染色體是張固定座位表，基因一輩子坐在同一個位子上，頂多壞掉（突變）或整段交換。\n  2. 麥克林托克在冷泉港玉米田裡盯著什麼看？一顆玉米粒上深深淺淺的紫色與黃色斑點——大斑點代表細胞在發育很早期就改變了顏色，小斑點代表很晚期才變。\n  3. 刺眼的細節：為什麼有些品系的玉米，第 9 號染色體總是在「同一個特定位置」斷裂？而且這種斷裂與顏色開關，竟然會在一代代之間「換位置」？\n  4. 從困惑到 Ac/Ds 控制元件問題的形成：如果基因位子是固定的，就不可能解釋這種有節奏的開關；除非染色體上有某個元件（解離子 Ds）會在另一個元件（活化子 Ac）的指揮下，從一個座位跳到另一個座位！以及 1951 年發表時的冰冷沉默與 1983 年的諾貝爾獎平反。\n- **必不涵蓋**：現代 CRISPR 或分子選殖的實驗操作步驟。\n- **具體推演框**（` ```text `）：玉米籽粒斑點大小 ↔ 發育細胞分裂代數 ↔ Ac/Ds 跳躍時機的邏輯推演圖。\n\n### ch09 — 兩千年的平行線執念：如果證不出來是因為它不必為真\n- **檔案**：`ch09-fifth-postulate.md`\n- **目標**：透過歐幾里得第五公設（平行公設）兩千年證明史，一路走到薩凱里（Saccheri）的擦肩而過與博伊亞伊（Bolyai, 1823 B9）、羅巴切夫斯基的徹底翻轉，理解當無數聰明人卡在同一個問題兩千年時，真正的突破往往不是「更用力地解題」，而是看穿「**這個問題本身預設了一個不必為真的前提**」。\n- **與脊椎的連結**：展現脊椎第三型的極致——把「我怎麼樣才能證明 A？」翻轉成「如果 A 根本不是定理，而是一條可以替換的遊戲規則呢？」。\n- **必涵蓋**：\n  1. 歐幾里得《幾何原本》裡的那根刺：前四條公設短小精悍、一目了然，唯獨第五公設（等價於：過直線外一點，恰有一條平行線）像極了還沒證出來的定理。\n  2. 薩凱里（Girolamo Saccheri, 1733）的悲喜劇：他為了用歸謬法證明第五公設，大膽假設「過線外一點有不止一條平行線（銳角假設）」，一口氣推導出幾十條雙曲幾何的正確定理——卻在最後關頭因為覺得「太違反直覺」，硬拗說這違反直線的本性，親手把新世界關上。\n  3. 博伊亞伊父子的警告與突破：父親 Farkas 苦勸兒子「千萬別碰平行線，那會奪走你的健康與快樂」，年輕的亞諾什·博伊亞伊卻在 1823 年 11 月 3 日（B9）恍然大悟：**我們一直找不到矛盾，是不是因為它根本沒有矛盾？**\n  4. 從「唯一的真實空間」到「可替換的公設系統」：當問題從「怎麼證明第五公設」變成「換掉第五公設會長出什麼樣的宇宙」，非歐幾何誕生，並在近百年後成為愛因斯坦廣義相對論描寫彎曲時空的語言。\n- **必不涵蓋**：黎曼流形張量微積分的具體算式。\n- **具體推演框**（` ```text `）：歐氏幾何 vs 薩凱里／博伊亞伊雙曲幾何 vs 球面幾何的三欄對照框（平行線條數、三角形內角和、薩凱里在哪一步退縮 vs 博伊亞伊 1823 年 B9 在哪一步跨過去）。\n\n## Part IV — 重鑄「問題的形狀」\n\n### ch10 — 英國的海岸線有多長：當答案取決於你拿什麼尺\n- **檔案**：`ch10-coastline-of-britain.md`\n- **目標**：透過理查森（Richardson）對國界長度的困惑與曼德博（Mandelbrot, 1967 B10）的〈英國的海岸線有多長？〉，理解有些看似簡單直白的問題（「這條線有多長？」），其實在現實中沒有單一答案；只有當你發現「答案隨測量的尺規而變」，把問題重鑄為「它隨尺度變化的規律是什麼」，才會打開全新的視野。\n- **與脊椎的連結**：展現脊椎第四型——重鑄問題的形狀。當不同的人對同一個問題給出截然不同卻各自合理的數字時，別急著吵誰量錯了，先問「我們拿的尺是不是預設了平滑的世界？」。\n- **必涵蓋**：\n  1. Part IV 首章路線圖。\n  2. 理查森翻百科全書發現的怪事：為什麼西班牙人說西葡邊界長 987 公里，葡萄牙人卻說是 1214 公里，差了超過 20%（B10）？\n  3. 拿分規在地圖上跨步：用 100 公里的尺量、用 10 公里的尺量、用 1 公里的尺量、甚至繞著海邊每一顆鵝卵石量——圓周的長度會收斂到 `2πr`，但海岸線的長度 `L(ε)` 卻隨著尺規 `ε` 縮小而無止境地變長！\n  4. 曼德博 1967 年的致命一問：如果「英國海岸線有多長」這個問題的答案是「看你拿多小的尺（趨近無限大）」，那「長度」在這裡就是個問錯的問題！真正該問的問題是：**當尺縮小一半時，多出來的皺褶遵循什麼比例？**\n  5. 分數維度（英國西海岸 `D ≈ 1.25`，B10）與碎形（fractal）的誕生：一條比一維直線更曲折、卻還沒填滿二維平面的線，以及這個視角如何改變我們看待雲朵、血管、山脈與日常爭議的方式。\n- **必不涵蓋**：複數平面曼德博集合（`z_{n+1} = z_n² + c`）的混沌動力學細節。\n- **具體推演框**（` ```text `）：Part IV 路線圖 ＋ 尺規步長 `ε` 每次縮小為 `1/3` 時，平滑直線 vs 科赫曲線／粗糙海岸線的長度倍增與維度計算框（B10：`D ≈ 1.25`）。\n\n### ch11 — 把「計算」與「訊息」拆開：圖靈的紙帶與夏農的位元\n- **檔案**：`ch11-turing-and-shannon.md`\n- **目標**：透過 1936 年圖靈對「計算（computation）」的拆解與 1948 年夏農對「訊息（information）」的拆解，理解面對像「思考」「計算」「溝通」這樣龐大、模糊、充滿人類主觀色彩的詞彙時，探索者如何靠著「**大刀闊斧切掉無關的心理與語意雜訊**」，提煉出乾淨到可以用數學回答的核心問題。\n- **與脊椎的連結**：展現問題成形的最高手藝——「減法的提問」。當問題因為塞進太多日常意義而動彈不得時，先問：「如果把意義跟情緒全部拿掉，剩下的最基本動作是什麼？」\n- **必涵蓋**：\n  1. 1930 年代的迷霧：數學家希爾伯特問「有沒有一套機械化程序能判定所有數學命題？」，但沒有人說得清楚什麼叫做「機械化程序（計算）」。\n  2. 圖靈（1936）不去看高深的公式，反而盯著「一個正在算算術的人類計算員」問：他眼睛看哪裡、手寫什麼、腦子裡需要記住幾個狀態？從而把「計算」收斂成一條格子紙帶、一個讀寫頭與一張狀態表（圖靈機）。\n  3. 夏農（1937 碩士論文把邏輯變開關；1948〈通訊的數學理論〉）面對的另一團迷霧：電話線跟電報到底在傳送什麼？如果一句話有喜怒哀樂、有深奧意義，怎麼可能用數學算它的「容量」？\n  4. 夏農的驚人一刀：「**通訊的語意面向與工程問題完全無關。**」 不管你傳的是莎士比亞十四行詩還是午餐菜單，訊息的本質就只是「替接收端消除了多少不確定性（幾次二元猜測 bit）」。\n- **必不涵蓋**：停機問題的對角線法完整形式證明（指向《這句話無法被證明》）；現代編碼理論細節。\n- **具體推演框**（` ```text `）：圖靈把「人類心算加法」拆解成紙帶動作的四步狀態表 ＋ 夏農把「一句話的資訊量」剝離語意後化為二元提問次數（bit）的對照框。\n\n### ch12 — 在日常裡養出問題感：十二把拆開理所當然的透鏡\n- **檔案**：`ch12-everyday-lenses.md`\n- **目標**：全書收官。不寫空泛的勵志結語，而是將前 11 章歷史人物從「理所當然 → 刺眼細節 → 模糊困惑 → 精準問題」的探索歷程，提煉成一般讀者在生活、閱讀、工作與觀察世界時隨時可用的「問題顯影地圖」，並完整回收 B1–B10 所有基準案例。\n- **與脊椎的連結**：把全書脊椎「問題顯影四階」正式移交給讀者，將歷史人物的眼光轉化為讀者自己的日常習慣。\n## 必涵蓋：\n  1. 回顧全書十個歷史現場與基準數字（B1 伽利略 8 與 4、B2 斯諾濟貧院 535 死 5 與釀酒廠 70 人 0 死、B3 艾克曼與爪哇 101 所監獄白米對糙米發病率 1/39 vs 1/10,725、B4 1889–1890 病雞因換回糙米康復、B5 萊特兄弟斯米頓係數 0.005 vs 0.0033、B6 佩恩恆星氫豐度 100 萬倍、B7 彭齊亞斯與威爾遜 3.5 K / 4080 MHz、B8 魯賓 M31 的 67 個區域至 24 kpc、B9 博伊亞伊 1823 年 11 月 3 日的平行線翻轉、B10 曼德博海岸線 D ≈ 1.25 與理查森 20% 邊界差、以及圖靈與夏農的減法拆解）。\n  2. 為什麼我們長大後問題變少了？不是因為我們都懂了，而是因為我們學會了用「專有名詞」貼標籤（說出「那是慣性」「那是基因」「那是通膨」，就以為自己懂了，從而關掉了追問的開關）。\n  3. 給讀者的五個日常提問觸發器：\n     - 當大家都說「本來就這樣」時，試著把兩個常識綁在一起看會不會打架（伽利略鏡片）。\n     - 當一場災難或現象發生時，別只看「誰中招了」，去問「誰明明在旁邊卻沒事？」（斯諾鏡片）。\n     - 當結果跟預期差一截時，別急著怪自己手拙，把規則拆開看哪個常數是抄來的（萊特／佩恩／彭齊亞斯鏡片）。\n     - 當一個問題卡死很久時，檢查題目裡是不是偷偷塞了一條沒人承認的假設（魯賓／麥克林托克／博伊亞伊鏡片）。\n     - 當兩個答案吵不完時，看看是不是尺規不同，或者詞彙裡塞了太多需要切掉的雜質（曼德博／圖靈／夏農鏡片）。\n  4. 結尾實戰：帶讀者用這套眼光，重新走過一次每天早晨出門到晚間回家的日常街道，指出三個原本透明、現在卻閃閃發光的好問題。\n- **必不涵蓋**：不引入任何新的歷史人物長篇故事。\n- **具體推演框**（` ```text `）：全書「問題誕生總表」（人物 × 原本理所當然的前提 × 刺眼的微小細節 × 轉換後的真問題 × 基準數據 B1–B10 全回收）。\n\n## 附錄（P2.5 後編纂）\n\n- **附錄 A — 歷史探索者與問題誕生年表**（`appendix-a-timeline.md`）：按時間軸整理書中登場人物、所處時代背景、打破的常識與關鍵年份。\n- **附錄 B — 概念與思維工具索引**（`appendix-b-glossary.md`）：思想實驗、負面證據、控制對照、殘差、熱游離、旋轉曲線、轉座子、平行公設、分數維度、圖靈機、資訊熵等核心詞彙的白話定義與首次登場章節。\n"}, {"id": "landscape-2026-10", "file": "landscape-2026-10.md", "group": "內部文件（_meta）", "title": "史實與數據基準（內部文件，非書籍內容）", "md": "# 史實與數據基準（內部文件，非書籍內容）\n\n本文件是《問題誕生之前：從理所當然到值得追問》的史實基準表（2026-10-30 查證）。各章寫作與 Tier-2 查核皆以本表為準；未確認的傳說必須在內文標明為傳說。\n\n## 1. 伽利略：落體、綁石頭思想實驗與單擺（ch01, ch02, ch12）\n- **亞里斯多德基準假設**：物體下落速度與重量成正比（重者快、輕者慢），統治自然哲學近兩千年。\n- **綁石頭思想實驗**：伽利略（Galileo Galilei, 1564–1642）約於 **1590 年**在比薩大學任教時撰寫的未出版手稿《論運動》（*De Motu*）已提出核心批判，後於 **1638 年**《兩門新科學的對話》（*Discorsi e dimostrazioni matematiche intorno a due nuove scienze*）正式以對話體發表：假設重石速度為 8、輕石為 4；綁在一起時，因慢石拖累快石，整體速度應 `\u003c 8`；但兩石總重大於重石，依亞里斯多德規則速度又應 `\u003e 8`。同一前提推導出矛盾結論。\n- ⚠️ **比薩斜塔丟鐵球與比薩主教座堂吊燈**：兩者皆出自伽利略晚年學生兼傳記作者**ヴィヴィアーニ**（Vincenzo Viviani, 1654 年成稿）的記載。科學史界普遍視「斜塔公開丟球」與「1583 年 19 歲看吊燈以脈搏計時」為後人浪漫化的**傳說或誇飾軼事**；伽利略本人現存最早嚴謹探討單擺等時性的文獻是 **1602 年 11 月 29 日**致 Guidobaldo del Monte 的信，以及 1590s–1600s 的斜面滾球實驗。**內文引述吊燈與斜塔時，必須明確標示為 Viviani 記載的傳說，不可寫成確鑿史實。**\n- **斜面稀釋重力**：因自由落體太快難以用當時的水鐘與脈搏精確計時，伽利略將問題轉化為「在斜面上滾動銅球」以稀釋重力，量出距離與時間平方成正比（`d ∝ t²`，奇數定律 `1, 3, 5, 7…`）。\n\n## 2. 艾克曼與格林斯：爪哇病雞、白米與「缺席的致病物」（ch01, ch03, ch12）\n- **人物與時間**：荷蘭醫師**克里斯蒂安·艾克曼**（Christiaan Eijkman, 1858–1930）與助手**赫里特·格林斯**（Gerrit Grijns, 1865–1944），**1886–1897 年**於荷屬東印度巴達維亞（Batavia，今印尼雅加達）軍事醫院實驗室研究肆虐亞洲與軍隊的**腳氣病**（beriberi）。\n- **被視為理所當然的前提**：1880 年代正值細菌學說（巴斯德、科赫）大獲全勝的黃金時代，全世界的醫學家都深信：**每一種疾病，必定是由某種「多出來的東西」（細菌、寄生蟲或毒素）引起的**。艾克曼最初也是帶著顯微鏡去爪哇找「腳氣病菌」，卻怎麼找都找不到。\n- **引起注意的細節**（1889–1890 年廚師換米事件）：實驗室飼養的雞群突然集體出現雙腿麻痺、步態不穩、頸部後仰的「多發性神經炎（polyneuritis）」，症狀與人類腳氣病如出一轍；幾個月後，還沒等艾克曼分離出病菌，活著的病雞卻又莫名其妙全數康復！艾克曼追問之下才發現：前任廚師為了省事，拿軍醫院廚房煮給軍官吃的**精製白米**（polished white rice）剩飯餵雞；新來的廚師死守軍規，認為「不該拿軍用白米餵民用實驗雞」，改餵廉價、帶皮的**未精製糙米**（unpolished brown rice），雞竟然就自己好了。\n- **大規模監獄調查**（1897 年 Vorderman 報告）：艾克曼與衛生官**福德曼**（Adolphe Vorderman）隨即調查爪哇與馬都拉共 **101 所監獄**（涵蓋近 30 萬名囚犯）：\n  - 供應**精製白米**的監獄：腳氣病發病率高達 **1/39**（約 2.56%）。\n  - 供應**未精製糙米**的監獄：腳氣病發病率僅 **1/10,725**（約 0.0093%）。\n  - 兩者發病率相差近 **300 倍**（約 275 倍）！\n- **問題的徹底翻轉**：艾克曼起初仍受限於舊框架，猜測是白米澱粉在腸道產生毒素、而米糠（銀皮）含有「解毒劑」；直到 1901 年助手格林斯（Gerrit Grijns）跨出最後一步，把問題從「白米裡多出了什麼毒？」翻轉為「**白米在碾磨時少掉了什麼維持生命不可或缺的微量物質？**」——這直接開啟了「維生素（vitamin，B1 硫胺素）」與營養缺乏症的概念，艾克曼於 **1929 年**獲頒諾貝爾生醫獎。\n\n## 3. 約翰·斯諾：1854 倫敦蘇活區寬街霍亂調查（ch01, ch03, ch12）\n- **人物與時間**：約翰·斯諾（John Snow, 1813–1858），**1854 年 8 月 31 日至 9 月初**倫敦蘇活區（Soho，寬街 Broad Street 與金廣場 Golden Square 一帶）爆發猛烈霍亂。\n- **死亡人數與時間窗**：爆發首週末（截至 9 月 2 日當週）登記 **89 例**死亡（其中 9 月 1–2 日 48 小時內即死 79 人）；整起局部爆發最終造成約 **500–600 人**死亡（斯諾著名的點狀分布圖上標註了 **578 例**死亡）。**1854 年 9 月 8 日**地方委員會依斯諾建議拆下寬街幫浦把手。\n- **關鍵「未發病」異常**（異常的缺席）：\n  1. **波蘭街濟貧院**（Workhouse on Poland Street）：位於疫區核心、被死亡病例包圍，院內 **535 名**收容人中僅 **5 人**死於霍亂——因為院內自有水井，不喝寬街幫浦的水。\n  2. **寬街獅子釀酒廠**（Lion Brewery, Broad Street）：緊鄰幫浦，**70 多名**工人無人死於霍亂——工人獲配發免費麥芽酒（且釀酒廠自有深井），從不喝寬街幫浦生水。\n  3. **遠處的孤立死亡**（漢普斯特德寡婦案，Susannah Eley）：住在遠離蘇活區的 Hampstead（West End），卻在 9 月初死於霍亂——斯諾追查發現她生前極愛寬街幫浦的水，每天派人用大水瓶從寬街運水過去給她喝（連同探望她的姪女也喝了水後死亡）。\n\n## 4. 萊特兄弟：升力公式與斯미頓係數之謎（ch05, ch12）\n- **背景**（1899–1901）：威爾伯與奧維爾·萊特（Wilbur \u0026 Orville Wright）依據德國滑翔機先驅**李林塔爾**（Otto Lilienthal）的空氣動力學表與百年工程界奉為圭臬的升力公式，於 1900 與 1901 年在北卡羅來納州小鷹鎮（Kitty Hawk）試飛載人滑翔機。\n- **刺眼的落差**：1901 年滑翔機實際產生的升力只有理論計算值的約**三分之一**。\n- **抓出被盲信 150 年的常數**：當時升力公式中的氣壓常數——**斯米頓係數**（Smeaton coefficient, `k`）——自 1759 年約翰·斯米頓（John Smeaton）以來一直被工程界當作 **`0.005`**。萊特兄弟透過腳踏車前輪改裝的平衡測試裝置與 **1901 年底自建的風洞**（測試逾 200 種機翼剖面），發現真正的係數接近 **`0.0033`**（高估了約 50%），同時找出了李林塔爾曲率數據的適用限制，最終促成 **1903 年 12 月 17 日**動力飛行成功。\n\n## 5. 塞西莉亞·佩恩：太陽與恆星由什麼構成（ch06, ch12）\n- **背景與常識**（1925 前）：天文學界普遍深信「太陽與恆星的化學成分與地球地殼大致相同（以鐵、鈣、矽等重元素為主）」，因為太陽吸收光譜中鐵與鈣的暗線最顯著。\n- **突破**（1925 年博士論文《恆星大氣》*Stellar Atmospheres*）：25 歲的**塞西莉亞·佩恩**（Cecilia Payne-Gaposchkin, 1900–1979）在哈佛大學天文台將印度物理學家**薩哈**（Meghnad Saha, 1920）的熱游離方程式（thermal ionization theory）套用到恆星光譜分類上。她發現光譜線強弱反映的是**表面溫度造成的游離狀態**，而非元素多寡；推算結果顯示恆星中**氫（Hydrogen）與氦（Helium）的含量比鐵等重元素高出約一百萬倍**（`10⁶`），氫與氦佔了恆星絕大部分質量。\n- **權威壓抑與平反**：當時天文學權威**亨利·諾里斯·羅素**（Henry Norris Russell）審閱後認為「顯然不可能（clearly impossible）」，佩恩被迫在 1925 年論文中加註這項氫氦豐度結果「幾乎肯定不是真實的（almost certainly not real）」。四年後（**1929 年**），羅素用獨立方法算出相同結論並發表論文承認佩恩是對的；天文學家 Otto Struve 譽其為「天文學史上最傑出的博士論文」。\n\n## 6. 彭齊亞斯與威爾遜：除不掉的 3.5 K 宇宙雜訊（ch07, ch12）\n- **人物與時間**：貝爾實驗室（Bell Labs, 紐澤西州 Holmdel）射電天文學家**阿諾·彭齊亞斯**（Arno Penzias）與**羅伯特·威爾遜**（Robert Wilson），**1964 年**使用 1959 年建造的 20 英尺號角形反射天線（Holmdel Horn Antenna）。\n- **揮之不去的殘差**：在波長 **7.35 公分**（頻率 4080 MHz）觀測時，即使扣除了地面熱輻射、大氣吸收、液態氦冷卻至 4 K 的參考源誤差，甚至清除了天線內部棲息的**白鴿與鴿糞**（他們戲稱為「白色介電物質」white dielectric material），天線仍持續收到一個不分晝夜、不分季節、各方向完全均勻的額外背景雜訊，等效溫度約 **3.5 K**（當時估計區間約 `3.5 ± 1.0 K`，現代精確值為 **2.725 K**）。\n- **問題的嫁接**：與此同時，僅數十公里外的普林斯頓大學物理學家**羅伯特·迪克（Robert Dicke）、ジム·皮布爾斯**（Jim Peebles）等人正準備尋找大霹靂（Big Bang）留下的宇宙微波背景輻射（CMB）。兩組人馬於 **1965 年**在《天文物理期刊》（*Astrophysical Journal*）同期背靠背發表論文；彭齊亞斯與威爾遜獲 **1978 年**諾貝爾物理學獎。\n\n## 7. 薇拉·魯賓：不肯慢下來的星系邊緣（ch08, ch12）\n- **人物與時間**：**薇拉·魯賓**（Vera Rubin, 1928–2016）與儀器物理學家**肯特·福特**（W. Kent Ford, Jr.），任職於華盛頓卡內基研究所（Carnegie Institution）。\n- **理所當然的預期**：依牛頓萬有引力與克卜勒定律（`v ∝ 1/√r`），螺旋星系的發光質量集中在中心核球，邊緣星光稀疏，因此越往星系外圍，氣體雲與恆星的繞行速度應該越慢（克卜勒式衰減 Keplerian decline）。\n- **關鍵觀測**（1970 年仙女座星系 M31 論文）：利用福特研發的影像管光譜儀（image-tube spectrograph，將曝光時間從數十小時縮短至數小時），他們量測了仙女座星系（M31）從距中心 3 kpc 到 **24 kpc**（千秒差距）共 **67 個**發射區（Hα 氫游離區）的旋轉速度。結果旋轉曲線在高半徑處**完全沒有下降，而是維持平坦**（flat rotation curve，速度維持在約 200 km/s 上下）。繼而在 **1980 年**對 21 個螺旋星系的系統研究中確認這是普遍現象，成為**暗物質**（Dark Matter）暈存在最具說服力的觀測證據。\n\n## 8. 芭芭拉·麥克林托克：玉米粒上的跳躍基因（ch09, ch12）\n- **人物與時間**：遺傳學家**芭芭拉·麥克林托克**（Barbara McClintock, 1902–1992），於冷泉港實驗室（Cold Spring Harbor Laboratory）研究玉米（*Zea mays*）染色體。\n- **被視為理所當然的前提**：1940 年代遺傳學界將染色體視為固定不變的「念珠串」，基因像珠子一樣釘死在固定位置上，只會發生隨機突變或重組，絕不可能自行搬家。\n- **引起注意的細節**（1944–1948）：她觀察玉米籽粒上的色素斑點——不是只看「有色或無色」，而是緊盯**斑點的大小（反映發育早期或晚期發生改變）與分布規律**。她發現第 9 號染色體總在特定位置斷裂，且這套斷裂與恢復由兩個可移動的遺傳控制元件——**解離子**（Ds, Dissociation）與**活化子**（Ac, Activator）——控制，也就是**轉座子**（transposons / jumping genes）。\n- **沉默與平反**：她在 **1951 年**冷泉港研討會發表成果時，台下幾乎無人理解、反應冷淡；直到 1960s–1970s 分子生物學在細菌與其他生物中發現同樣的移動遺傳元件，她才於 **1983 年**（81 歲）獨得諾貝爾生醫獎。\n\n## 9. 博伊亞伊與羅巴切夫斯基：證不出的第五公設（ch10, ch12）\n- **兩千年的執念**：歐幾里得（Euclid, 約 300 BCE）《幾何原本》的**第五公設**（平行公設）文字冗長，不像前四條公設那樣不證自明。兩千年來無數數學家試圖「用前四條公設證明第五公設」。\n- **差一步的先驅——薩凱里**（Girolamo Saccheri, 1667–1733）：1733 年用歸謬法（假設第五公設不成立，尋找矛盾）推導出雙曲幾何的諸多定理，卻因深信歐氏空間是絕對真理，硬宣稱那些反直覺結果「違反直線的本性」，死前以為自己捍衛了歐幾里得。\n- **問題的翻轉**（1820s）：匈牙利年輕軍官**亞諾什·博伊亞伊**（János Bolyai, 1802–1860）與俄國數學家**羅巴切夫斯基**（Nikolai Lobachevsky, 1792–1856，1829 年發表）各自獨立意識到：**為什麼找不到矛盾？因為它本來就沒有矛盾！** 博伊亞伊於 **1823 年 11 月 3 日**寫信給父親 Farkas Bolyai 宣告：「我從虛無中創造了一個奇異的新世界（Out of nothing I have created a strange new universe）」，其成果於 **1832 年**以附錄（*Appendix*）形式發表（高斯 Carl Friedrich Gauss 私下早已得出相同結論但未發表）。\n\n## 10. 曼德博與理查森：英國的海岸線有多長（ch11, ch12）\n- **理查森的邊界怪象**：英國氣象學家與和平研究者**劉易斯·弗萊·理查森**（Lewis Fry Richardson, 1881–1953）在研究「兩國接壤邊界長度與戰爭機率」時，發現西班牙與葡萄牙百科全書記載的共同邊界長度相差超過 **20%**（987 km vs 1214 km）。他用不同長度的分規（尺規步長 `ε`）去量海岸線與國界，發現尺規越短、量出來的總長度 `L(ε)` 呈冪次律無上限暴增（`L(ε) ∝ ε^(1−D)`）。\n- **曼德博的重構**（1967）：**班諾伊特·曼德博**（Benoit Mandelbrot, 1924–2010）在翻閱理查森生前冷門論文後，於 **1967 年**在《科學》（*Science*）發表名作〈英國的海岸線有多長？統計自相似性與分數維度〉（*How Long Is the Coast of Britain? Statistical Self-Similarity and Fractional Dimension*），並於 **1975 年**正式造出「**碎形**（fractal）」一詞。他指出：「英國海岸線有多長」是個問錯的問題，因為自然界的粗糙曲線不具備單一長度，而是具有**分數維度**（英國西海岸 `D ≈ 1.25`）——問題從「量出更準的長度」翻轉成「粗糙度在跨尺度下遵循什麼幾何學」。\n\n## 11. 圖靈與夏農：把人類動詞拆成機械與位元（ch11/ch12 對照或獨立章）\n- **艾倫·圖靈**（Alan Turing, 1912–1954）：面對希爾伯特 1928 年提出的**判定問題**（Entscheidungsproblem）——「是否存在一個機械化程序能判定任意數學命題可證與否」，圖靈在 **1936 年**論文〈論可計算數及其在判定問題上的應用〉（*On Computable Numbers, with an Application to the Entscheidungsproblem*）中沒有直接硬解邏輯公式，而是先退一步問：**當我們說一個人在「計算（compute）」時，他到底在做什麼物理動作？** 他把人類計算員的動作拆解成紙帶（tape）、讀寫頭與有限狀態（圖靈機 a-machine），從而證明停機問題與判定問題不可解，順手奠定現代電腦科學。\n- **克勞德·夏農**（Claude Shannon, 1916–2001）：**1937 年** MIT 碩士論文將布林代數（`0/1`）對應到繼電器開關電路；**1948 年**在《貝爾系統技術期刊》發表〈通訊的數學理論〉（*A Mathematical Theory of Communication*），把原本含糊的「傳遞訊息」切開——**先徹底剝離「語意（meaning）」**，問「如果不管這句話是什麼意思，純粹消除接收端的不確定性需要多少次二元選擇（bit）？」，定義出資訊熵 `H = −Σ pᵢ log₂ pᵢ`。\n"}, {"id": "maintenance", "file": "maintenance.md", "group": "內部文件（_meta）", "title": "維護與掃描（內部文件，非書籍內容）", "md": "# 維護與掃描（內部文件，非書籍內容）\n\n本書《問題誕生之前：從理所當然到值得追問》主題為**科學史、數學史與發明史上的問題誕生歷程**，屬常青（evergreen）敘事型非虛構作品（`form = narrative`，`reader_register = general`）。歷史歸屬與實驗數據的事實基準在 `_meta/landscape-2026-10.md`，各章逐項查證證據存於 `_meta/source-evidence/\u003cchapter-stem\u003e.md`。\n\n## 1. 基準數字表（canonical；與 `outline.md`／`running-examples.md` 三方逐字相同）\n\n| 代號 | 數值 | 單位／意義 | 擁有概念 | 引用章節 |\n|---|---|---|---|---|\n| B1 | 8 與 4 | 伽利略綁石頭思想實驗：重石下落速度 8、輕石 4，綁在一起時同時推出 `\u003c 8` 與 `\u003e 8` 的矛盾 | 思想實驗的內部矛盾法 | ch01, ch02, ch12 |\n| B2 | 535 人死 5 人（釀酒廠 70 人 0 死） | 1854 倫敦寬街霍亂疫區核心的波蘭街濟貧院（自有水井）535 人僅 5 死；緊鄰幫浦的獅子釀酒廠約 70 名工人 0 死（地圖共標 578 例死亡） | 負面證據（缺席的異常） | ch01, ch03, ch12 |\n| B3 | 1/39 vs 1/10,725 | 1897 爪哇 101 所監獄（近 30 萬囚犯）腳氣病調查：吃精製白米發病率 1/39（約 2.56%），吃未精製糙米僅 1/10,725（相差近 300 倍） | 從「多出什麼毒」翻轉為「少掉什麼營養」 | ch03, ch12 |\n| B4 | 1889–1890 | 艾克曼實驗室病雞因廚師停餵軍醫院剩餘精製白米、改餵廉價糙米而意外全數康復的轉折年 | 偶然事件中的對照組 | ch03, ch12 |\n| B5 | 0.005 vs 0.0033 | 萊特兄弟抓出被盲信 150 年的斯米頓氣壓係數（0.005 高估約 50%，實測近 0.0033），解釋 1901 滑翔機升力僅預期約 1/3 的落差 | 拆解複合公式與懷疑常數 | ch04, ch12 |\n| B6 | 100 萬倍（10⁶） | 塞西莉亞・佩恩 1925 博士論文推算出恆星大氣中氫與氦的豐度比鐵等重元素高出約一百萬倍 | 區分「訊號強度」與「真實數量」 | ch05, ch12 |\n| B7 | 3.5 K（4080 MHz） | 彭齊亞斯與威爾遜 1964 在波長 7.35 cm（4080 MHz）量到除不掉的 3.5 K 背景殘差（宇宙微波背景輻射 CMB，現代精確值 2.725 K） | 殘差不丟棄原則 | ch06, ch12 |\n| B8 | 67 個區域（至 24 kpc） | 薇拉・魯賓與福特 1970 量測仙女座星系 M31 從 3 到 24 kpc 共 67 個發射區，發現旋轉曲線平坦（約 200 km/s 不隨 1/√r 衰減） | 預期曲線與邊界觀測 | ch07, ch12 |\n| B9 | 1823 年 11 月 3 日 | 博伊亞伊致信父親宣告「從虛無中創造了奇異新世界」，放棄用前四公設證明第五公設（1832 發表；羅巴切夫斯基 1829 發表） | 翻轉隱藏公設 | ch09, ch12 |\n| B10 | D ≈ 1.25 | 曼德博 1967 英國西海岸線分數維度（理查森發現西葡邊界記載差逾 20%：987 km vs 1214 km，長度隨尺規縮小呈 L(ε) ∝ ε^(1−D) 發散） | 尺度依賴與重鑄問題 | ch10, ch12 |\n\n## 2. 脆弱事實索引（fragile facts；改動或再版前務必重查，均源自 `landscape-2026-10.md`）\n\n- **伽利略斜塔丟球與比薩吊燈**（ch02）：兩者皆出自晚年學生ヴィヴィアーニ（Vincenzo Viviani, 1654 年成稿）傳記，科學史界普遍視為後世浪漫化的傳說或誇飾軼事；內文必須明確標示為傳說，並區分真實文獻（1590《論運動》、1602 致友人探討單擺等時性的信、1638《兩門新科學》綁石頭思想實驗與斜面滾球實驗）。\n- **約翰·斯諾 1854 寬街霍亂**（ch01, ch03, ch12）：波蘭街濟貧院是 **535 人僅 5 死**（不可寫成 0 死），寬街獅子釀酒廠（業主 Edward Huggins）約 **70 名工人 0 死**；點狀地圖標註 **578 例**死亡；遠方孤立死亡個案為漢普斯特德（Hampstead）寡婦 Susannah Eley 與其姪女。\n- **艾克曼與格林斯爪哇腳氣病調查**（ch03, ch12）：1889–1890 病雞是因停餵軍醫院精製白米剩飯、改買廉價未精製糙米而使**存活病雞**康復；1897 年福德曼（Vorderman）調查涵蓋爪哇與馬都拉 **101 所監獄**（近 30 萬囚犯），白米發病率 `1/39`（約 2.56%）對比糙米 `1/10,725`（約 0.0093%）；1901 年格林斯（Gerrit Grijns）提出「部分飢餓／保護性營養成分缺失」觀點。\n- **萊特兄弟 1901 滑翔機與風洞**（ch <script>
(function(){
"use strict";
var NS="qgen";
var DATA=JSON.parse(document.getElementById('bookdata').textContent);
var CHS=DATA.chapters, byId={}, byFile={};
CHS.forEach(function(c){byId[c.id]=c;byFile[c.file]=c;});

function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

var DEF={theme:'paper',font:'sans',fs:18,lh:1.95,ls:0.02,ps:1.0,pw:52};
var prefs=Object.assign({},DEF,lsGet(NS+'.prefs2',{}));

var main=document.getElementById('main'),content=document.getElementById('content');
var cur=null;

function applyPrefs(){
  document.body.dataset.theme=prefs.theme;
  document.body.dataset.font=prefs.font;
  var r=document.documentElement.style;
  r.setProperty('--fs',prefs.fs+'px');
  r.setProperty('--lh',prefs.lh);
  r.setProperty('--ls',prefs.ls+'em');
  r.setProperty('--ps',prefs.ps);
  r.setProperty('--pw',prefs.pw);
  ['fs','lh','ls','ps','pw'].forEach(function(k){
    var ri=document.getElementById('r_'+k),oi=document.getElementById('o_'+k);
    if(ri){ri.value=prefs[k];} if(oi){oi.textContent=prefs[k];}
  });
  document.querySelectorAll('#themeseg .btn').forEach(function(b){b.classList.toggle('on',b.dataset.v===prefs.theme);});
  document.querySelectorAll('#fontseg .btn').forEach(function(b){b.classList.toggle('on',b.dataset.v===prefs.font);});
  lsSet(NS+'.prefs2',prefs);
}

function buildSidebar(){
  var sb=document.getElementById('sidebar');
  var html="\u003cdiv class=\"brand\"\u003e問題誕生之前\u003cbr\u003e\u003cspan style=\"font-weight:400;font-size:12px;color:var(--muted)\"\u003e從理所當然到值得追問\u003c/span\u003e\u003c/div\u003e";
  var g='';
  CHS.forEach(function(c){
    if(c.group!==g){g=c.group;html+='<div class="grp">'+g+'</div>';}
    html+='<a class="ch" data-id="'+c.id+'" href="#'+c.id+'">'+c.title.replace(/：.*$/,'')+'</a>';
  });
  html+='<a class="allbtn" href="#_all">整本單頁（供全文 ⌘F 搜尋）</a>';
  sb.innerHTML=html;
  sb.addEventListener('click',function(e){
    var a=e.target.closest('a');if(!a)return;
    e.preventDefault();
    show(a.dataset.id||a.getAttribute('href').slice(1));
    if(window.innerWidth<=880){sb.classList.remove('open');backdrop.classList.remove('show');}
  });
}

function flatIndex(id){for(var i=0;i<CHS.length;i++){if(CHS[i].id===id)return i;}return -1;}

/* Wrap CJK runs inside <pre> so they render at exactly 2 Menlo columns
   (.cjkw applies PingFang at 120.41%). East-Asian-Width W/F BMP ranges,
   matching check_diagrams.py's width model. */
var CJK_RE=/[\u1100-\u115F\u2E80-\u303E\u3041-\u33FF\u3400-\u4DBF\u4E00-\u9FFF\uA000-\uA4CF\uAC00-\uD7A3\uF900-\uFAFF\uFE30-\uFE4F\uFF01-\uFF60\uFFE0-\uFFE6]/;
var CJK_SPLIT=/([\u1100-\u115F\u2E80-\u303E\u3041-\u33FF\u3400-\u4DBF\u4E00-\u9FFF\uA000-\uA4CF\uAC00-\uD7A3\uF900-\uFAFF\uFE30-\uFE4F\uFF01-\uFF60\uFFE0-\uFFE6]+)/;
function wrapCJK(root){
  root.querySelectorAll('pre').forEach(function(pre){
    var w=document.createTreeWalker(pre,NodeFilter.SHOW_TEXT),nodes=[],n;
    while((n=w.nextNode())){if(CJK_RE.test(n.nodeValue))nodes.push(n);}
    nodes.forEach(function(t){
      var frag=document.createDocumentFragment();
      t.nodeValue.split(CJK_SPLIT).forEach(function(part){
        if(!part)return;
        if(CJK_RE.test(part[0])){
          var s=document.createElement('span');
          s.className='cjkw';s.textContent=part;frag.appendChild(s);
        }else{
          frag.appendChild(document.createTextNode(part));
        }
      });
      t.parentNode.replaceChild(frag,t);
    });
  });
}

function postprocess(){
  content.querySelectorAll('a[href]').forEach(function(a){
    var h=a.getAttribute('href');
    if(/^https?:/i.test(h)){a.target='_blank';a.rel='noopener';return;}
    var m=h.match(/([^\/#]+\.md)/);
    if(m&&byFile[m[1]]){
      var id=byFile[m[1]].id;
      a.setAttribute('href','#'+id);
      a.addEventListener('click',function(e){e.preventDefault();show(id);});
    }
  });
}

var suppressHash=false;
function normalizeCJKBold(md){
  var lines=md.split('\n'),inFence=false;
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(/^\s*(`{3,}|~{3,})/.test(line)){inFence=!inFence;continue;}
    if(inFence||line.indexOf('**')===-1)continue;
    lines[i]=line.replace(/\*\*([^*\n]+)\*\*/g,function(full,inner){
      if((inner[0]==='「'&&inner[inner.length-1]==='」')||(inner[0]==='『'&&inner[inner.length-1]==='』')){
        var q0=inner[0],q1=inner[inner.length-1],core=inner.slice(1,-1);
        var mp=core.match(/^(.+?)(（[^）]+）)$/);
        return mp?q0+'**'+mp[1]+'**'+mp[2]+q1:q0+'**'+core+'**'+q1;
      }
      var mp2=inner.match(/^(.+?)(（[^）]+）)$/);
      return mp2?'**'+mp2[1]+'**'+mp2[2]:full;
    });
  }
  return lines.join('\n');
}
function show(id){
  var ch;
  if(id==='_all'){
    ch={id:'_all',title:'整本（單頁）',md:CHS.map(function(c){return c.md;}).join('\n\n---\n\n')};
  }else{
    ch=byId[id]||CHS[0];
  }
  cur=ch.id;
  content.innerHTML=marked.parse(normalizeCJKBold(ch.md));
  wrapCJK(content);
  postprocess();
  document.getElementById('topttl').textContent=ch.title;
  document.title=ch.title+' — '+"問題誕生之前";
  var i=flatIndex(ch.id);
  var prev=i>0?CHS[i-1]:null, next=(i>=0&&i<CHS.length-1)?CHS[i+1]:null;
  var pb=document.getElementById('prevbtn'),nb=document.getElementById('nextbtn');
  pb.style.visibility=prev?'visible':'hidden';
  nb.style.visibility=next?'visible':'hidden';
  if(prev)pb.textContent='← '+prev.title;
  if(next)nb.textContent=next.title+' →';
  pb.onclick=prev?function(){show(prev.id);}:null;
  nb.onclick=next?function(){show(next.id);}:null;
  document.getElementById('prevtop').onclick=prev?function(){show(prev.id);}:null;
  document.getElementById('nexttop').onclick=next?function(){show(next.id);}:null;
  document.querySelectorAll('#sidebar a.ch').forEach(function(a){a.classList.toggle('active',a.dataset.id===cur);});
  if(location.hash.slice(1)!==cur){suppressHash=true;location.hash=cur;}
  lsSet(NS+'.last',cur);
  main.scrollTop=lsGet(NS+'.scroll.'+cur,0);
}

var scrollTimer=null;
main.addEventListener('scroll',function(){
  if(scrollTimer)clearTimeout(scrollTimer);
  scrollTimer=setTimeout(function(){if(cur)lsSet(NS+'.scroll.'+cur,main.scrollTop);},250);
});

window.addEventListener('hashchange',function(){
  if(suppressHash){suppressHash=false;return;}
  var h=location.hash.slice(1);
  if(h&&h!==cur)show(h);
});

document.addEventListener('keydown',function(e){
  var t=e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA')return;
  if(e.key==='ArrowLeft'){var b=document.getElementById('prevbtn');if(b.onclick)b.onclick();}
  if(e.key==='ArrowRight'){var b2=document.getElementById('nextbtn');if(b2.onclick)b2.onclick();}
});

/* settings panel */
var panel=document.getElementById('panel'),backdrop=document.getElementById('backdrop');
document.getElementById('gear').onclick=function(){panel.classList.toggle('open');backdrop.classList.toggle('show',panel.classList.contains('open'));};
backdrop.onclick=function(){panel.classList.remove('open');document.getElementById('sidebar').classList.remove('open');backdrop.classList.remove('show');};
document.getElementById('hamburger').onclick=function(){document.getElementById('sidebar').classList.add('open');backdrop.classList.add('show');};
document.getElementById('themeseg').addEventListener('click',function(e){var b=e.target.closest('.btn');if(b){prefs.theme=b.dataset.v;applyPrefs();}});
document.getElementById('fontseg').addEventListener('click',function(e){var b=e.target.closest('.btn');if(b){prefs.font=b.dataset.v;applyPrefs();}});
[['fs',parseFloat],['lh',parseFloat],['ls',parseFloat],['ps',parseFloat],['pw',parseFloat]].forEach(function(p){
  document.getElementById('r_'+p[0]).addEventListener('input',function(e){prefs[p[0]]=p[1](e.target.value);applyPrefs();});
});
document.getElementById('resetbtn').onclick=function(){prefs=Object.assign({},DEF);applyPrefs();};

/* boot */
applyPrefs();
buildSidebar();
var start=location.hash.slice(1)||lsGet(NS+'.last',CHS[0].id);
show(byId[start]||start==='_all'?start:CHS[0].id);
})();
</script>
</body>
</html>
