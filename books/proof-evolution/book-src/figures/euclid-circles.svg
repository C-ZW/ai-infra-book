<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="title desc">
<title id="title">兩圓構造等邊三角形</title>
<desc id="desc">兩圓中心為 A、B，半徑均為 AB。上交點是 C；交點存在性須由正文另外交代。</desc>
<rect width="560" height="440" fill="white"/>
<circle cx="200" cy="260" r="160" fill="none" stroke="black" stroke-opacity="0.4" stroke-width="2"/><circle cx="360" cy="260" r="160" fill="none" stroke="black" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="8 5"/><polygon points="200,260 360,260 280,121.436" fill="black" fill-opacity="0.07" stroke="black" stroke-width="2"/><circle cx="200" cy="260" r="4"/><text x="200" y="290" font-size="23" text-anchor="middle" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">A</text><circle cx="360" cy="260" r="4"/><text x="360" y="290" font-size="23" text-anchor="middle" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">B</text><circle cx="280" cy="121.436" r="4"/><text x="280" y="107.436" font-size="23" text-anchor="middle" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">C</text><text x="280" y="321" font-size="25" text-anchor="middle" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">AB = AC = BC</text>
</svg>
