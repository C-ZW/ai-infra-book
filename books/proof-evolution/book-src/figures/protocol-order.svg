<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-labelledby="title desc">
<title id="title">互動證明的訊息順序</title>
<desc id="desc">先由證明者送 H；驗證者之後才隨機選 b；證明者最後送對應 s。這是現場互動，不是離線模擬器製造紀錄的順序。</desc>
<rect width="680" height="440" fill="white"/>
<text x="115" y="38" font-size="25" text-anchor="middle" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">證明者</text><text x="545" y="38" font-size="25" text-anchor="middle" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">驗證者</text><line x1="115" y1="60" x2="115" y2="350" stroke="black" stroke-width="2" stroke-dasharray="5 5"/><line x1="545" y1="60" x2="545" y2="350" stroke="black" stroke-width="2" stroke-dasharray="5 5"/><line x1="115" y1="115" x2="545" y2="115" stroke="black" stroke-width="2"/><polyline points="534,108 545,115 534,122" fill="none" stroke="black" stroke-width="2"/><text x="330" y="95" font-size="24" text-anchor="middle" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">① 先送出 H</text><line x1="545" y1="215" x2="115" y2="215" stroke="black" stroke-width="2"/><polyline points="126,208 115,215 126,222" fill="none" stroke="black" stroke-width="2"/><text x="330" y="195" font-size="24" text-anchor="middle" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">② 再隨機選 b</text><line x1="115" y1="315" x2="545" y2="315" stroke="black" stroke-width="2"/><polyline points="534,308 545,315 534,322" fill="none" stroke="black" stroke-width="2"/><text x="330" y="295" font-size="24" text-anchor="middle" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">③ 回覆對應 s</text><text x="330" y="401" font-size="23" text-anchor="middle" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">順序是健全性論證的一部分</text>
</svg>
