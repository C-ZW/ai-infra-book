call 分診時只看單一錯誤 Log 就推論根因。防禦機制是把 `validateCitations` 與 `verifyTriageEvidenceChain` 設為硬性閘門，在 Log 記錄 `rejected_reason` 與 `telemetry_sources_count`；當場景 B 單批 `citation_mismatch_or_fabricated` 超過 `5%`（示例門檻）時暫停自動產出報告並轉人工複核。\n5. **雙擊競態與 `Batch API` 局部失敗（場景 A / B）**：`OrderOps` 遇到連點或併發重送時，應在 DB 交易內認領同一業務操作並持久化 `idempotency_key` 與狀態，向金流端傳送同一 key，逾時或衝突時先對帳或讀回終止狀態；在金流端提供適當冪等保證、操作識別與退款額度控制正確，且對帳與重試流程可靠的前提下，可防止同一業務操作重複執行（部分退款須使用能區分各次合法操作的業務鍵）。場景 B 的 `Batch API` 則可能出現單一 `custom_id` 失敗，排程器必須解析結果檔的 `result.type`（`succeeded` / `errored` / `canceled` / `expired`），區分暫時性與永久性錯誤，僅針對可重試的失敗 `custom_id` 補送重試，並支援讀取中斷時安全跳過已寫回條款。\n\n### Worked Example：三大場景單位經濟學與架構橫向對比\n\n以下帶入本書基準數字（`OrderOps` 日工單 `50,000` 筆、`Claude Sonnet 5.5` `$2.00 / $10.00`、`Claude Opus 5.5` `$4.00 / $20.00`、`Batch API` `50%` 折扣），在假設情境下對比三個場景的單次成本與月度規模（實際交付時限仍須以排隊、配額與處理時間驗證）：\n\n```text\n================================================================================\n三大企業場景單位經濟學橫向對比（基準：2026-11 牌價，假設情境）\n================================================================================\n指標 / 場景        | 場景 A: OrderOps         | 場景 B: 合約審核             | 場景 C: On-call 分診\n-------------------+--------------------------+------------------------------+-------------------------\n日請求量           | 50,000 筆/天             | 200 份/天 (夜間批次)         | 120 次告警/天\n平均 Context       | 6,000 前綴 + 1,200/回合  | 18,000 tokens/份 (整份加總)* | 24,000 tokens/次\n選用模型組合       | Haiku + Sonnet (+Opus)   | Sonnet 5.5                   | Sonnet 5.5 + Opus 5.5**\nBatch / Thinking   | Prompt Caching (無Batch) | Batch 50% + Adaptive Think   | Adaptive Think (即時)\n-------------------+--------------------------+------------------------------+-------------------------\n單次成本計算       | 優化後混合均價           | Input: 18K * $1.00/M         | 全 Sonnet 基準:\n                   | \u003c= $0.012 / 筆           | Output: 3.5K * $5.00/M       | Input: 24K * $2.00/M\n                   | (ch08 未用Batch省88.57%)| = $0.018 + $0.0175           | Output: 4K * $10.00/M\n                   | (見 ch08 推導與說明)     | = $0.0355 / 份               | = $0.0880 / 次\n-------------------+--------------------------+------------------------------+-------------------------\n月度 API 成本      | \u003c= $18,000 / 月          | 200 * 30 * $0.0355           | 全 Sonnet: $316.80 / 月\n(以 30 天計)       |                          | = $213.00 / 月               | 混用Opus: $316.80*(1+Opus比例)\n-------------------+--------------------------+------------------------------+-------------------------\n核心 ROI 槓桿      | 省下大量一線客服工時     | 假設法務初審 2h -\u003e 10m       | 假設縮短 MTTR（須計入\n(未附實測假設)     | (即時設計須依完整帳本計) | 夜間批次再省 50%             | 人工複核與沙盒等成本）\n================================================================================\n* 場景 B 的 18K/3.5K 為整份合約所有條款請求的計費加總（含重複政策、Schema、交叉引用與 thinking tokens）。\n** 場景 C 若 120 次/日同 token 量並以部分 Opus 取代 Sonnet，月成本為 $316.80 * (1 + Opus 比例)（全 Opus 為 $633.60/月）；若 Opus 為追加呼叫，須另計其 token 成本。\n```\n\n---\n\n## 動手做\n\n本章完整可執行的 TypeScript 與 Python 程式碼位於：\n- TypeScript：[examples/ts/ch11/index.ts](../examples/ts/ch11/index.ts)\n- Python：[examples/py/ch11/main.py](../examples/py/ch11/main.py)\n\n執行驗證步驟如下：\n\n```bash\n# TypeScript\ncd books/enterprise-agents/examples/ts\nnpx tsx ch11/index.ts\n\n# Python\ncd books/enterprise-agents/examples/py\npython3 ch11/main.py\n```\n\n執行後終端機應輸出以下驗證結果（以 TypeScript 為例，Python 輸出結構相同；兩者皆使用本地模擬資料，不需外部 API 金鑰即可重現）：\n\n```text\n=== Scenario B: Contract \u0026 Compliance Audit ===\nValid findings: 1\nRejected findings: [ { clauseId: 'C-14.2', reason: 'citation_mismatch_or_fabricated' } ]\nBatch requests: 2, Sonnet standard=$2/$10, 50% Batch est=$0.0355\n\n=== Scenario C: On-Call Triage \u0026 PR Review ===\nTriage verification: { accepted: true }\n```\n\n建議接著做兩項邊界實驗：\n1. **驗證引用偽造與空引文攔截**：在場景 B 的測試資料中，把 `C-19.1` 的 `verbatimQuote` 中的 `7 days` 改為 `7 Days`（或改為空字串 `\"\"`），重新執行後應看到 `Valid findings: 0`，且 `C-19.1` 被歸類為 `citation_mismatch_or_fabricated`（註：`POLICY-CAP-200` 純為偽造引文測資）。\n2. **驗證單源遙測與無沙盒阻斷**：在場景 C 的 `StructuredPrReview` 中，保留 `logs` 與 `sandbox_repro` 但刪除 `metrics`，重新執行後 `verifyTriageEvidenceChain` 應回傳 `{ accepted: false }`，確認 `sandbox_repro` 不會被誤計為遙測來源。\n\n---\n\n## 自我檢核\n\n1. **（入門｜10 分鐘）** 在場景 B 的合約審核 Pipeline 中，為什麼不能只靠 System Prompt 要求模型「請務必逐字引用原文」，而必須在程式碼層執行 `validateCitations`？\n2. **（進階｜15 分鐘）** 假設場景 B 的每日合約掃描量從 `200` 份成長到 `2,000` 份，且法務團隊要求改為「使用者上傳後 15 分鐘內必須看到結果」。這項需求變更會如何影響 `Batch API` 的使用？月度成本會變成多少？如何在不爆預算的前提下滿足法務需求？\n3. **（挑戰｜20 分鐘）** 在場景 C 的 `verifyTriageEvidenceChain` 中，如果模型在 `observedSnippet` 裡填入一段「真實存在於 Log，但時間戳記是三天前、與本次 `INC-4092` 無關」的舊錯誤，現有檢查會放行嗎？請設計一個額外的欄位與驗證規則來防禦這類時間錯置幻覺。\n\n### 參考解答\n\n1. **Prompt 只是軟性約束，程式碼才是硬性邊界**：模型在長文本與高風險推理下仍可能把條款語意改寫（paraphrasing）、回傳空引文，或在 `Adaptive Thinking` 後產出看似合理但原文不存在的字串。`validateCitations` 以非空檢查與 `source.text.includes(verbatimQuote)` 作為確定性閘門，能阻斷未附逐字引文的風險結論進入法務報告；實務上可先將雙方字串做空白正規化（collapse whitespace）再比對，避免換行差異造成誤殺。\n2. **失去 `Batch API` 50% 折扣，月成本翻倍**：`Batch API` 屬於非同步排程（完成時限與服務條款依官方文件為準）；在沒有足夠期限保證與實測之前，不應假定其可滿足 15 分鐘要求。若全數改為即時 Messages API，單份成本從 `$0.0355` 跳回標準價 `$0.0710`（Input `18K × $2.00/M = $0.036` + Output `3.5K × $10.00/M = $0.035`）。以每日 `2,000` 份、每月 30 天計算，月成本將從 `2,000 × 30 × $0.0355 = $2,130` 暴增為 `2,000 × 30 × $0.0710 = $4,260` USD。若所有合約皆須滿足 15 分鐘要求，必須為全部合約設計並驗證符合期限的即時處理與排隊流程；只有法務同意改採分級 SLA，才能僅針對「加急合約」走即時 API、其餘例行合約維持夜間 `Batch API`。\n3. **若現有實作僅檢查欄位非空而未驗證受信任的 incident 與時間窗綁定，該舊紀錄可能放行；須檢視完整驗證流程才能判定**：防禦方式是在 `StructuredPrReview` 新增由系統注入的受信任 `incidentStartTime`（ISO-8601 時間戳記）欄位，並在 `verifyTriageEvidenceChain` 強制驗證每筆 `EvidenceRecord.timestamp` 必須落在 `[incidentStartTime - 15m, now + 30s]` 的單一明確時間窗內（以 `now + 30s` 作為微幅時鐘偏移的明確上界，同時防止未來時間偽造）；超出視窗即判定為無效證據並退回。\n\n---\n\n## 延伸閱讀\n\n- [ch02 — Tool Use 契約與 MCP 權限切分](ch02-tool-use-and-mcp.md)：唯讀與寫入工具的架構邊界。\n- [ch06 — 可靠性工程與持久化執行](ch06-reliability-and-durable-execution.md)：`Idempotency Key` 與人工介入佇列設計。\n- [ch08 — 成本與延遲最佳化](ch08-cost-and-latency-optimization.md)：`OrderOps` 從 `$152,250` 壓降至 `≤ $18,000` 的完整成本推導。\n- [ch12 — 從原型到上線：PRR 檢查表與演進路線](ch12-production-readiness-blueprint.md)：將本章三大場景推進正式生產環境的最終上線審查。\n"}, {"id": "ch12-production-readiness-blueprint", "file": "ch12-production-readiness-blueprint.md", "group": "Part IV — 可觀測性與企業實戰藍圖", "title": "第 12 章：從原型到上線：架構決策清單、組織落地與演進路線", "md": "# 第 12 章：從原型到上線：架構決策清單、組織落地與演進路線\n\n## 從你已知的出發\n\n前十一章已經把企業級 Agent 的所有核心零件逐一拆解完畢：從 `Agent Loop` 狀態機（ch01）、Tool Use 契約與 `MCP`（ch02）、Context Engineering 與 Prompt Caching（ch03）、持久化狀態與 Agentic RAG（ch04）、多 Agent 協作（ch05）、可靠性工程與 `HITL`（ch06）、Eval 評測與 `Pass^k`（ch07）、單位經濟學與延遲 SLO（ch08）、安全護欄與權限治理（ch09）、可觀測性與 OpenTelemetry 追蹤（ch10），到批次處理與演進調校（ch11）。\n\n然而，把原型推上線時，團隊卡住的往往不是單一模組寫不出來，而是三個系統級決策沒有落地：第一，該用裸 Claude API 自建狀態機、採用 Claude Agent SDK，還是引入第三方編排框架？第二，上線前如何用客觀的 Production Readiness Review（PRR）門檻驗收，而不是憑感覺放行？第三，如何設計從人工輔助到有界自動化的流量切換路線，讓技術團隊與業務主管都能在可量化的風險內推進？\n\n本章以本書建立的原生 Agent 工程詞彙，為 `OrderOps` 完成上線前的最後一哩路：架構選型矩陣、企業級 PRR 檢查表、90 天漸進式自主權演進與估算淨效益計算，以及五種常見的上線失敗模式復盤。\n\n## 核心機制\n\n### Buy vs Build 決策矩陣：抽象洩漏與除錯成本\n\n在 `OrderOps` 這類企業級系統中，技術棧選型的核心矛盾在於「開發速度」與「故障時的控制權」之間的取捨。當 `Agent Loop` 在生產環境發生 `429` 限流、`529 overloaded_error`、Streaming 斷線或 `cache_read_input_tokens` 歸零時，工程師必須能直接取得實際送出的請求、`messages` 陣列、逐回合 `usage`、重試次數、`stop_reason` 與 `tool_result` 配對，並能接管取消與審批流程，否則故障定位與恢復時間將大幅拉長。\n\n| 評估維度 | 裸 Claude API + 自建狀態機 | Claude Agent SDK | 第三方編排框架 |\n|---|---|---|---|\n| **控制粒度** | 完整掌控 `messages`、`cache_control` 斷點、`thinking` block 與重試退避 | 封裝標準 `Agent Loop` 與 Tool 迴圈，保留核心鉤子（Hooks）與權限回呼 | 常隱藏 Prompt 組裝、上下文壓縮與內部重試邏輯 |\n| **抽象洩漏風險** | 最低；所有 HTTP Header 與 Token 用量直接暴露 | 低；與 Claude 原生能力（如 Prompt Caching、Extended Thinking）同步 | 高；框架自帶的記憶體管理或摘要策略常破壞快取前綴 |\n| **除錯與觀測成本** | 需自建 OpenTelemetry Span，但根因定位最直接 | 內建標準事件流，易於串接既有追蹤系統 | 故障時需先剝除框架外殼才能還原真實 API Payload |\n| **適用場景** | 高併發、嚴格成本／延遲 SLO（如 `OrderOps`）、需客製化 `HITL` 狀態機 | 中等複雜度、標準工具呼叫與檔案／程式操作任務 | 快速 POC 驗證、跨多模型供應商的實驗性專案 |\n\n對 `OrderOps` 而言，日工單量達 50,000 筆／天（1,500,000 筆／月，尖峰 12 req/s 若每單 5 次模型呼叫，持續穩態下平均約 60 次模型請求／秒；瞬間尖峰仍須依各回合時間分布與併發情況估算），且必須將月成本從未優化基準的 $152,250 壓低至 ≤ $18,000（降幅 ≥ 88%，單筆 ≤ $0.012），同時滿足分流 p95 ≤ 2.5 秒、多步工具處置 p95 ≤ 18 秒的延遲 SLO。這類系統一旦被第三方框架的隱藏回合或動態 System Prompt 破壞 Prompt Caching 命中率，成本會立刻失控。因此，生產環境建議採用「裸 Claude API + 自建狀態機」，或僅在非核心子流程使用「Claude Agent SDK」（註：Messages API 需由應用程式自行執行回合上限，而 `max_turns`／`maxTurns` 為 Agent SDK 選項；線上應依模型採 adaptive thinking 與 `output_config.effort`，並以 `strict: true` 與 `output_config.format` 約束結構）。\n\n### 企業級 Production Readiness Review（PRR）檢查表\n\n上線前的 PRR 不是人工勾選的書面表單，而是一套必須與 CI/CD 及啟動腳本綁定的硬性門檻（以下數值如 `$50`、14 天、90 天、180 天、70% 與 5%／3 分鐘皆為本案例的政策設定，實際導入應對應壓測與 Eval 驗收證據）。以下六個維度缺一不可：\n\n1. **可靠性與超時階層（參見 ch06）**：必須嚴格遵守 `0 \u003c toolTimeoutMs \u003c llmTimeoutMs \u003c wallClockTimeoutMs`。例如 `OrderOps` 設定單次工具超時 5,000 ms、單次 LLM 呼叫超時 12,000 ms、`max_turns` 上限 8 回合（政策上限 12）、總 Wall-Clock 上限 60,000 ms，並將剩餘 deadline 向下傳遞以限制每次呼叫與 SDK／應用層重試總次數；所有寫入／金流工具強制要求 `Idempotency Key`，付款端逾時後須先查核原操作結果再決定重試或轉人工。\n2. **Eval 基準線（參見 ch07）**：離線回歸測試集必須達到 `Pass@1` ≥ 0.92 且 `Pass^3` ≥ 0.85（若進入 L3 全自動退款，則要求離線 `Pass^3` ≥ 0.95，並明訂線上重跑同一案例三次的抽樣與嚴重度標註方式）。任何 Prompt 或工具 Schema 變更未通過門檻一律阻斷部署。\n3. **安全護欄與權限治理（參見 ch09）**：18 個工具必須明確切分為 12 個唯讀與 6 個寫入／金流工具；工單內容、模型輸出與 MCP 回傳皆視為不可信資料，每次寫入須在工具服務端依租戶、操作者、訂單、幣別與剩餘可退額重新授權（L1 不授予寫入憑證、L2 核准綁定特定請求內容與版本、L3 執行單筆及累計上限）。若受法遵規範限制資料落地美國，須在設定中鎖定 `inference_geo: \"us\"`（1.1× 費率倍率適用於 input、output、cache write 與 cache read，儲存與日誌落地須另行驗證）並納入預算模型。\n4. **成本上限與熔斷（參見 ch08）**：設定每日（`$18,000 ÷ 30 = $600`）與每月（`≤ $18,000`）硬性預算上限，並在請求前預留預算、預測消耗將觸及 `$600` 前阻擋新增支出，同時定期對帳；另設單日消耗達 150%（`$900`）的後備告警與自動降級（純人工或 L1 模式），僅用於處理計量延遲或極端超額情境，不能作為維持 `$600` 硬上限的主要防線。\n5. **可觀測性與告警（參見 ch10）**：OpenTelemetry 追蹤必須覆蓋每個 `Turn`、工具耗時、request ID、`stop_reason` 與 `usage` 欄位（含 `cache_read_input_tokens`），預設不留存敏感原文或明訂遮罩與存取政策，且稽核日誌保留天數 ≥ 90 天（本案例設為 180 天）。\n6. **合規與回滾預案**：必須具備一鍵切換至純規則引擎或人工佇列的 Feature Flag，確保 30 秒內停止新寫入並完成流量退場，同時對在途或結果未知的退款執行對帳。\n\n### 漸進式自主權路線：L1 → L2 → L3\n\n企業級 Agent 不應在上線第一天就取得寫入資料庫或執行退款的完全自主權。正確的演進路線分為三個階段（L1 驗收於上線前 Shadow 期間同步完成）：\n\n```text\nL1 (Copilot 輔助)\n  └─ Agent 只讀不寫，產出草稿與建議，100% 由人工點擊執行\n       │  (驗證準確率與延遲 SLO 達標後推進)\n       ▼\nL2 (HITL 人工核准)\n  └─ Agent 執行唯讀查詢並組裝寫入請求，關鍵金流/異動由人工一鍵核准\n       │  (連續 14 天 Pass^3 \u003e= 0.95 且零嚴重誤判後推進)\n       ▼\nL3 (有界全自動)\n  └─ 低風險、小額（如 \u003c= $50）工單全自動結案；高風險與超額工單仍退回 L2\n```\n\n### Worked Example：`OrderOps` 90 天分階段流量切換與估算淨效益\n\n假設 `OrderOps` 日工單量為 50,000 筆／天（1,500,000 筆／月），人工處理每筆工單平均耗時 4 分鐘（`4/60` 小時），客服人力時薪成本為 $24／小時，則純人工處理單筆成本為 `$1.60`（月成本 `$2,400,000`）。本案例採 rollout 假設單筆基礎 API 成本為 `$0.011`（全球推論月滿載 API 成本為 `$16,500`，啟用 `inference_geo: \"us\"` 的 1.1× 倍率後為 `$18,150`，即 `$605/天`）。若 `$18,000` 為含 US 加價的硬上限，則階段四須將基礎單價壓低至 `≤ $0.010909/筆`（例如 `$0.0108/筆` 對應 `$17,820/月`），否則 `validateProductionConfig` 會因 `estMonthlyUsd = 18,150 \u003e 18,000` 阻斷部署（若要通過成本檢查，須調高月預算上限，或維持 `$18,000` 硬上限並將基礎單價降至 `≤ $0.010909／筆`或減少計費量）。以下帳本沿用 `$0.011/筆` 計算估算淨效益（註：真確 ROI 仍須定義分母並計入人工覆核、營運與退款損失等成本）：\n\n```text\n[階段一：Day 1–14 Shadow 模式（0% 實際寫入，工具層禁止外部寫入與通知）]\n- 流量比例：100% 旁路鏡像（50,000 筆/天），僅記錄決策不對外回覆\n- 人工覆核節省：0 小時（純測試期）\n- 月化 API 成本：$16,500（14 天實際 $7,700）\n- 淨效益：負值（純投資期，用於驗證延遲 p95 \u003c= 2.5s / 18s 與 Pass^3 \u003e= 0.85）\n\n[階段二：Day 15–35 Canary L2（5% 流量進入 HITL）]\n- 每日進入 L2 工單：50,000 × 5% = 2,500 筆/天（75,000 筆/月）\n- L2 人工核准耗時：從 4 分鐘降至 1 分鐘（每筆節省 3 分鐘 = 0.05 小時 = $1.20）\n- 每月節省人工成本：75,000 × 0.05 小時 × $24/小時 = $90,000/月\n- 僅呼叫 5% 流量 API 成本：$825/月（若維持全量影子呼叫則為 $16,500/月）\n- 估算淨效益（以 5% 實際呼叫計）：$90,000 - $825 = +$89,175/月\n\n[階段三：Day 36–60 擴大 L2（30% 流量）]\n- 每日 L2 工單：50,000 × 30% = 15,000 筆/天（450,000 筆/月）\n- 每月節省人工成本：450,000 × 0.05 小時 × $24/小時 = $540,000/月\n- 對應 API 成本（30% 流量）：450,000 × $0.011 = $4,950/月\n- 估算淨效益：$540,000 - $4,950 = +$535,050/月\n\n[階段四：Day 61–90 100% L2/L3 混合（70% L2 + 30% L3 有界全自動，啟用 us 1.1x）]\n- L2 工單（70%）：1,050,000 筆/月 × 0.05 小時 × $24 = $1,260,000/月節省\n- L3 工單（30%）：450,000 筆/月 × (4/60) 小時 × $24 = $720,000/月節省\n- 總節省人工成本：$1,980,000/月\n- 滿載 API 成本（含 us 1.1x 資料駐留）：$16,500 × 1.1 = $18,150/月（$605/天；此情境須先調高 $18,000 預算上限或將基礎單價降至 ≤ $0.010909 方能通過部署檢查）\n- 估算淨效益：$1,980,000 - $18,150 = +$1,961,850/月\n- 損益平衡點：70/30 組合加權節省為 0.7×$1.20 + 0.3×$1.60 = $1.32/筆；\n  若將滿載 $605/天視為固定支出，至少需處理 ≥ 459 筆/天（605 ÷ 1.32 = 458.33，約佔總量 0.92%）方能打平；若依變動成本計算（每筆含 1.1× 約 $0.0121），單筆淨節省為 $1.32 − $0.0121 = $1.3079，每處理一筆即為正效益。\n```\n\n## 故障模式與防禦\n\n企業 Agent 專案從 POC 走到上線，最常見的五種失敗模式如下：\n\n1. **無界迴圈與超時雪崩**：未設定 `max_turns` 或 `wallClockTimeoutMs`，導致模型在工具回傳 `is_error: true` 時無限重試，耗盡連線池並觸發 `429` 限流。**防禦**：在 PRR 啟動檢查中強制驗證 `0 \u003c toolTimeoutMs \u003c llmTimeoutMs \u003c wallClockTimeoutMs` 與 `max_turns \u003c= 12`，將剩餘 deadline 傳遞給每次呼叫，超時立即取消未完成工作並降級。\n2. **快取靜默失效（Cache Silent Miss）**：上線後因動態插入時間戳或隨機請求 ID 至 System Prompt 前段，導致 `cache_read_input_tokens` 歸零，成本將大幅攀升（若其餘模型與 token 假設亦接近未優化條件，甚至可能趨近 `$152,250` 基準）。**防禦**：在可觀測性儀表板設定 `cache_hit_ratio \u003c 0.70`（定義為統計視窗內快取讀取佔已記錄快取讀寫 token 的比例：`cache_read_input_tokens ÷ (cache_read_input_tokens + cache_creation_input_tokens)`）的 P1 告警，並針對分母為 0 或預期可快取請求卻無快取讀寫的情形另設異常檢查（若要衡量全部合格前綴的實際命中率，仍須另行估算或記錄未進入快取讀寫的合格前綴 token），同時在 CI 中鎖定前綴結構。\n3. **權限膨脹與無保護寫入**：為了追求自動化率，未經 `Pass^3` 驗收便直接開放寫入／金流工具，導致異常輸入觸發錯誤退款。**防禦**：嚴格執行 L1 → L2 → L3 門檻，所有寫入授權皆在工具服務端重驗，L2 強制 `hitlRequiredForMutating = true`，L3 強制設定單筆與累計金額上限，並僅在收到完整且驗證通過的 `tool_use` 區塊後執行。\n4. **架構抽象洩漏**：過度依賴第三方編排框架的預設記憶體與重試機制，當線上出現 `529 overloaded_error`、`pause_turn`、`max_tokens`、`refusal` 或 Streaming 半途斷線時，無法定位是框架重試還是模型輸出異常。**防禦**：核心業務路徑採用裸 SDK 與自建狀態機，保留完整原始 `usage` 與 `stop_reason` 日誌，遇 `429` 遵守 `Retry-After` 與剩餘 deadline。\n5. **缺乏退場機制**：上線後遇到上游 API 長時間異常或模型品質退化，系統沒有快速切回人工或規則引擎的開關，只能硬扛故障。**防禦**：在入口閘道器實作 Feature Flag 與錯誤率熔斷器，錯誤率（失敗請求 ÷ 總請求）連續 3 分鐘超過 5% 即於 30 秒內停止新寫入並切換至純人工佇列（人工佇列亦須設承載上限）。\n\n## 動手做\n\n我們將 PRR 檢查表實作為可執行的自動化啟動檢查腳本（Config Validator），在服務啟動或 CI/CD 階段載入部署設定並自動阻斷不合格的配置。\n\n- 完整 TypeScript 實作：[examples/ts/ch12/index.ts](../examples/ts/ch12/index.ts)\n- 完整 Python 實作：[examples/py/ch12/main.py](../examples/py/ch12/main.py)\n\n以下節錄 TypeScript 版 `validateProductionConfig` 的部分核心閘道邏輯，驗證延遲 SLO、成本上限（含 `inference_geo: \"us\"` 的 1.1× 倍率）與部分自主權等級的相依條件（完整驗證仍須確認 `passPow3` 為有效有限數值且達標，並由設定檢查或其他控制機制驗收連續 14 天、零嚴重誤判、累計退款上限與 L1 無寫入憑證等條件）：\n\n```ts\n// 節錄自 examples/ts/ch12/index.ts\nconst sloOk =\n  isPos(cfg.latencySlo.triageP95Sec) \u0026\u0026\n  isPos(cfg.latencySlo.multiStepP95Sec) \u0026\u0026\n  cfg.latencySlo.triageP95Sec \u003c= 2.5 \u0026\u0026\n  cfg.latencySlo.multiStepP95Sec \u003c= 18;\n\nconst geoValid = cfg.inferenceGeo === \"global\" || cfg.inferenceGeo === \"us\";\nconst geoMult = cfg.inferenceGeo === \"us\" ? 1.1 : 1.0;\nconst estMonthlyUsd =\n  cfg.budget.dailyTicketVolume * 30 * cfg.budget.estimatedBaseCostPerTicketUsd * geoMult;\nconst costOk =\n  geoValid \u0026\u0026\n  isPos(cfg.budget.monthlyBudgetCapUsd) \u0026\u0026\n  isPos(cfg.budget.dailyTicketVolume) \u0026\u0026\n  isPos(cfg.budget.estimatedBaseCostPerTicketUsd) \u0026\u0026\n  estMonthlyUsd \u003c= cfg.budget.monthlyBudgetCapUsd;\n\nconst levelValid = cfg.autonomyLevel === \"L1\" || cfg.autonomyLevel === \"L2\" || cfg.autonomyLevel === \"L3\";\nlet autonomyOk = levelValid \u0026\u0026 typeof cfg.safety.hitlRequiredForMutating === \"boolean\";\nif (cfg.autonomyLevel === \"L2\" \u0026\u0026 !cfg.safety.hitlRequiredForMutating) {\n  autonomyOk = false;\n}\nif (\n  cfg.autonomyLevel === \"L3\" \u0026\u0026\n  (!isPos(cfg.safety.maxAutoRefundUsd) || cfg.safety.maxAutoRefundUsd \u003e 50 || cfg.evalGate.passPow3 \u003c 0.95)\n) {\n  autonomyOk = false;\n}\n```\n\n執行驗證腳本，確認所有閘道皆回傳 `[PASS]` 且 Exit Code 為 `0`：\n\n```bash\npython3 books/enterprise-agents/examples/py/ch12/main.py\ncd books/enterprise-agents/examples/ts \u0026\u0026 npx tsx ch12/index.ts\n```\n\n## 自我檢核\n\n1. **（入門｜10 分鐘）** 在 Buy vs Build 決策矩陣中，為什麼 `OrderOps` 這類高併發且對成本敏感的系統，不建議在核心路徑使用高度抽象的第三方編排框架？\n2. **（進階｜15 分鐘）** 若 `OrderOps` 計畫將某類低風險退款工單從 L2 升級為 L3 有界全自動，根據本章的 PRR 與演進規範，必須滿足哪三個必要條件？\n3. **（挑戰｜20 分鐘）** 假設 `OrderOps` 因合規要求必須啟用 `inference_geo: \"us\"`（1.1× 倍率），且客戶要求將日工單量提升至 60,000 筆／天。若單筆優化後基礎 API 成本維持 $0.011，請計算新的月度滿載 API 成本，並說明在什麼條件下仍能維持正向估算淨效益。\n\n### 參考解答\n\n1. **解答**：第三方編排框架常隱藏 Prompt 組裝、動態摘要與內部重試邏輯，容易破壞 Prompt Caching 的穩定前綴，導致 `cache_read_input_tokens` 命中率下降、成本失控；此外，當發生 `429`、`529` 或 Streaming 斷線時，抽象層會遮蔽底層 `messages` 與 `stop_reason`，大幅增加線上除錯時間。\n2. **解答**：第一，離線 Eval 的 `Pass^3` 必須達到 ≥ 0.95（高於通用上線基準 0.85）；第二，必須設定明確的單筆自動執行金額上限（`0 \u003c maxAutoRefundUsd \u003c= 50`），超額工單仍強制退回 L2 人工核准；第三，在 L2 階段需連續 14 天穩定運行且 `Pass^3 \u003e= 0.95`、零嚴重誤判（30 秒 Feature Flag 退場機制則屬通用 PRR 要求）。\n3. **解答**：\n   - **新月度滿載 API 成本**：`60,000 筆/天 × 30 天 = 1,800,000 筆/月`。基礎成本為 `1,800,000 × $0.011 = $19,800/月`，乘以 `1.1×` 資料駐留倍率後為 `$21,780/月`。\n   - **維持正向估算淨效益條件**：雖然 `$21,780` 超過原訂 $18,000 的月成本上限，但只要 L2/L3 每日能節省的人力處理成本超過每日 API 成本（`$21,780 ÷ 30 = $726/天`），系統整體仍為正向估算淨效益。以 L2 每筆節省 $1.20（3 分鐘 × $24/小時）計算，若將全量 API 呼叫成本 `$726/天` 視為固定支出，則每日處理 605 筆 L2 工單（約佔總量 1.01%）恰好打平、606 筆起淨效益為正（若 API 呼叫量隨實際處理筆數變動，則應依實際呼叫筆數計算變動成本）；但工程團隊仍須同步向財務申請調高預算上限，或進一步優化快取命中率與模型分層比例。\n\n## 延伸閱讀\n\n- [Anthropic Claude API Pricing \u0026 Prompt Caching](https://platform.claude.com/docs/en/about-claude/pricing) — 官方針對模型牌價、Prompt Caching 倍率與 `inference_geo` 資料駐留費率的完整說明。\n- [Google SRE Book: Production Readiness Review](https://sre.google/sre-book/evolving-sre-engagement-model/) — 傳統分散式系統 PRR 審查流程與 [Launch Coordination Checklist](https://sre.google/sre-book/launch-coordination/) 的原始工程規範。\n- 本書前序章節回顧：可靠性工程與熔斷（ch06）、Eval 與 `Pass^k`（ch07）、單位經濟學（ch08）、安全治理（ch09）與可觀測性（ch10）。\n"}, {"id": "appendix-code-index", "file": "appendix-code-index.md", "group": "附錄", "title": "附錄 A：完整程式碼範例索引（TypeScript \u0026 Python）", "md": "# 附錄 A：完整程式碼範例索引（TypeScript \u0026 Python）\n\n本書所有章節的完整可執行程式碼皆位於 `books/enterprise-agents/examples/`，採 TypeScript（`@anthropic-ai/sdk` + `zod`）與 Python（`anthropic` + `pydantic`）雙語言同步實作，並共用 `shared/` 內的 `OrderOps` 領域型別、2026-11 Claude API 牌價計費器與模擬後端。\n\n## 執行環境準備\n\n```bash\n# TypeScript (Node.js 20+)\ncd books/enterprise-agents/examples/ts\nnpm install\nexport ANTHROPIC_API_KEY=\"sk-ant-...\"\nnpx tsx ch01/index.ts\n\n# Python (Python 3.10+)\ncd books/enterprise-agents/examples/py\npip install -e .\nexport ANTHROPIC_API_KEY=\"sk-ant-...\"\nPYTHONPATH=. python3 ch01/main.py\n```\n\n## 分章程式碼對照表\n\n| 章節 | 主題 | TypeScript 完整實作 | Python 完整實作 |\n|---|---|---|---|\n| 共用模組 | 領域型別、2026-11 計費器、OrderOps Mock | `examples/ts/shared/types.ts`, `orderops-mock.ts` | `examples/py/shared/types.py`, `orderops_mock.py` |\n| **ch01** | Agent Loop 狀態機、`stop_reason` 與預算護欄 | `examples/ts/ch01/index.ts` | `examples/py/ch01/main.py` |\n| **ch02** | Strict Tool Use、`output_config.format` 與 MCP Server | `examples/ts/ch02/index.ts` | `examples/py/ch02/main.py` |\n| **ch03** | 前綴穩定 Prompt Builder、Extended Thinking 與 Compaction | `examples/ts/ch03/index.ts` | `examples/py/ch03/main.py` |\n| **ch04** | 持久化 Session Store 與多租戶 Agentic RAG | `examples/ts/ch04/index.ts` | `examples/py/ch04/main.py` |\n| **ch05** | Router-Specialists 與 Orchestrator-Workers 協作 | `examples/ts/ch05/index.ts` | `examples/py/ch05/main.py` |\n| **ch06** | Event-sourced Checkpoint、429/529 退避與 HITL 續跑 | `examples/ts/ch06/index.ts` | `examples/py/ch06/main.py` |\n| **ch07** | Trajectory Eval、Code Grader 與 LLM-as-a-Judge | `examples/ts/ch07/index.ts` | `examples/py/ch07/main.py` |\n| **ch08** | Model Router、Prompt Caching、Batch API 與成本計費器 | `examples/ts/ch08/index.ts` | `examples/py/ch08/main.py` |\n| **ch09** | 確定性 Policy Engine、PII 遮罩與 Haiku 輸入護欄 | `examples/ts/ch09/index.ts` | `examples/py/ch09/main.py` |\n| **ch10** | OpenTelemetry GenAI Trace 與預算異常熔斷器 | `examples/ts/ch10/index.ts` | `examples/py/ch10/main.py` |\n| **ch11** | 合約合規審核 Pipeline 與 On-call 分診 Agent | `examples/ts/ch11/index.ts` | `examples/py/ch11/main.py` |\n| **ch12** | Production Readiness Review（PRR）自動啟動檢查器 | `examples/ts/ch12/index.ts` | `examples/py/ch12/main.py` |\n"}, {"id": "outline", "file": "outline.md", "group": "內部文件（_meta）", "title": "全書大綱（Outline）— 企業級 Agent 工程", "md": "# 全書大綱（Outline）— 企業級 Agent 工程\n\n**書名**：企業級 Agent 工程：用 Claude API 打造可上線、可觀測、可控成本的代理系統\n**Slug / ID**：`enterprise-agents` / `eagent`\n**書型**：`instructional`（教學實戰型，`zh-TW`，`specialist` 語域）\n**完整程式碼路徑**：`books/enterprise-agents/examples/`（`ts/` TypeScript + `py/` Python 雙語言完整實作；章節內文僅放核心片段與檔路徑指標）\n\n---\n\n## 一、貫穿全書的主軸（Spine）\n\n**OrderOps — 企業級營運與異常處理代理平台（Enterprise Operations Agent Platform）**\n\n一個中型跨國電商與供應鏈平台的內部營運代理服務，每天處理 **50,000 筆**客戶與供應商異常工單（出貨延遲、庫存同步差異、退換貨審核、發票對帳、SLA 違約通知）。\n全書 12 章從零把 `OrderOps` 從一個容易失控、每月燒掉 **$152,250** 的裸迴圈原型，一步步重構成具備嚴格工具契約、持久化狀態、多代理協作、Eval 回歸閘門、安全護欄、OpenTelemetry 觀測性，且月成本壓低至 **$18,000 以下**的生產級系統。\n除主軸 `OrderOps` 外，第 11 章額外深入拆解兩個真實企業場景：**企業合約與法規合規審核助理**、**自動化 On-call 告警分診與程式碼審查 Agent**。\n\n---\n\n## 二、跨章一致性基準表（Base-Numbers Table — Single Source of Truth）\n\n\u003e 本表為全書唯一數字基準；`_meta/running-examples.md` 與 `_meta/maintenance.md` 皆由本表逐字複製，禁止在各章單獨修改數字。\n\n| 基準項目 | 數值 | 單位 | 所屬概念 | 引用章節 |\n|---|---|---|---|---|\n| OrderOps 日工單量 | 50,000 | 筆／天（1,500,000 筆／月，以 30 天計） | 主軸工作負載 | ch01, ch06, ch08, ch10, ch11 |\n| OrderOps 尖峰流量 | 12 | req/s（平均 0.58 req/s，尖峰 20×） | 吞吐與限流設計 | ch01, ch06, ch08, ch10 |\n| OrderOps 延遲 SLO | 2.5 / 18 | 秒（分流 p95 ≤ 2.5s；多步工具處置 p95 ≤ 18s） | 延遲預算 | ch01, ch08, ch10, ch12 |\n| OrderOps 工具總數 | 18 | 個工具（12 唯讀 Read-only + 6 寫入／金流 Mutating） | 工具面與權限切分 | ch02, ch05, ch08, ch09, ch11 |\n| OrderOps 基準前綴大小 | 6,000 | tokens（System Prompt 2,400 + 18 工具 Schema 3,600） | Context 與快取基準 | ch02, ch03, ch08 |\n| OrderOps 基準回合與輸出 | 5 / 1,200 / 350 | 回合 / 每回合新增輸入 tokens / 每回合輸出 tokens | 單筆基準消耗 | ch01, ch03, ch08 |\n| OrderOps 未優化單筆消耗 | 42,000 / 1,750 | 累計輸入 tokens / 累計輸出 tokens（5 回合加總） | 成本基準 | ch01, ch08 |\n| OrderOps 未優化基準成本 | $0.1015 / $5,075 / $152,250 | 單筆 / 每日 / 每月（全用 Sonnet 5.5、無快取） | 單位經濟學基準 | ch01, ch08, ch10, ch12 |\n| Claude Haiku 5.5 牌價（≤100K） | $0.10 / $0.50 | USD / MTok（Input / Output；\u003e100K 為 $0.50 / $2.50） | 模型分層計價 | ch01, ch05, ch08, ch09 |\n| Claude Sonnet 5.5 牌價 | $2.00 / $10.00 | USD / MTok（Input / Output） | 預設工作層計價 | ch01, ch03, ch08, ch11 |\n| Claude Opus 5.5 牌價 | $4.00 / $20.00 | USD / MTok（Input / Output） | 高風險仲裁層計價 | ch03, ch05, ch08, ch11 |\n| Prompt Caching 寫入倍率 | 1.25× / 2.0× | 基礎輸入單價（5m TTL / 1h TTL） | 快取寫入成本 | ch03, ch08 |\n| Prompt Caching 讀取倍率 | 0.05× / 0.10× | 基礎輸入單價（Sonnet/Opus 5.5 為 0.05×；Haiku 5.5 為 0.10×） | 快取命中折扣 | ch03, ch08 |\n| Batch API 折扣 | 50% | Input 與 Output 同步半價（Sonnet 5.5 為 $1.00 / $5.00） | 非同步批次降本 | ch06, ch08, ch11 |\n| 資料駐留附加倍率 | 1.1× | 啟用 `inference_geo: \"us\"` 全類別 token 費率倍率 | 法遵成本權衡 | ch08, ch09, ch12 |\n| OrderOps 目標優化月成本 | ≤ $18,000 | USD / 月（降幅 ≥ 88%，單筆 ≤ $0.012） | 優化工程目標 | ch08, ch10, ch12 |\n\n---\n\n## 三、橋接登記表與遞減排程（Bridge Registry \u0026 Fade-out Schedule）\n\n- **規則**：每章 ≤ 1 個外部橋接；全域每個來源 ≤ 1 次（遠低於上限 3 次）；僅限技術機制對照並明確標註「失效邊界」。\n- **前段（ch01–ch04）**：每章 1 個資深後端機制對照。\n- **中段（ch05–ch08）**：精簡系統機制對照，並優先引用前章已定義的 Agent 概念。\n- **後段（ch09–ch12）**：**全部 `none`**，純以本書原生 Agent 工程詞彙撰寫。\n\n| 章節 | 階段 | 指定橋接來源（或 `none`） |\n|---|---|---|\n| ch01 | 前段 | 有限狀態機與事件迴圈（FSM + Event Loop） |\n| ch02 | 前段 | 微服務 RPC 契約與冪等鍵（OpenAPI + Idempotency Key） |\n| ch03 | 前段 | CPU 快取局部性與虛擬記憶體分頁（Cache Prefix + Paging） |\n| ch04 | 前段 | 資料庫預寫日誌與列級權限（WAL Checkpoint + Row-Level Security） |\n| ch05 | 中段 | 分散式 Saga 編排與補償（Orchestrated Saga） |\n| ch06 | 中段 | 熔斷器與 Transactional Outbox 模式 |\n| ch07 | 中段 | CI 回歸測試套件與契約斷言（Regression Suite） |\n| ch08 | 中段 | 雲端 FinOps 單位成本與 CDN 快取命中率 |\n| ch09 | 後段 | `none`（原生詞彙） |\n| ch10 | 後段 | `none`（原生詞彙） |\n| ch11 | 後段 | `none`（原生詞彙） |\n| ch12 | 後段 | `none`（原生詞彙） |\n\n---\n\n## 四、各章規格（Per-Chapter Specs）\n\n### Part I：核心引擎與契約\n\n#### ch01 (`ch01-agent-architecture.md`) — 從 Workflow 到 Agent：執行迴圈、狀態機與可控邊界\n- **教學目標**：能判斷一個企業需求應寫成確定性 Workflow 還是 Agent，並能用 Claude Messages API 從零實作具備強制終止契約的最小 `OrderOps` Agent Loop。\n- **Spine 觸點**：建立 `OrderOps` 基準情境（50,000 筆/天、5 回合、未優化月燒 $152,250），跑通第一版單工單處理迴圈。\n- **Must-cover**：Workflow vs Agent 決策光譜（Augmented LLM、Chaining、Routing、Parallelization、Orchestrator-Workers、Evaluator-Optimizer）；LLM 無狀態本質與外部狀態機；`stop_reason`（`end_turn`、`tool_use`、`max_tokens`、`refusal`）驅動迴圈；硬性護欄（`max_turns`、token budget、wall-clock timeout）。\n- **Must-NOT-cover**：Prompt Caching 細算（見 ch08）、MCP 協定細節（見 ch02）、持久化斷點續跑（見 ch06）。\n- **Worked Example**：算清 `OrderOps` 5 回合無快取對話歷史膨脹（6,000 → 7,200 → 8,400 → 9,600 → 10,800 = 42,000 input tokens）與單筆 $0.1015 / 月 $152,250 成本帳。\n- **完整程式碼**：`examples/ts/ch01/`、`examples/py/ch01/`（帶 budget guard 與 `stop_reason` 狀態機的 `OrderOps` 最小 Agent Loop）。\n\n#### ch02 (`ch02-tool-use-and-mcp.md`) — Tool Use 契約、Strict Schema 與 MCP 企業整合\n- **教學目標**：能設計抗幻覺、可自癒的工具介面，使用 `strict: true` 與 `output_config.format` 強制型別契約，並將企業工具封裝為 Stateless Streamable HTTP MCP Server。\n- **Spine 觸點**：實作 `OrderOps` 的 18 個工具切分（12 唯讀 + 6 寫入），示範退款工具的 Idempotency Key 與兩階段確認契約。\n- **Must-cover**：Tool Schema 設計原則（防參數歧義、枚舉約束、錯誤訊息作為給模型的觀測而非例外中斷）；`strict: true` Tool Use 與 `output_config.format`（Zod / Pydantic）；寫入型工具的冪等鍵與乾跑（dry-run）；MCP 傳輸層演進（Stdio vs Streamable HTTP）、Stateless HTTP 水平擴展與 Claude API `mcp_servers` Connector。\n- **Must-NOT-cover**：Prompt Injection 權限攻擊防禦全貌（見 ch09）、工具動態裁切降本細算（見 ch08）。\n- **Worked Example**：18 個工具 Schema 佔用 3,600 tokens 的前綴開銷計算，以及嚴格 Schema 下非法參數重試率從 12% 降至 0% 所省下的額外回合成本。\n- **完整程式碼**：`examples/ts/ch02/`、`examples/py/ch02/`（Strict Tool Use + Zod/Pydantic `output_config.format` + Streamable HTTP MCP Server 範例）。\n\n#### ch03 (`ch03-context-and-prompt-engineering.md`) — Context Engineering：從 Prompt 調校到上下文預算管理\n- **教學目標**：能用系統工程思維設計 Context 結構，避免 Context Rot、最大化 Prompt Cache 前綴命中，並正確配置 Extended Thinking 與長對話 Compaction。\n- **Spine 觸點**：將 `OrderOps` 的 6,000-token 前綴重組為「靜態前綴 + 動態工單載荷」，並實作工具大回傳裁剪與第 4 回合後摘要壓縮。\n- **Must-cover**：Context Window 組成與 Context Rot（中間遺失與干擾物稀釋）；前綴穩定排序（`tools` → `system` → `messages`）與 `cache_control` 斷點擺放；XML 結構化分區與 Few-shot 邊界案例；Extended Thinking（`budget_tokens`、`max_tokens \u003e budget_tokens`、多回合保留 `thinking` block 與 signature）；工具結果截斷、Compaction 與 Scratchpad 模式。\n- **Must-NOT-cover**：Prompt Caching 完整 5m vs 1h FinOps 財務建模（見 ch08）、向量檢索演算法細節（見 ch04）。\n- **Worked Example**：開啟 Extended Thinking（`budget_tokens: 4,000`）對單筆高難度工單成本與 `max_tokens` 配額的影響實算，以及工具回傳從 8,000 tokens 裁剪為 600 tokens 對後續 3 回合累計輸入的乘法節省。\n- **完整程式碼**：`examples/ts/ch03/`、`examples/py/ch03/`（前綴分層 Prompt Builder + Extended Thinking 多回合保留 + Compaction 壓縮器）。\n\n---\n\n### Part II：狀態、記憶與多代理協作\n\n#### ch04 (`ch04-state-memory-and-retrieval.md`) — 持久化狀態、多層記憶與企業知識檢索（Agentic RAG）\n- **教學目標**：能將 Agent 對話狀態持久化至 PostgreSQL/Redis 支援跨請求續跑，並建構具多租戶 ACL 隔離與引用溯源的 Agentic RAG。\n- **Spine 觸點**：讓 `OrderOps` 能跨小時恢復等待供應商回覆的工單狀態，並在查詢退貨政策與供應商合約時附帶精準條文 Citations。\n- **Must-cover**：三層記憶模型（Working Context、Session State Store、Long-term Episodic/Semantic Memory）；對話歷史與工具結果的 Schema 化持久化；傳統靜態 RAG 的盲點 vs Agentic RAG（Hybrid Search BM25 + Vector + Rerank，由 Agent 自主決定檢索查詢與重試）；多租戶 ACL 前置過濾（Pre-filtering，絕不在 LLM 輸出後才過濾）；Citation 驗證。\n- **Must-NOT-cover**：跨節點分散式重試與 Outbox（見 ch06）、資安 Prompt Injection 攻防細節（見 ch09）。\n- **Worked Example**：比較靜態 RAG 每次塞入 Top-10 文件（+6,500 tokens/筆）與 Agentic RAG 按需檢索（僅 35% 工單觸發、Top-3 精準段落 +1,800 tokens）在 50,000 筆/天下的 token 與成本差額。\n- **完整程式碼**：`examples/ts/ch04/`、`examples/py/ch04/`（PostgreSQL/SQLite Session Store + 多租戶 Hybrid Search 檢索工具與 Citation 檢查）。\n\n#### ch05 (`ch05-multi-agent-orchestration.md`) — 多 Agent 協作架構：Orchestrator、Handoff 與隔離沙盒\n- **教學目標**：能辨別何時該拆分多 Agent，設計 Context 隔離的 Orchestrator-Workers 與 Router-Specialists 拓撲，並評估自建 Loop 與 Claude Agent SDK 的取捨。\n- **Spine 觸點**：把 `OrderOps` 拆分為「Haiku 分流 Router + 唯讀調查 Worker + 高風險退款仲裁 Opus Specialist」，隔離工具面與上下文。\n- **Must-cover**：單 Agent 的擴展瓶頸（工具過多導致選錯、長調查汙染決策上下文、權限無法最小化）；三大協作拓撲（Router + Specialists、Orchestrator-Workers、Evaluator-Optimizer）；Sub-agent 上下文壓縮回傳契約；平行扇出（Fan-out）與部分失敗處理；自建 Loop vs Claude Agent SDK（`@anthropic-ai/claude-agent-sdk` / `claude-agent-sdk`）選型邊界。\n- **Must-NOT-cover**：模型路由的完整月度財務總帳（見 ch08）、底層佇列與 Saga 重放細節（見 ch06）。\n- **Worked Example**：單一 Sonnet 攜帶全部 18 個工具（6,000 token 前綴）vs Router（Haiku，0 工具）+ 3 個 Specialist（各 6 工具，前綴 2,800 tokens）的上下文與工具誤觸率對照實算。\n- **完整程式碼**：`examples/ts/ch05/`、`examples/py/ch05/`（Orchestrator-Workers 平行調度器與 Handoff 狀態傳遞實作）。\n\n#### ch06 (`ch06-reliability-and-durable-execution.md`) — 企業級可靠性：重試、熔斷、Checkpoint 與長任務執行\n- **教學目標**：能讓 Agent 在 LLM API 限流、Streaming 斷線、外部 ERP 逾時與人工審批暫停下，依然保證不重複扣款、不遺失進度。\n- **Spine 觸點**：為 `OrderOps` 的退款與批次對帳流程實作 Event-sourced Checkpoint、429/529 指數退避與 HITL 暫停／喚醒狀態機。\n- **Must-cover**：LLM 與工具雙層故障分類（429 Rate Limit、529 Overloaded、Streaming 半途斷裂、Tool 逾時與部分寫入）；Token Bucket 與 Retry-After 感知的退避重試；Checkpoint / Replay 執行日誌設計；非同步 Worker Queue 與 Batch API 狀態追蹤；Human-in-the-Loop（HITL）審批暫停、超時升級與喚醒續跑。\n- **Must-NOT-cover**：OpenTelemetry 監控儀表板與告警（見 ch10）、安全權限引擎細節（見 ch09）。\n- **Worked Example**：`OrderOps` 尖峰 12 req/s、每筆平均 5 次 API 呼叫（= 60 RPM 尖峰轉換為 3,600 API calls/min）下的 Rate Limit（RPM / ITPM / OTPM）容量與退避佇列深度估算。\n- **完整程式碼**：`examples/ts/ch06/`、`examples/py/ch06/`（Checkpoint Durable Runner + Exponential Backoff with Jitter + HITL Pause/Resume 狀態機）。\n\n---\n\n### Part III：優化、調校與單位經濟學\n\n#### ch07 (`ch07-evals-and-systematic-tuning.md`) — 評測驅動開發（EDD）：建立可量化的 Eval 與調校迴圈\n- **教學目標**：能建立涵蓋結果與工具軌跡的自動化 Eval 套件，運用 Pass^k 衡量企業可靠性，並以錯誤分類（Error Taxonomy）系統化調校 Prompt、工具描述與模型參數。\n- **Spine 觸點**：為 `OrderOps` 建立 100 題黃金評測集（涵蓋正常工單、邊界異常、誘騙輸入），示範一次從 78% → 95% 通過率的系統化調校實錄。\n- **Must-cover**：三層評測器（確定性 Code Grader、校準後的 LLM-as-a-Judge、人工抽檢）；Trajectory Eval（工具呼叫順序、參數正確性、冗餘步數）；Pass@k vs Pass^k 數學意義（為什麼 90% 單次成功率在 5 步任務只剩 59%）；Error Taxonomy 驅動的調校工作流（Prompt 改寫 vs 工具 Schema 重構 vs 模型升級）；把 Eval 整合進 CI/CD 防止回歸。\n- **Must-NOT-cover**：線上流量影子部署與模型漂移監控（見 ch10）。\n- **Worked Example**：Pass^k 數學實算（單步準確率 p = 0.90 vs 0.98 在 5 步與 10 步下的整條任務成功率；k=5 次重複執行全對率 Pass^5），以及 100 題黃金集每次 CI 跑 Eval 的 Claude API 成本核算。\n- **完整程式碼**：`examples/ts/ch07/`、`examples/py/ch07/`（Trajectory + Code Grader + LLM-as-a-Judge 評測執行器與報表產出）。\n\n#### ch08 (`ch08-cost-and-latency-optimization.md`) — 成本與延遲優化：從 $152,250/月壓到 $18,000/月的工程帳本\n- **教學目標**：能精算 Agent 系統的單位經濟學，依序套用五大降本槓桿與四大延遲優化手法，並量化每項優化對品質與 SLO 的影響。\n- **Spine 觸點**：把 `OrderOps` 從 ch01 基準 **$152,250 / 月** 逐步優化至 **≤ $18,000 / 月**（降幅 ≥ 88%），同時將分流 p95 壓在 2.5s 內、多步處置 p95 壓在 18s 內。\n- **Must-cover**：五大降本槓桿與精算：(1) Model Routing（60% 簡單工單 Haiku 5.5 + 35% 標準工單 Sonnet 5.5 + 5% 高風險 Opus 5.5）；(2) Prompt Caching（5m vs 1h TTL 損益平衡、0.05×/0.10× 讀取折扣與 512/1024 最小門檻陷阱）；(3) Context Compaction 與工具回傳裁剪；(4) Batch API 50% 折扣（將 30% 非即時對帳／稽核工單轉離線批次）；(5) 工具分組精簡前綴。延遲優化：TTFT vs TPOT 拆解、Streaming 漸進回傳、平行 Tool Calls、預取（Prefetch）與 Speculative 並行護欄。\n- **Must-NOT-cover**：雲端法遵 `inference_geo` 的法務合規條文（見 ch09，本章僅算 1.1× 成本影響）。\n- **Worked Example**：完整的 `OrderOps` 5 階段降本瀑布帳本（逐步列出 input/output/cache-write/cache-read tokens、單筆成本、月成本與累積降幅，全部算式閉合且經獨立驗算）。\n- **完整程式碼**：`examples/ts/ch08/`、`examples/py/ch08/`（Model Router + Prompt Caching 前綴管理 + Batch API 提交流程 + 單筆即時成本計費器）。\n\n#### ch09 (`ch09-security-guardrails-and-governance.md`) — 安全、護欄與企業治理：對抗 Prompt Injection 與越權\n- **教學目標**：能針對 Agent 特有攻擊面建立縱深防禦，將權限檢查與高風險寫入控制從「靠 Prompt 勸說」移至確定性 Policy Engine。\n- **Spine 觸點**：加固 `OrderOps` 對抗惡意客訴工單中的間接 Prompt Injection（企圖誘騙 Agent 執行超額退款或洩漏其他客戶資料），建立退款上限 Policy Engine 與完整 Audit Trail。\n- **Must-cover**：Agent 威脅模型（Direct/Indirect Prompt Injection、Tool Argument Tampering、Data Exfiltration、Confused Deputy）；縱深防禦分層（Haiku 輕量輸入分類器、資料與指令隔離、最小權限 Scoped Token、確定性 Policy Engine 攔截寫入與金額門檻、輸出 PII 遮罩）；程式碼執行與外部呼叫的沙盒隔離；不可竄改 Audit Trail、資料駐留（`inference_geo: \"us\"` 1.1× 成本與延遲權衡）與零訓練保留政策驗證。\n- **Must-NOT-cover**：通用 Web OWASP 基礎（假設讀者已知）、Eval 評測框架建置（見 ch07）。\n- **Worked Example**：在 50,000 筆/天流量下，前置 Haiku 5.5 護欄分類器（每筆 500 input / 50 output tokens）的每日附加成本與延遲開銷，對比一次未攔截超額退款事故的預期損失（Expected Loss）。\n- **完整程式碼**：`examples/ts/ch09/`、`examples/py/ch09/`（確定性 Policy Engine + PII Redactor + Haiku Input Guardrail 中介層）。\n\n---\n\n### Part IV：可觀測性與企業實戰藍圖\n\n#### ch10 (`ch10-observability-and-operations.md`) — 可觀測性與維運：Trace、成本歸因、漂移監控與上線切換\n- **教學目標**：能為 Agent 系統建立端到端分散式追蹤、按租戶／工單類型歸因成本，並設計安全的影子流量、金絲雀發布與模型升級切換流程。\n- **Spine 觸點**：為 `OrderOps` 加上 OpenTelemetry Trace（Request → Turn → LLM/Tool Span）、即時每筆成本追蹤與異常迴圈告警。\n- **Must-cover**：Agent 專用遙測結構（OpenTelemetry GenAI 語意慣例：記錄 `model`、`input_tokens`、`cache_read_tokens`、`stop_reason`、tool latency、cost_usd）；核心維運指標（Task Completion Rate、Tool Error Rate、Cache Hit Ratio、Cost per Ticket、p95 Latency、HITL Escalation Rate）；成本異常熔斷（單筆／每小時預算上限）；Shadow Mode、Canary Rollout 與模型版本 Pinning／升級回歸流程。\n- **Must-NOT-cover**：Prometheus/Grafana 基礎安裝教學（假設讀者已知）。\n- **Worked Example**：偵測 Prompt Cache 失效事故——當某次部署意外在 System Prompt 前段插入動態 `timestamp` 導致 Cache Hit Ratio 從 85% 暴跌至 0%，計算 4 小時內 `OrderOps` 多燒的美元金額與告警觸發閾值設計。\n- **完整程式碼**：`examples/ts/ch10/`、`examples/py/ch10/`（OpenTelemetry Tracer 封裝 + Token/Cost Attribution 攔截器 + Budget Circuit Breaker）。\n\n#### ch11 (`ch11-enterprise-patterns-in-action.md`) — 三大企業實戰場景深度拆解\n- **教學目標**：能將前 10 章的架構組件組裝並遷移到三類截然不同的企業生產場景，掌握各場景的專屬瓶頸與架構取捨。\n- **Spine 觸點**：先收束 `OrderOps` 端對端完整生產架構，再橫向對照另兩個真實企業場景（合約合規審核、On-call 分診與 PR 審查）。\n- **Must-cover**：\n  1. **場景 A：OrderOps 跨系統營運與退款自動化**（多 ERP 唯讀查詢 + 冪等寫入 + HITL 門檻 + 成本壓至 ≤ $18,000/月）。\n  2. **場景 B：企業合約與法規合規審核助理**（長合約切分與索引、Extended Thinking 條款風險比對、強制原文 Citations、夜間 Batch API 批次掃描 50% 降本）。\n  3. **場景 C：自動化 On-call 告警分診與程式碼審查 Agent**（唯讀 Log/Metrics/Trace MCP 工具 + 隔離沙盒重現測試 + 結構化 PR Review 輸出 + 防根因幻覺的證據鏈規則）。\n- **Must-NOT-cover**：重複解釋前章單一機制定義（一律以 `（見 chNN）` 指向）。\n- **Worked Example**：三大場景的單位經濟學與架構橫向對比表（日請求量、平均 Context、選用模型組合、是否用 Batch/Thinking、單次成本與 ROI 計算）。\n- **完整程式碼**：`examples/ts/ch11/`、`examples/py/ch11/`（場景 B 合約審核 Pipeline 與場景 C 告警分診 Agent 的可執行骨幹）。\n\n#### ch12 (`ch12-production-readiness-blueprint.md`) — 從原型到上線：架構決策清單、組織落地與演進路線\n- **教學目標**：能主導一個企業級 Agent 專案從 POC 走到正式上線，完成 PRR 審查、技術棧選型（裸 API vs Agent SDK vs 框架）與分階段自動化演進。\n- **Spine 觸點**：對 `OrderOps` 執行完整的上線前 Production Readiness Review（PRR），制定 L1 → L2 → L3 漸進式上線與退場回滾計畫。\n- **Must-cover**：Buy vs Build 決策矩陣（裸 Claude API + 自建狀態機 vs Claude Agent SDK vs 第三方編排框架，分析抽象洩漏與除錯成本）；企業級 PRR 檢查表（可靠性、Eval 基準、安全護欄、成本上限、觀測告警、合規審計）；漸進式自主權路線（L1 Copilot 輔助 → L2 HITL 人工核准 → L3 有界全自動）；五種常見企業 Agent 專案上線失敗模式復盤。\n- **Must-NOT-cover**：重複詳解各子系統實作細節（一律回指 ch01–ch11）。\n- **Worked Example**：`OrderOps` 上線 90 天分階段流量切換計畫（Shadow 14 天 → 5% Canary L2 → 30% L2 → 100% L2/L3 混合），計算各階段人工覆核工時節省與 API 成本的淨 ROI 損益平衡點。\n- **完整程式碼**：`examples/ts/ch12/`、`examples/py/ch12/`（Production Readiness 自動化啟動檢查腳本與 Config Validator）。\n"}, {"id": "style-guide", "file": "style-guide.md", "group": "內部文件（_meta）", "title": "寫作契約（Style Guide）— 企業級 Agent 工程", "md": "# 寫作契約（Style Guide）— 企業級 Agent 工程\n\n## 1. 目標讀者與口吻（Calibration Only）\n\n- **讀者設定**：具 5–10 年經驗的資深後端工程師（`specialist` 語域）。\n- **假設已知（不從零解釋）**：TypeScript / Node.js、Python 基礎語法、REST/RPC、關聯式資料庫（PostgreSQL/MySQL）、Redis、訊息佇列、分散式系統冪等性與重試、Docker/Kubernetes、CI/CD、基本自動化測試，以及日常操作 AI Coding Agent（如 Claude Code、Codex、Gemini CLI、自訂 Skills/Workflow）的實務手感。\n- **從零建立（程式與工程深度）**：以程式碼（預設 Claude API：`@anthropic-ai/sdk` 與 Python `anthropic` SDK）從零建構可上線的企業級 AI Agent 系統——涵蓋執行迴圈狀態機、Tool Use 契約與 MCP、Context Engineering、持久化狀態與 Agentic RAG、多 Agent 協作、可靠性工程、Eval 評測與系統化調校、單位經濟學與成本／延遲優化、安全護欄與權限治理、可觀測性與上線維運。\n- **口吻要求**：直接切入系統架構、底層機制、邊界條件（Edge Cases）、失敗模式與實作細節。零商業吹捧、零入門廢話。\n- **個人材料禁令**：讀者個人背景僅供深度校準。**書中絕不出現任何特定個人經歷、任職公司、真實客戶或個人 Side Project**；所有企業場景皆為泛化設計（以主軸系統 `OrderOps` 與三個泛化企業案例呈現）。\n\n## 2. 語言與措辭契約（zh-TW）\n\n- 繁體中文（台灣工程用語），禁止簡體字與中國大陸術語（`軟件`→`軟體`、`內存`→`記憶體`、`默認`→`預設`、`大模型`→`LLM`、`智能體`→`Agent`、`提示詞`→`Prompt`）。\n- 技術專有名詞保留英文（如 Tool Use、Prompt Caching、Context Rot、Idempotency Key、Rate Limit、Eval、Pass^k），不硬翻。\n- 遵守 `references/zh-prose.md`：白話直述、動詞優先；避免「進行＋動作名詞」「透過…的方式」「在…的情況下」「對於…而言」「存在著」「作為一個…」等翻譯腔。\n- **CommonMark 粗體邊界規則**（pitfalls #13）：全形引號與括號一律放在 `**...**` 之外（寫 `是「**詞**」`、`**詞**（註）`，絕不寫 `是**「詞」**`）。\n- 程式碼註解、變數名、設定檔、log 訊息一律使用英文。\n\n## 3. 書型契約（Instructional Form）\n\n每章必須嚴格依序包含以下六個二級標題（`##`），與 `_meta/lint.config.json` 鎖定的 `skeleton_slots` 完全一致：\n\n1. `## 從你已知的出發`\n2. `## 核心機制`\n3. `## 故障模式與防禦`\n4. `## 動手做`\n5. `## 自我檢核`\n6. `## 延伸閱讀`\n\n### 深度與實作要求\n\n- **長度不設上限，但零灌水**：以「讓資深後端工程師徹底看懂機制並能動手做出企業級系統」為唯一標準。\n- **真實數字 Worked Example（每章 ≥ 1 個）**：使用 fenced code block（或結構化算式區塊）帶入真實數字端到端計算（token 數、美元成本、延遲毫秒、配額吞吐、錯誤率或 Pass^k），禁止只丟抽象公式。所有跨章引用的基準數字必須與 `_meta/running-examples.md` 逐字一致。\n- **程式碼片段 vs 完整程式碼**：\n  - 章節內文只放**精簡、承重的核心程式碼片段**（標明關鍵機制、契約型別、API 呼叫或防禦邏輯），並清楚標註完整可執行檔案路徑（例如 `examples/ts/ch01/...` 與 `examples/py/ch01/...`）。\n  - 完整可執行的 TypeScript（`@anthropic-ai/sdk` + `zod`）與 Python（`anthropic` + `pydantic`）程式碼統一放在 `books/enterprise-agents/examples/` 對應章節目錄。\n- **練習與解答（`## 自我檢核`）**：\n  - 每題標註**難度**（`入門` / `進階` / `挑戰`）與**預估時間**（如 `15 分鐘`）。\n  - 緊接於題目之後必須有 `### 參考解答`（或 `### 解答`）子節，給出完整推導與工程取捨，不給敷衍一句話。\n- **決策框架優先於工具清單**：提到任何 SDK、框架或協定，必先拆解其底層機制與取捨邊界。\n- **實戰工程細節強制要求（Production Details）**：每章必須包含可直接落地的生產級細節，禁止只停留在概念描述：\n  - **真實 API Payload 與欄位邊界**：展示關鍵請求／回應的真實欄位（如 `tool_use` / `tool_result` 配對 ID、`is_error: true`、`cache_control` 斷點位置、`usage.cache_read_input_tokens`、`thinking` block 與 `signature`、`stop_reason` 狀態分支）。\n  - **具體數值與配置基線**：不寫「設定合理的 timeout／重試次數」，必須給出具體工程值與依據（例如單次 LLM timeout、Tool timeout、總 wall-clock 上限、`max_turns`、退避倍率與 Jitter、連線池／併發上限、SQL 表結構與索引鍵、Redis Key 命名與 TTL）。\n  - **真實上線故障與排錯線索**：點名具體 HTTP 狀態碼與 Header（`429` + `retry-after`、`529 overloaded_error`、Streaming 半途斷線殘缺 JSON、Cache silent miss 導致 `cache_creation_input_tokens = 0`）、實際 log 欄位與告警閾值。\n\n## 4. 橋接契約（Bridging Contract）\n\n- 僅允許**技術機制對技術機制**的客觀對照（禁止日常比喻與第二人稱閒聊口吻）。\n- 每章最多 1 個外部橋接，必須同時寫出「成立邊界」與「失效邊界」。\n- 嚴格遵守 `outline.md` 的 Bridge Registry 與遞減排程：\n  - 前段（ch01–ch04）：每章 1 個後端系統機制對照（全域每個來源 ≤ 1 次）。\n  - 中段（ch05–ch08）：精簡後端架構對照並優先交叉引用前章已定義概念。\n  - 後段（ch09–ch12）：**零外部比喻（`none`）**，全以本書已建立的原生 Agent 工程詞彙撰寫。\n\n## 5. 符號與術語規範\n\n| 規範寫法 | 意義 | 首次定義章節 |\n|---|---|---|\n| `Agent Loop` | 模型推理 → 工具執行 → 觀測回填的狀態轉移迴圈 | ch01 |\n| `Turn`（回合） | Agent Loop 內一次完整的 Messages API 呼叫與其對應工具執行 | ch01 |\n| `MTok` | 百萬 tokens（1,000,000 tokens），所有 API 計價單位 | ch01 |\n| `TTFT` / `TPOT` | Time To First Token / Time Per Output Token | ch08 |\n| `Pass@k` / `Pass^k` | k 次嘗試至少成功 1 次 / 連續 k 次全部成功 | ch07 |\n| `HITL` | Human-in-the-Loop（人工審批／介入節點） | ch06 |\n| `MCP` | Model Context Protocol | ch02 |\n| `OrderOps` | 貫穿全書的企業級營運代理系統主軸範例 | ch01 |\n\n- 數學表示採 Unicode 純文字（不啟用 KaTeX），如 `×`、`÷`、`≤`、`≥`、`≈`、`∑`、`^`。\n- ASCII 架構圖遵守 CJK = 2 欄寬度對齊，複雜方框圖由 Python 腳本生成並通過 `check_diagrams.py`。\n"}, {"id": "maintenance", "file": "maintenance.md", "group": "內部文件（_meta）", "title": "維護與一致性手冊（Maintenance）— 企業級 Agent 工程", "md": "# 維護與一致性手冊（Maintenance）— 企業級 Agent 工程\n\n## 1. 跨章一致性基準表（Base-Numbers Table — Byte-Identical to `outline.md`）\n\n\u003e 修改任何基準數值時，**必須先改 `_meta/outline.md`**，再同步重新生成 `_meta/running-examples.md` 與本表，並更新所有引用章節。\n\n| 基準項目 | 數值 | 單位 | 所屬概念 | 引用章節 |\n|---|---|---|---|---|\n| OrderOps 日工單量 | 50,000 | 筆／天（1,500,000 筆／月，以 30 天計） | 主軸工作負載 | ch01, ch06, ch08, ch10, ch11 |\n| OrderOps 尖峰流量 | 12 | req/s（平均 0.58 req/s，尖峰 20×） | 吞吐與限流設計 | ch01, ch06, ch08, ch10 |\n| OrderOps 延遲 SLO | 2.5 / 18 | 秒（分流 p95 ≤ 2.5s；多步工具處置 p95 ≤ 18s） | 延遲預算 | ch01, ch08, ch10, ch12 |\n| OrderOps 工具總數 | 18 | 個工具（12 唯讀 Read-only + 6 寫入／金流 Mutating） | 工具面與權限切分 | ch02, ch05, ch08, ch09, ch11 |\n| OrderOps 基準前綴大小 | 6,000 | tokens（System Prompt 2,400 + 18 工具 Schema 3,600） | Context 與快取基準 | ch02, ch03, ch08 |\n| OrderOps 基準回合與輸出 | 5 / 1,200 / 350 | 回合 / 每回合新增輸入 tokens / 每回合輸出 tokens | 單筆基準消耗 | ch01, ch03, ch08 |\n| OrderOps 未優化單筆消耗 | 42,000 / 1,750 | 累計輸入 tokens / 累計輸出 tokens（5 回合加總） | 成本基準 | ch01, ch08 |\n| OrderOps 未優化基準成本 | $0.1015 / $5,075 / $152,250 | 單筆 / 每日 / 每月（全用 Sonnet 5.5、無快取） | 單位經濟學基準 | ch01, ch08, ch10, ch12 |\n| Claude Haiku 5.5 牌價（≤100K） | $0.10 / $0.50 | USD / MTok（Input / Output；\u003e100K 為 $0.50 / $2.50） | 模型分層計價 | ch01, ch05, ch08, ch09 |\n| Claude Sonnet 5.5 牌價 | $2.00 / $10.00 | USD / MTok（Input / Output） | 預設工作層計價 | ch01, ch03, ch08, ch11 |\n| Claude Opus 5.5 牌價 | $4.00 / $20.00 | USD / MTok（Input / Output） | 高風險仲裁層計價 | ch03, ch05, ch08, ch11 |\n| Prompt Caching 寫入倍率 | 1.25× / 2.0× | 基礎輸入單價（5m TTL / 1h TTL） | 快取寫入成本 | ch03, ch08 |\n| Prompt Caching 讀取倍率 | 0.05× / 0.10× | 基礎輸入單價（Sonnet/Opus 5.5 為 0.05×；Haiku 5.5 為 0.10×） | 快取命中折扣 | ch03, ch08 |\n| Batch API 折扣 | 50% | Input 與 Output 同步半價（Sonnet 5.5 為 $1.00 / $5.00） | 非同步批次降本 | ch06, ch08, ch11 |\n| 資料駐留附加倍率 | 1.1× | 啟用 `inference_geo: \"us\"` 全類別 token 費率倍率 | 法遵成本權衡 | ch08, ch09, ch12 |\n| OrderOps 目標優化月成本 | ≤ $18,000 | USD / 月（降幅 ≥ 88%，單筆 ≤ $0.012） | 優化工程目標 | ch08, ch10, ch12 |\n\n## 2. 已知脆弱事實清單（Fragile-Facts Index — from `landscape-2026-11.md`）\n\n| 項目 | 2026-11 基準值 | 受影響章節 | 備註 |\n|---|---|---|---|\n| Claude 5.5 模型 ID 與牌價 | Haiku 5.5 `$0.10/$0.50`、Sonnet 5.5 `$2.00/$10.00`、Opus 5.5 `$4.00/$20.00` | ch01, ch03, ch05, ch08, ch09, ch11 | `⚠️` 每次新模型發布或調價須同步重算 `OrderOps` 帳本 |\n| Prompt Caching 最小前綴門檻與讀取倍率 | 512 / 1,024 / 4,096 tokens；讀取 0.05× / 0.10× | ch03, ch08 | `⚠️` 依各模型官方文件定期複核 |\n| 官方 SDK 最新穩定版 | `@anthropic-ai/sdk` v1.10.0；`anthropic` v2.11.0；Claude Agent SDK | ch01, ch02, ch05, ch12, examples/ | `⚠️` 升級主版本時須重驗 `examples/ts` 與 `examples/py` |\n| MCP Streamable HTTP \u0026 Connector 規格 | Streamable HTTP 取代 HTTP+SSE；Stateless HTTP；`mcp_servers` Connector | ch02, ch11 | `⚠️` 追蹤 `modelcontextprotocol.io` 與 Anthropic beta 標頭演進 |\n| Context Window 與 `inference_geo` 倍率 | 最高 1M tokens；`inference_geo: \"us\"` 1.1× | ch03, ch08, ch09, ch12 | `⚠️` 費率與區域支援可能調整 |\n\n## 3. 時效性掃描協定（Scan Protocol）\n\n執行時效性掃描（「掃描書的時效性」）時依序執行：\n1. 針對第 2 節每一筆 `⚠️` 脆弱事實，以官方文件與套件庫（`claude.com`、npm、PyPI、`modelcontextprotocol.io`）重新查證；重大變動須兩個獨立來源確認。\n2. 若任何基準數字變動：先更新 `_meta/outline.md` 基準表 → 逐字同步 `_meta/running-examples.md` 與本檔第 1 節 → 同步更新所有引用章節與 `examples/ts/shared/types.ts`、`examples/py/shared/types.py`。\n3. 重跑 Tier-1 檢查：\n   ```bash\n   python3 tools/md-reader/gate_book.py books/enterprise-agents/book-src --lang zh-TW --config books/enterprise-agents/book-src/_meta/lint.config.json\n   python3 tools/md-reader/check_diagrams.py books/enterprise-agents/book-src\n   ```\n4. 若改動載重算式或架構機制，重跑 `verify_book.py --writer-family google --no-cache --chapters \u003ctouched\u003e`；重新打包書架與閱讀器。\n5. 於下方掃描日誌新增一行紀錄。\n\n## 4. 橋接登記鎖（Bridge Registry Lock）\n\n| 章節 | 階段 | 鎖定橋接來源 |\n|---|---|---|\n| ch01 | 前段 | 有限狀態機與事件迴圈（FSM + Event Loop） |\n| ch02 | 前段 | 微服務 RPC 契約與冪等鍵（OpenAPI + Idempotency Key） |\n| ch03 | 前段 | CPU 快取局部性與虛擬記憶體分頁（Cache Prefix + Paging） |\n| ch04 | 前段 | 資料庫預寫日誌與列級權限（WAL Checkpoint + Row-Level Security） |\n| ch05 | 中段 | 分散式 Saga 編排與補償（Orchestrated Saga） |\n| ch06 | 中段 | 熔斷器與 Transactional Outbox 模式 |\n| ch07 | 中段 | CI 回歸測試套件與契約斷言（Regression Suite） |\n| ch08 | 中段 | 雲端 FinOps 單位成本與 CDN 快取命中率 |\n| ch09–ch12 | 後段 | `none`（原生詞彙） |\n\n## 5. 掃描與建置日誌（Scan Log）\n\n- `2026-11-22` | `full`（初版建置）| ch01–ch12（12 章＋附錄 A＋TS/Python 雙語言完整範例）| P2（`gemini-4-hydrogen-low` + self-review + `codex gpt-6.2-sol low` review）、P3（0 errors / 0 warnings / 0 diagram findings / 14 Python 檔編譯通過）、P4（2 輪跨模型裁決 + 5 筆單家 OpenAI `incorrect` 終修、Bridging 12/12 通過、餘下 `imprecise` 經使用者確認豁免）、P4.5（Teach-test 12/12 通過）、P5 打包與無頭瀏覽器驗證完成。\n"}, {"id": "landscape-2026-11", "file": "landscape-2026-11.md", "group": "內部文件（_meta）", "title": "Fact Baseline — Claude API \u0026 Enterprise Agent Ecosystem (2026-11)", "md": "# Fact Baseline — Claude API \u0026 Enterprise Agent Ecosystem (2026-11)\n\nVerified on **2026-11-21** via web search against official Anthropic documentation, package registries, and MCP specification sources. Items marked `⚠️` are time-sensitive (prices, SDK versions, model IDs, or fast-moving specs) and must be re-checked during future scans.\n\n## 1. Claude API Models \u0026 List Pricing (`⚠️` volatile)\n\nStandard global routing list prices (per 1M tokens = `MTok`):\n\n| Model Tier | Model ID (canonical) | Input ($/MTok) | Output ($/MTok) | Prompt Cache Write (5m / 1h) | Prompt Cache Read | Notes |\n|---|---|---|---|---|---|---|\n| High-end Reasoning | `claude-opus-5-5` | $4.00 | $20.00 | 1.25× ($5.00) / 2.0× ($8.00) | 0.05× ($0.20) | Flagship agentic coding \u0026 complex reasoning |\n| Balanced Default | `claude-sonnet-5-5` | $2.00 | $10.00 | 1.25× ($2.50) / 2.0× ($4.00) | 0.05× ($0.10) | Primary production workhorse |\n| Fast / Routing (≤100K) | `claude-haiku-5-5` | $0.10 | $0.50 | 1.25× ($0.125) / 2.0× ($0.20) | 0.10× ($0.01) | High-volume classification, routing, guardrails |\n| Fast / Routing (\u003e100K) | `claude-haiku-5-5` | $0.50 | $2.50 | 1.25× ($0.625) / 2.0× ($1.00) | 0.10× ($0.05) | Higher tier applies to whole request when prompt+cache \u003e100K tokens |\n\n- Output tokens consistently cost **5×** base input across active Claude 5.5 tiers.\n- **Batch API**: **50% discount** on both input and output tokens across all tiers (e.g., `claude-sonnet-5-5` drops to $1.00 input / $5.00 output per MTok) for asynchronous workloads.\n- **Data Residency (`inference_geo: \"us\"`)**: **1.1× multiplier** across all token categories (input, output, cache writes, cache reads).\n- **Context Window**: Up to **1M tokens** on flagship/enterprise tiers (exact availability varies by model tier and org plan `⚠️`).\n\n## 2. Prompt Caching Mechanics (`⚠️` volatile)\n\n- Controlled via `cache_control: { \"type\": \"ephemeral\" }` (default 5-minute TTL) or `{ \"type\": \"ephemeral\", \"ttl\": \"1h\" }`.\n- **Minimum cacheable prefix thresholds** (silent no-op if below threshold — returns `0` cache_creation_input_tokens without error):\n  - 512 tokens on newer Claude 5 / 5.5 flagship models (`claude-opus-5-5`);\n  - 1,024 tokens on standard Sonnet tiers (`claude-sonnet-5` / prior Sonnet 4.5/4.6);\n  - 4,096 tokens on older Haiku 4.5 / Opus 4.5/4.6 (`⚠️` verify per-model threshold in docs before deployment).\n- **Break-even math**:\n  - 5m TTL write surcharge = `+0.25×` base input; each read saves `0.90×` (at 0.1× read) or `0.95×` (at 0.05× read) → breaks even after **1 cache read**.\n  - 1h TTL write surcharge = `+1.00×` base input; each read saves `0.90×`–`0.95×` → breaks even after **2 cache reads**.\n- Prefix matching is exact from the start of the request (`tools` → `system` → `messages`): any mutation in an earlier block invalidates all downstream cache breakpoints.\n\n## 3. Tool Use, Structured Outputs \u0026 Extended Thinking\n\n- **Structured JSON Outputs**: `output_config.format` accepts a JSON Schema (wrapped ergonomically via Zod in TS or Pydantic in Python) to enforce schema-compliant final text output without prefill hacks.\n- **Strict Tool Use**: Setting `strict: true` on tool definitions enforces schema-compliant tool names and input payloads at decoding time.\n- **Extended Thinking**: Enabled via `thinking: { type: \"enabled\", budget_tokens: N }` (or adaptive reasoning modes on newer models). Thinking blocks are returned transparently as `thinking` content blocks; `max_tokens` must exceed `budget_tokens` to leave room for the final answer/tool calls. In multi-turn tool loops, prior assistant `thinking` blocks (with their signatures) must be preserved when passing assistant turns back to the API.\n\n## 4. Official SDKs (`⚠️` volatile)\n\n- **TypeScript SDK**: `@anthropic-ai/sdk` — latest stable `v1.10.0` (2026-11).\n- **Python SDK**: `anthropic` — latest stable `v2.11.0`, requires Python 3.10+ (2026-11).\n- **Claude Agent SDK** (formerly Claude Code SDK): `@anthropic-ai/claude-agent-sdk` (TS) and `claude-agent-sdk` (Python) — embeds Claude Code's agent loop, context compaction, MCP integration, hooks, and permission controls (`allowedTools`, `disallowedTools`).\n\n## 5. Model Context Protocol (MCP) (`⚠️` volatile)\n\n- **Transport**: **Streamable HTTP** has superseded legacy HTTP+SSE for remote/enterprise MCP servers, unifying JSON-RPC POST and optional streaming responses on a single HTTP endpoint behind standard API gateways and load balancers. `stdio` remains for local subprocess tools.\n- **Stateless Scaling**: MCP 2026 spec revisions strengthen **Stateless HTTP** (`stateless_http=True`, `json_response=True`) for horizontal scaling behind load balancers without sticky sessions.\n- **Claude API MCP Connector**: Messages API accepts `mcp_servers` (remote Streamable HTTP + OAuth 2.1 / Bearer auth) and `tools: [{ type: \"mcp_toolset\", mcp_server_name: \"...\" }]`, allowing Claude API to invoke remote MCP tools directly without a custom client loop (remote HTTP only; no local stdio).\n\n## 6. Sources\n\n- Anthropic Claude API pricing \u0026 prompt caching docs (`claude.com/pricing`, `docs.anthropic.com` — checked 2026-11-21).\n- Anthropic Structured Outputs, Tool Use, Extended Thinking \u0026 MCP Connector docs (`claude.com`, `anthropic.com` — checked 2026-11-21).\n- npm (`@anthropic-ai/sdk`), PyPI (`anthropic`), and MCP specification (`modelcontextprotocol.io` — checked 2026-11-21).\n"}, {"id": "terms", "file": "terms.md", "group": "內部文件（_meta）", "title": "全書術語對照表（P2.5 Terms Registry）", "md": "# 全書術語對照表（P2.5 Terms Registry）\n\n| 術語 | 首次定義章節 | 簡要定義 |\n|---|---|---|\n| `Agent Loop` | ch01 | 以 LLM 為無狀態轉移函數、由外部狀態機驅動 `stop_reason` 與工具執行的閉環 |\n| `Turn`（回合） | ch01 | Agent Loop 內一次完整的 Messages API 呼叫與其對應工具執行 |\n| `OrderOps` | ch01 | 貫穿全書的企業級營運代理主軸系統（50,000 筆/天、18 工具、未優化月燒 $152,250） |\n| `Strict Tool Use`（`strict: true`） | ch02 | 解碼期以文法約束強制工具名稱與參數符合 JSON Schema |\n| `Structured Outputs`（`output_config.format`） | ch02 | 以 JSON Schema 約束模型最終文字輸出結構 |\n| `Idempotency Key`（冪等鍵） | ch02 | 具寫入／金流副作用的工具防重放與防重複扣款的唯一鍵 |\n| `Streamable HTTP MCP` | ch02 | 取代舊版 HTTP+SSE 的遠端 MCP 單端點傳輸標準，支援 Stateless 水平擴展 |\n| `Context Rot` | ch03 | 上下文拉長後注意力稀釋與中段資訊召回衰退現象 |\n| `Prompt Caching`（`cache_control`） | ch03 / ch08 | 依 `tools → system → messages` 嚴格前綴命中快取（5m / 1h TTL） |\n| `Extended Thinking` | ch03 | 配置 `budget_tokens` 的內部推理區塊，多回合工具呼叫需原樣保留 `thinking` + `signature` |\n| `Context Compaction` | ch03 | 將長對話或大工具回傳裁剪、摘要或卸載至外部 Scratchpad 以控管輸入膨脹 |\n| `Agentic RAG` | ch04 | 由 Agent 自主決定檢索時機、查詢改寫與重試的 Hybrid Search（BM25 + Vector + Rerank） |\n| `Pre-filtering ACL` | ch04 | 多租戶權限過濾下推至檢索查詢層，絕不在 LLM 輸出後才過濾 |\n| `Orchestrator-Workers` / `Router-Specialists` | ch05 | 隔離工具面與上下文的多 Agent 協作拓撲 |\n| `Event-sourced Checkpoint` | ch06 | Append-only 狀態轉移事件日誌，支援 Pod 重啟與 HITL 暫停後的斷點續跑 |\n| `HITL`（Human-in-the-Loop） | ch06 | 高風險操作（如超額退款）暫停執行、等待人工審批後喚醒續跑的機制 |\n| `Trajectory Eval` | ch07 | 針對工具選取、參數正確性與步數效率的過程軌跡評測 |\n| `Pass@k` / `Pass^k` | ch07 | `k` 次嘗試至少成功 1 次 vs 連續 `k` 次全部成功（企業可靠性指標） |\n| `Model Routing` | ch08 | 依工單複雜度動態分流至 Haiku 5.5 / Sonnet 5.5 / Opus 5.5 |\n| `TTFT` / `TPOT` | ch08 | Time To First Token / Time Per Output Token |\n| `Batch API` | ch08 | 非同步批次推理介面，Input/Output 一律 50% 折扣 |\n| `Policy Engine` | ch09 | 位於工具執行層前的確定性授權與金額上限檢查閘門，不依賴 Prompt 自律 |\n| `Indirect Prompt Injection` | ch09 | 藏於工單內文、網頁或工具回傳中的惡意指令注入攻擊 |\n| `OpenTelemetry GenAI Span` | ch10 | 覆蓋 Request → Turn → LLM/Tool 的標準化分散式追蹤與成本歸因結構 |\n| `Shadow Mode` / `Canary Rollout` | ch10 | 線上雙跑比對不寫入外部系統／按比例切流與預算熔斷的發布策略 |\n| `PRR`（Production Readiness Review） | ch12 | 上線前涵蓋可靠性、Eval、安全、成本、觀測與回滾預案的強制審查 |\n"}]}</script>

<script>
(function(){
"use strict";
var NS="eagent";
var DATA=JSON.parse(document.getElementById('bookdata').textContent);
var CHS=DATA.chapters, byId={}, byFile={};
CHS.forEach(function(c){byId[c.id]=c;byFile[c.file]=c;});

function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

var DEF={theme:'paper',font:'sans',fs:18,lh:1.95,ls:0.02,ps:1.0,pw:52};
var prefs=Object.assign({},DEF,lsGet(NS+'.prefs2',{}));

var main=document.getElementById('main'),content=document.getElementById('content');
var cur=null;

function applyPrefs(){
  document.body.dataset.theme=prefs.theme;
  document.body.dataset.font=prefs.font;
  var r=document.documentElement.style;
  r.setProperty('--fs',prefs.fs+'px');
  r.setProperty('--lh',prefs.lh);
  r.setProperty('--ls',prefs.ls+'em');
  r.setProperty('--ps',prefs.ps);
  r.setProperty('--pw',prefs.pw);
  ['fs','lh','ls','ps','pw'].forEach(function(k){
    var ri=document.getElementById('r_'+k),oi=document.getElementById('o_'+k);
    if(ri){ri.value=prefs[k];} if(oi){oi.textContent=prefs[k];}
  });
  document.querySelectorAll('#themeseg .btn').forEach(function(b){b.classList.toggle('on',b.dataset.v===prefs.theme);});
  document.querySelectorAll('#fontseg .btn').forEach(function(b){b.classList.toggle('on',b.dataset.v===prefs.font);});
  lsSet(NS+'.prefs2',prefs);
}

function buildSidebar(){
  var sb=document.getElementById('sidebar');
  var html="\u003cdiv class=\"brand\"\u003e企業級 Agent 工程\u003cbr\u003e\u003cspan style=\"font-weight:400;font-size:12px;color:var(--muted)\"\u003e用 Claude API 打造可上線、可觀測、可控成本的代理系統\u003c/span\u003e\u003c/div\u003e";
  var g='';
  CHS.forEach(function(c){
    if(c.group!==g){g=c.group;html+='<div class="grp">'+g+'</div>';}
    html+='<a class="ch" data-id="'+c.id+'" href="#'+c.id+'">'+c.title.replace(/：.*$/,'')+'</a>';
  });
  html+='<a class="allbtn" href="#_all">整本單頁（供全文 ⌘F 搜尋）</a>';
  sb.innerHTML=html;
  sb.addEventListener('click',function(e){
    var a=e.target.closest('a');if(!a)return;
    e.preventDefault();
    show(a.dataset.id||a.getAttribute('href').slice(1));
    if(window.innerWidth<=880){sb.classList.remove('open');backdrop.classList.remove('show');}
  });
}

function flatIndex(id){for(var i=0;i<CHS.length;i++){if(CHS[i].id===id)return i;}return -1;}

/* Wrap CJK runs inside <pre> so they render at exactly 2 Menlo columns
   (.cjkw applies PingFang at 120.41%). East-Asian-Width W/F BMP ranges,
   matching check_diagrams.py's width model. */
var CJK_RE=/[\u1100-\u115F\u2E80-\u303E\u3041-\u33FF\u3400-\u4DBF\u4E00-\u9FFF\uA000-\uA4CF\uAC00-\uD7A3\uF900-\uFAFF\uFE30-\uFE4F\uFF01-\uFF60\uFFE0-\uFFE6]/;
var CJK_SPLIT=/([\u1100-\u115F\u2E80-\u303E\u3041-\u33FF\u3400-\u4DBF\u4E00-\u9FFF\uA000-\uA4CF\uAC00-\uD7A3\uF900-\uFAFF\uFE30-\uFE4F\uFF01-\uFF60\uFFE0-\uFFE6]+)/;
function wrapCJK(root){
  root.querySelectorAll('pre').forEach(function(pre){
    var w=document.createTreeWalker(pre,NodeFilter.SHOW_TEXT),nodes=[],n;
    while((n=w.nextNode())){if(CJK_RE.test(n.nodeValue))nodes.push(n);}
    nodes.forEach(function(t){
      var frag=document.createDocumentFragment();
      t.nodeValue.split(CJK_SPLIT).forEach(function(part){
        if(!part)return;
        if(CJK_RE.test(part[0])){
          var s=document.createElement('span');
          s.className='cjkw';s.textContent=part;frag.appendChild(s);
        }else{
          frag.appendChild(document.createTextNode(part));
        }
      });
      t.parentNode.replaceChild(frag,t);
    });
  });
}

function postprocess(){
  content.querySelectorAll('a[href]').forEach(function(a){
    var h=a.getAttribute('href');
    if(/^https?:/i.test(h)){a.target='_blank';a.rel='noopener';return;}
    var m=h.match(/([^\/#]+\.md)/);
    if(m&&byFile[m[1]]){
      var id=byFile[m[1]].id;
      a.setAttribute('href','#'+id);
      a.addEventListener('click',function(e){e.preventDefault();show(id);});
    }
  });
}

var suppressHash=false;
function normalizeCJKBold(md){
  var lines=md.split('\n'),inFence=false;
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(/^\s*(`{3,}|~{3,})/.test(line)){inFence=!inFence;continue;}
    if(inFence||line.indexOf('**')===-1)continue;
    lines[i]=line.replace(/\*\*([^*\n]+)\*\*/g,function(full,inner){
      if((inner[0]==='「'&&inner[inner.length-1]==='」')||(inner[0]==='『'&&inner[inner.length-1]==='』')){
        var q0=inner[0],q1=inner[inner.length-1],core=inner.slice(1,-1);
        var mp=core.match(/^(.+?)(（[^）]+）)$/);
        return mp?q0+'**'+mp[1]+'**'+mp[2]+q1:q0+'**'+core+'**'+q1;
      }
      var mp2=inner.match(/^(.+?)(（[^）]+）)$/);
      return mp2?'**'+mp2[1]+'**'+mp2[2]:full;
    });
  }
  return lines.join('\n');
}
function show(id){
  var ch;
  if(id==='_all'){
    ch={id:'_all',title:'整本（單頁）',md:CHS.map(function(c){return c.md;}).join('\n\n---\n\n')};
  }else{
    ch=byId[id]||CHS[0];
  }
  cur=ch.id;
  content.innerHTML=marked.parse(normalizeCJKBold(ch.md));
  wrapCJK(content);
  postprocess();
  document.getElementById('topttl').textContent=ch.title;
  document.title=ch.title+' — '+"企業級 Agent 工程";
  var i=flatIndex(ch.id);
  var prev=i>0?CHS[i-1]:null, next=(i>=0&&i<CHS.length-1)?CHS[i+1]:null;
  var pb=document.getElementById('prevbtn'),nb=document.getElementById('nextbtn');
  pb.style.visibility=prev?'visible':'hidden';
  nb.style.visibility=next?'visible':'hidden';
  if(prev)pb.textContent='← '+prev.title;
  if(next)nb.textContent=next.title+' →';
  pb.onclick=prev?function(){show(prev.id);}:null;
  nb.onclick=next?function(){show(next.id);}:null;
  document.getElementById('prevtop').onclick=prev?function(){show(prev.id);}:null;
  document.getElementById('nexttop').onclick=next?function(){show(next.id);}:null;
  document.querySelectorAll('#sidebar a.ch').forEach(function(a){a.classList.toggle('active',a.dataset.id===cur);});
  if(location.hash.slice(1)!==cur){suppressHash=true;location.hash=cur;}
  lsSet(NS+'.last',cur);
  main.scrollTop=lsGet(NS+'.scroll.'+cur,0);
}

var scrollTimer=null;
main.addEventListener('scroll',function(){
  if(scrollTimer)clearTimeout(scrollTimer);
  scrollTimer=setTimeout(function(){if(cur)lsSet(NS+'.scroll.'+cur,main.scrollTop);},250);
});

window.addEventListener('hashchange',function(){
  if(suppressHash){suppressHash=false;return;}
  var h=location.hash.slice(1);
  if(h&&h!==cur)show(h);
});

document.addEventListener('keydown',function(e){
  var t=e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA')return;
  if(e.key==='ArrowLeft'){var b=document.getElementById('prevbtn');if(b.onclick)b.onclick();}
  if(e.key==='ArrowRight'){var b2=document.getElementById('nextbtn');if(b2.onclick)b2.onclick();}
});

/* settings panel */
var panel=document.getElementById('panel'),backdrop=document.getElementById('backdrop');
document.getElementById('gear').onclick=function(){panel.classList.toggle('open');backdrop.classList.toggle('show',panel.classList.contains('open'));};
backdrop.onclick=function(){panel.classList.remove('open');document.getElementById('sidebar').classList.remove('open');backdrop.classList.remove('show');};
document.getElementById('hamburger').onclick=function(){document.getElementById('sidebar').classList.add('open');backdrop.classList.add('show');};
document.getElementById('themeseg').addEventListener('click',function(e){var b=e.target.closest('.btn');if(b){prefs.theme=b.dataset.v;applyPrefs();}});
document.getElementById('fontseg').addEventListener('click',function(e){var b=e.target.closest('.btn');if(b){prefs.font=b.dataset.v;applyPrefs();}});
[['fs',parseFloat],['lh',parseFloat],['ls',parseFloat],['ps',parseFloat],['pw',parseFloat]].forEach(function(p){
  document.getElementById('r_'+p[0]).addEventListener('input',function(e){prefs[p[0]]=p[1](e.target.value);applyPrefs();});
});
document.getElementById('resetbtn').onclick=function(){prefs=Object.assign({},DEF);applyPrefs();};

/* boot */
applyPrefs();
buildSidebar();
var start=location.hash.slice(1)||lsGet(NS+'.last',CHS[0].id);
show(byId[start]||start==='_all'?start:CHS[0].id);
})();
</script>
</body>
</html>
