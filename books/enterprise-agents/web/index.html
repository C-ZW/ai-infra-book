<script id="bookdata" type="application/json">{"chapters": [{"id": "README", "file": "README.md", "group": "開始", "title": "企業級 Agent 工程", "md": "# 企業級 Agent 工程\n\n**用 Claude API 打造可上線、可觀測、可控成本的代理系統**\n\n本書面向具多年後端系統開發經驗的工程師，跳過入門概念與黑箱框架搬運，直接從底層機制、狀態機契約、分散式可靠性、量化評測、單位經濟學與安全治理，一步步把一個每天處理 **50,000 筆**工單、未優化月燒 **$152,250** 的營運代理系統（`OrderOps`），改造成月成本 **≤ $18,000**（降幅 ≥ 88%）、具備完整觀測與安全防禦的生產級系統。\n\n## 閱讀方式與程式碼配置\n\n- **章節內文**：只呈現承重的核心程式碼片段、真實 API Payload、具體配置基線與端到端數字實算。\n- **完整可執行程式碼**：雙語言完整實作統一放在專案目錄 [`books/enterprise-agents/examples/`](../examples/README.md) 下：\n  - TypeScript（`@anthropic-ai/sdk` + `zod`）：`examples/ts/ch01/` 至 `examples/ts/ch12/`\n  - Python（`anthropic` + `pydantic`）：`examples/py/ch01/` 至 `examples/py/ch12/`\n\n## 全書路線\n\n- **Part I：核心引擎與契約（ch01–ch03）** — Agent Loop 狀態機、Strict Tool Use 與 Streamable HTTP MCP、Context Engineering 與 Extended Thinking。\n- **Part II：狀態、記憶與多代理協作（ch04–ch06）** — 持久化 Checkpoint 與多租戶 Agentic RAG、多 Agent 隔離與協作、429/529 重試與 HITL 斷點續跑。\n- **Part III：優化、調校與單位經濟學（ch07–ch09）** — 評測驅動開發（EDD）與 `Pass^k`、五大降本槓桿與延遲優化帳本、安全護欄與確定性 Policy Engine。\n- **Part IV：可觀測性與企業實戰藍圖（ch10–ch12）** — OpenTelemetry GenAI 追蹤與成本歸因、三大企業實戰場景深度拆解、Production Readiness Review 與漸進式上線路線。\n"}, {"id": "ch01-agent-architecture", "file": "ch01-agent-architecture.md", "group": "Part I — 核心引擎與契約", "title": "第 1 章：從 Workflow 到 Agent：執行迴圈、狀態機與可控邊界", "md": "# 第 1 章：從 Workflow 到 Agent：執行迴圈、狀態機與可控邊界\n\n企業導入 LLM 時，最常見的架構誤判是「把確定性流程硬寫成 Agent」，或反過來「把開放式決策硬塞進寫死的 DAG」。本章從後端工程師熟悉的系統模型切入，建立 `Agent Loop` 的狀態機骨架，並以主軸系統 `OrderOps` 跑通第一版具備強制終止契約的執行迴圈。\n\n## 從你已知的出發\n\n做過後端服務的工程師，對**有限狀態機與事件迴圈**（FSM + Event Loop）都不陌生：一個請求進來，系統根據當前狀態與外部事件決定下一個狀態，直到進入終止態（`COMPLETED`、`FAILED` 或 `TIMEOUT`）。\n\n`Agent Loop`（模型推理 → 工具執行 → 觀測回填的狀態轉移迴圈）本質上就是一個**由外部程式驅動的 FSM + Event Loop**。兩者的核心對應如下：\n\n- **LLM 本身無狀態**：每次呼叫 Claude Messages API，模型都不記得上一輪發生過什麼；所有對話歷史（`messages` 陣列）都由你的後端狀態機負責保存與重送。\n- **狀態轉移函數**（Transition Function）：傳統 FSM 的轉移規則寫死在 `switch/case` 裡；在 `Agent Loop` 中，LLM 根據當前 `messages` 產出 `stop_reason` 與內容區塊，決定下一步要呼叫哪個工具或直接結束。\n- **Event Loop 驅動**：外部 `while` 迴圈扮演事件迴圈，每次呼叫 API 取得一個 `Turn`（回合）的輸出，若為工具呼叫就執行對應後端函式並將結果寫回 `messages`，再進入下一輪。\n\n**橋接成立邊界與失效邊界：**\n\n- **成立邊界**：迴圈的控制權、終止條件（`max_turns`、預算上限、wall-clock timeout）與副作用執行權，全部留在你的後端程式碼中，與傳統 FSM 完全一致。\n- **失效邊界**：傳統 FSM 的狀態轉移是**確定性**（Deterministic）且可窮舉的；LLM 的轉移帶有**機率性**，同樣的輸入在不同時間可能選出不同工具順序，甚至在邊界條件下陷入重複呼叫同一個工具的無窮迴圈。因此不能只靠模型「自覺停止」，必須由外部狀態機強制執行護欄。\n\n## 核心機制\n\n### Workflow 與 Agent 的決策光譜\n\n不是每個企業需求都需要開放式 `Agent Loop`。延遲、成本與可預測性都要求我們先判斷該用確定性 Workflow 還是 Agent：\n\n1. **Augmented LLM**：單次呼叫 LLM，搭配檢索或單一工具查詢，無迴圈（若需由模型讀回 client-tool 結果再作答，通常會多一次 Messages 請求）。適合簡單分類或摘要。\n2. **Prompt Chaining**（串鏈）：固定步驟 `A → B → C`，每步之間由程式碼做格式檢查或閘門（Gate）。適合合約審閱、固定報表產出。\n3. **Routing**（路由分流）：先用輕量模型或規則分類，再導向不同專用處理鏈。例如 `OrderOps` 將簡單查詢導向低成本模型，複雜客訴導向多步處置。\n4. **Parallelization**（平行化）：同時派發多個獨立子任務（如同時查訂單與查庫存）或多次投票，再由程式碼彙整。\n5. **Orchestrator-Workers**（編排者與工作者）：由主模型動態拆解子任務並派發給專責 Worker，適合任務結構無法事先寫死的場景。\n6. **Evaluator-Optimizer**（評估與優化迴圈）：一個模型產出、另一個模型或規則檢查器評分，不通過就退回重寫，直到達標或達重試上限。\n\n**選型準則**：判斷的核心在於**下一步的決策權屬於程式碼還是模型**。確定性 Workflow 也能依觀測結果走條件分支；只有當「下一步該查什麼資料、呼叫幾個工具」必須交由模型依前一步觀測動態決定時，才啟用 `Agent Loop`。\n\n### `stop_reason` 驅動的狀態轉移與 Wire-Level 契約\n\n在 Claude Messages API 中，每次 `Turn` 結束都會回傳 `stop_reason` 欄位。外部狀態機不應解析模型回傳的自然語言來猜測是否結束，而應直接對 `stop_reason` 做窮舉分派（下圖為本章本地工具迴圈的核心子集；完整 API 的其他 `stop_reason` 值如 `stop_sequence`、`pause_turn` 與 `model_context_window_exceeded` 等，以官方 Handling Stop Reasons 文件列舉為準）：\n\n```text\n[START]\n   │\n   ▼\nmessages.create() ──▶ 檢查預算與 wall-clock timeout\n   │\n   ├── stop_reason == \"end_turn\"    ──▶ [COMPLETED]（提取 text 回覆）\n   ├── stop_reason == \"tool_use\"    ──▶ 執行本地工具 ──▶ 回填 tool_result ──▶ 下一輪\n   ├── stop_reason == \"max_tokens\"  ──▶ [ERROR / TRUNCATED]（單輪輸出截斷）\n   └── stop_reason == \"refusal\"     ──▶ [REFUSED]（安全策略拒答，立即終止）\n```\n\n在真實的 Wire-Level HTTP 回應（以下為關鍵欄位節錄）中，當 `stop_reason` 為 `\"tool_use\"` 時，`content` 陣列會包含一個或多個 `tool_use` 區塊，每個區塊帶有唯一的 `id`（例如 `toolu_01A09q90qw90lq917835lq9`）、工具名稱 `name` 與結構化 `input` 物件：\n\n```json\n{\n  \"id\": \"msg_01XFDUDYJgAACzvnptvVoYEL\",\n  \"type\": \"message\",\n  \"role\": \"assistant\",\n  \"stop_reason\": \"tool_use\",\n  \"content\": [\n    {\n      \"type\": \"tool_use\",\n      \"id\": \"toolu_01A09q90qw90lq917835lq9\",\n      \"name\": \"get_order\",\n      \"input\": { \"order_id\": \"ORD-88412\", \"tenant_id\": \"tn_apac_01\" }\n    }\n  ],\n  \"usage\": {\n    \"input_tokens\": 6000,\n    \"output_tokens\": 350,\n    \"cache_creation_input_tokens\": 0,\n    \"cache_read_input_tokens\": 0\n  }\n}\n```\n\n你的後端必須原樣保留上一輪的 `assistant` 內容區塊（含 thinking signature），並在緊接的 `user` 訊息中回傳對應的 `tool_result` 區塊，且 `tool_use_id` 必須與 `id` 精確配對；若同則 `user` 訊息另附文字提示，`tool_result` 必須排在文字區塊之前。若模型在同一輪同時發出多個 `tool_use`（例如同時呼叫 `get_order` 與 `check_inventory`），所有對應的 `tool_result` 必須放在同一則 `user` 訊息內依序回填，缺一不可（具體錯誤碼與驗證細節依官方 Tool Use 文件為準）。若工具執行失敗（例如訂單不存在或參數格式錯誤），不應直接拋出未捕捉例外中斷整個迴圈，而應正規化為穩定錯誤碼並回傳 `is_error: true`（例如 `{\"error\": \"order_not_found\", \"retryable\": false}`），讓模型在下一輪有機會修正參數或改走其他路徑（工具契約與 MCP 細節見第 2 章）。\n\n此外，單輪內對互相獨立且可充分並行的唯讀工具適合平行執行（`Promise.all` 或 `asyncio.gather`），理想延遲近似最慢呼叫的耗時（實際仍須加上排程與彙整開銷並考慮資源限制）；但若同一輪同時包含唯讀與寫入型工具，必須先執行唯讀檢查並在寫入端原子驗證前置條件；限制單輪寫入數量可縮小故障範圍，但仍須配合寫入端原子驗證、冪等性及逾時後對帳或補償機制，跨系統一致性不能由寫入數量限制單獨保證。\n\n### 生產級配置基線與狀態儲存邊界\n\n裸跑一個 `while` 迴圈很容易，但要上線承受 `OrderOps` 尖峰 `12` req/s 的負載，必須先釘死以下配置基線：\n\n- **迴圈與預算護欄**：`maxTurns = 8`、`maxTotalInputTokens = 50,000`（累計輸入上限，高於 5 回合基準 `42,000` tokens）、`maxCostUsd = 0.25`、`wallClockTimeoutMs = 18,000`（對齊多步處置 p95 SLO）、`turnTimeoutMs = 5,000`。需注意回合結束後的累計檢查屬於軟性斷路器，可阻止後續回合與成本擴大；若需嚴格硬預算，發送前必須估算完整請求輸入並預留 `max_tokens` 對應的輸出費用。\n- **HTTP 連線池**：若尖峰 `12` req/s 下每筆工單都走 `5` 回合，穩態原始負載約 `60` calls/s；若平均停留時間約 `1.5` 秒，依 Little’s Law 推算平均在途（In-flight）連線數約 `90` 條。實務上應將 HTTP Client 連線池上限（如 Node.js `Agent` 的 `maxSockets` 或 Python `httpx.Limits` 的 `max_connections`）設為 `128` 作為壓測起點，並將分流比例、重試、每程序連線池與上游 RPM／TPM 一併納入驗證。此外，5 輪若各耗滿 `5,000 ms` 即達 `25 s`，因此整體 `wallClockTimeoutMs` 與端到端 p95 需分別驗證。\n- **Redis 租戶範圍鎖與執行狀態鍵**：以 `orderops:run:{tenant_id}:{ticket_id}` 作為租戶隔離鍵，並將**可續租的短暫 lease**（含 owner token 與原子釋放，防止舊持有者誤刪新持有者的鎖；寫入端仍須驗證版本或 fencing token，才能防止過期 worker 覆寫外部狀態）與執行狀態分離，防止同一工單被重試佇列重複啟動兩個 `Agent Loop`。\n- **PostgreSQL 執行軌跡表**：建立 `agent_runs`（主鍵 `run_id`，索引 `(tenant_id, ticket_id)`）與 `agent_turns`（複合主鍵 `(run_id, turn_index)`），記錄每輪的 `stop_reason`、`input_tokens`、`output_tokens`、`cost_usd` 與 `request_id`，供事後稽核與成本歸因（斷點續跑細節見第 6 章）。\n\n### `OrderOps` 基準情境與無快取膨脹帳本\n\n貫穿本書的主軸系統 `OrderOps` 是一個企業級訂單營運代理系統，承接以下基準負載：\n\n- **日工單量**：`50,000` 筆／天（`1,500,000` 筆／月，以 30 天計）\n- **尖峰流量**：`12` req/s（平均 `0.58` req/s，尖峰 `20×`；精確比值約 `20.7×`）\n- **延遲 SLO**：分流 p95 ≤ `2.5` 秒；多步工具處置 p95 ≤ `18` 秒\n- **基準回合與輸出**：每筆工單平均 `5` 回合，每回合新增輸入 `1,200` tokens，每回合**計費輸出** `350` tokens（含 thinking tokens）\n- **模型計價基準**：Claude Sonnet 5.5 牌價為 `$2.00 / $10.00` USD / MTok（Input / Output）；Claude Haiku 5.5（≤100K）為 `$0.10 / $0.50` USD / MTok\n\n由於 LLM 無狀態，每一輪都必須重送固定前綴（System Prompt `2,400` tokens + `18` 個工具 Schema `3,600` tokens，共 `6,000` tokens）與先前累積的對話歷史。以下為 `OrderOps` 單筆工單在**全用 Sonnet 5.5、無快取**下的簡化帳本算式（若首輪工單另占 `U` tokens 且每輪重送，5 回合累計輸入為 `42,000 + 5U` tokens）：\n\n```text\n假設：固定前綴（System Prompt 2,400 + 18 工具 Schema 3,600）= 6,000 tokens\n      每回合新增輸入（tool_result + 上輪輸出）= 1,200 tokens\n      每回合平均計費輸出 = 350 tokens，共 5 回合\n\nTurn 1 Input:  6,000 tokens\nTurn 2 Input:  6,000 + 1,200 =  7,200 tokens\nTurn 3 Input:  7,200 + 1,200 =  8,400 tokens\nTurn 4 Input:  8,400 + 1,200 =  9,600 tokens\nTurn 5 Input:  9,600 + 1,200 = 10,800 tokens\n--------------------------------------------------\n5 回合累計輸入 = 6,000 + 7,200 + 8,400 + 9,600 + 10,800 = 42,000 tokens\n5 回合累計輸出 = 350 × 5 = 1,750 tokens\n\n單筆輸入成本 = (42,000 ÷ 1,000,000) × $2.00  = $0.0840\n單筆輸出成本 = ( 1,750 ÷ 1,000,000) × $10.00 = $0.0175\n--------------------------------------------------\n未優化單筆成本 = $0.0840 + $0.0175 = $0.1015\n每日成本（50,000 筆）  = $0.1015 × 50,000    = $5,075\n每月成本（1,500,000 筆）= $0.1015 × 1,500,000 = $152,250\n```\n\n這筆 `$152,250`／月的帳單清楚說明了為什麼第 1 章就要把迴圈與預算護欄建好：第 8 章將示範如何透過模型分層與 Prompt Caching 把月成本壓到 `≤ $18,000`。\n\n## 故障模式與防禦\n\n未設防的 `Agent Loop` 上線後，最常見的四種故障模式、診斷線索與防禦機制如下（下列數值為初始政策門檻，上線後應依分母與最小樣本量校準）：\n\n1. **無窮工具迴圈與參數振盪**（Infinite Tool Loop）\n   - **現象**：模型反覆用相同參數呼叫同一個工具（例如查不到訂單卻一直重試 `get_order`），直到帳單暴增或撐爆上下文。\n   - **診斷與告警**：結構化 log 記錄 `ticket_id`、`turn`、`tool_name` 與 `tool_input_hash`。當單日 `budget_exceeded` 終止比例超過 `1%` 或單筆 `turns \u003e= 7` 連續出現時觸發告警。\n   - **防禦**：在迴圈外層強制設定 `maxTurns = 8`、`maxTotalInputTokens = 50,000` 與 `maxCostUsd = 0.25`，任一條件觸發立即終止並回傳 `budget_exceeded`。進階防護可加上連續相同 `(tool_name, tool_input_hash)` 偵測，連續 2 次即強制中斷或注入提示。\n2. **單輪與總體超時級聯**（Timeout Cascade）\n   - **現象**：上游 API 回應緩慢或本地工具卡住，導致工單處理時間突破 `OrderOps` 多步處置 p95 ≤ `18` 秒的 SLO，進而拖垮工作佇列的 Worker 執行緒。\n   - **診斷與告警**：log 記錄 `elapsed_ms`、`turn_latency_ms` 與 `tool_latency_ms`。當多步處置 p95 延遲連續 5 分鐘超過 `16,000 ms` 時觸發預警。\n   - **防禦**：設定雙層 Timeout——總 wall-clock 上限 `18,000 ms`（對齊 SLO），單次 LLM 呼叫 `5,000 ms`（隨剩餘時間動態縮減：`Math.min(5000, 18000 - elapsedMs)`），並對每個外部工具呼叫加上獨立的 `AbortSignal` 超時。\n3. **HTTP `429` / `529` 與 Streaming 半途斷線**\n   - **現象**：尖峰 `12` req/s 時觸發 Rate Limit（HTTP `429`，回應標頭附帶 `retry-after`）或平台過載（如 HTTP `529 overloaded_error`，具體錯誤碼以官方 Errors 文件為準）；若啟用 Streaming，網路抖動可能導致 SSE 串流半途斷線，留下殘缺的工具參數 JSON。\n   - **診斷與告警**：log 記錄 `http_status`、`request_id`（來自回應標頭 `request-id`）與 `retry_after_ms`。當 `429` 或 `529` 比例在 2 分鐘內超過 `2%` 時觸發告警。\n   - **防禦**：SDK 內建指數退避與 Jitter 重試，但重試總時間仍受外層 `wallClockTimeoutMs` 約束；對 Streaming 斷線不應把殘缺 JSON 送進工具執行，而應捨棄該未完成 Turn 並視剩餘預算決定是否重試。\n4. **`max_tokens` 截斷與寫入型工具冪等性碰撞**\n   - **現象**：模型輸出過長觸發 `stop_reason == \"max_tokens\"`（若啟用 extended 或 adaptive thinking，`max_tokens` 須同時涵蓋思考與可見輸出，實際預設行為依模型版本與官方文件為準），導致結構化輸出或工具參數不完整；此外，若寫入型工具（如 `issue_refund`）沒有冪等鍵，模型在超時重試時可能重複退款。\n   - **診斷與告警**：log 記錄 `stop_reason` 與 `idempotency_key`。任何 `stop_reason == \"max_tokens\"` 事件都應計入錯誤指標並抽樣檢查；若單日**異參數衝突**（同鍵不同內容，需與正常冪等重放分開計數）衝突率超過 `0.5%`，代表上層重試策略或狀態鎖失效。\n   - **防禦**：將 `max_tokens` 設為明確上限（如 `1024`），在狀態機中把 `max_tokens` 視為異常分支直接終止，不當成正常結果回傳。所有寫入型工具的 `tenant_id`、金額（以最小貨幣單位驗證為有限正值）與租戶範圍冪等鍵（如 `refund:{tenant_id}:{ticket_id}:{order_id}`）**必須由後端從已驗證的工單上下文綁定與產生，絕不信任模型傳入的值**；資料庫對該鍵建立唯一約束並記錄請求指紋，針對「金流已接受但應用逾時」的案例保留待對帳狀態與查詢恢復流程。\n\n## 動手做\n\n完整可執行的 TypeScript 與 Python 程式碼位於：\n\n- TypeScript：[index.ts](../examples/ts/ch01/index.ts)（共用型別與 Mock 位於 `examples/ts/shared/`）\n- Python：[main.py](../examples/py/ch01/main.py)（共用型別與 Mock 位於 `examples/py/shared/`）\n\n以下節錄 TypeScript 版本的狀態機核心迴圈與預算護欄（完整定義請見上述檔案）：\n\n```ts\nwhile (turns \u003c budget.maxTurns) {\n  const elapsedMs = Date.now() - startedAt;\n  if (elapsedMs \u003e= budget.wallClockTimeoutMs) {\n    return { status: \"timeout\", stopReason: \"wall_clock_timeout\", /* ... */ };\n  }\n\n  turns += 1;\n  const remainingMs = Math.min(budget.turnTimeoutMs, budget.wallClockTimeoutMs - elapsedMs);\n  const controller = new AbortController();\n  const timer = setTimeout(() =\u003e controller.abort(), remainingMs);\n\n  let response: Anthropic.Message;\n  try {\n    response = await client.messages.create(\n      { model, max_tokens: 1024, system: SYSTEM_PROMPT, tools: TOOLS, messages },\n      { signal: controller.signal },\n    );\n  } catch (err) {\n    if (controller.signal.aborted || err instanceof Anthropic.APIConnectionTimeoutError) {\n      const hitWallClock = Date.now() \u003e= deadline;\n      return {\n        status: \"timeout\",\n        stopReason: hitWallClock ? \"wall_clock_timeout\" : \"llm_turn_timeout\",\n        /* ... */\n      };\n    }\n    return { status: \"error\", stopReason: \"api_error\", /* ... */ };\n  } finally {\n    clearTimeout(timer);\n  }\n\n  totalInputTokens += response.usage.input_tokens;\n  totalOutputTokens += response.usage.output_tokens;\n  totalCostUsd += calculateCostUsd(model, response.usage);\n\n  if (totalInputTokens \u003e budget.maxTotalInputTokens || totalCostUsd \u003e budget.maxCostUsd) {\n    return { status: \"budget_exceeded\", stopReason: \"budget_exceeded\", /* ... */ };\n  }\n\n  messages.push({ role: \"assistant\", content: response.content });\n\n  if (response.stop_reason === \"end_turn\") {\n    return { status: \"completed\", stopReason: \"end_turn\", /* ... */ };\n  }\n  if (response.stop_reason === \"tool_use\") {\n    if (turns \u003e= budget.maxTurns) {\n      return { status: \"budget_exceeded\", stopReason: \"max_turns\", /* ... */ };\n    }\n    if (Date.now() - startedAt \u003e= budget.wallClockTimeoutMs) {\n      return { status: \"timeout\", stopReason: \"wall_clock_timeout\", /* ... */ };\n    }\n    const toolResults = toolBlocks.map((b) =\u003e executeTool(backend, ticket, b));\n    messages.push({ role: \"user\", content: toolResults });\n    continue;\n  }\n  if (response.stop_reason === \"refusal\") {\n    return { status: \"refused\", stopReason: \"refusal\", /* ... */ };\n  }\n  return { status: \"error\", stopReason: response.stop_reason ?? \"unknown\", /* ... */ };\n}\n```\n\n設定 `ANTHROPIC_API_KEY` 後，可在範例目錄執行以下指令驗證單工單處理流程（持久化斷點續跑將於第 6 章實作）：\n\n```bash\n# TypeScript\ncd books/enterprise-agents/examples/ts \u0026\u0026 npx tsx ch01/index.ts\n\n# Python\ncd books/enterprise-agents/examples/py \u0026\u0026 python3 ch01/main.py\n```\n\n正常執行結束後，終端機會輸出包含 `status: \"completed\"`、`turns`、`totalInputTokens`、`totalOutputTokens` 與 `totalCostUsd` 的 JSON 摘要（Python 版欄位為 `snake_case`）。預設 `sampleTicket` 會觸發查單與庫存檢查；`OrderOpsMockBackend` 亦預載了退款冪等表，可透過修改測試工單或以固定假回應驗證三個邊界情境：\n1. 將 `maxTurns` 改為 `1`，確認迴圈在第一輪 `tool_use` 派發前即攔截並回傳 `budget_exceeded`（`stopReason: \"max_turns\"`），且不會在最後一輪執行寫入工具。\n2. 傳入不存在的 `order_id`，觀察 `executeTool` 回傳 `is_error: true` 後，模型如何在下一輪向使用者回報查無此訂單，而不是讓程式拋出未捕捉例外崩潰。\n3. 以受控的延遲或假回應搭配極短的 `wallClockTimeoutMs`（例如 `1` ms），驗證逾時分支能觸發 `AbortController`（Python 版為 `httpx.Timeout` / `timeout` 參數）並回傳 `status: \"timeout\"` 與 `stopReason: \"wall_clock_timeout\"`（實務上計時器排程與取消並非精確即時，且程式需區分單輪逾時與整體 wall-clock 逾時）。\n\n## 自我檢核\n\n1. **【入門｜10 分鐘】** 為什麼 `OrderOps` 的第 5 回合單次輸入是 `10,800` tokens，而不是 `1,200` tokens？若將一個 3 步驟的固定報表產出任務改寫成開放式 `Agent Loop`，會帶來什麼不必要的風險？\n2. **【進階｜15 分鐘】** 在 `runOrderOpsAgent` 中，如果把 `wallClockTimeoutMs` 檢查放在 `while` 迴圈結尾而不是開頭，會發生什麼問題？若工具執行本身卡住超過 `18,000 ms`，目前的範例還缺哪一層防護？\n3. **【挑戰｜20 分鐘】** 假設 `OrderOps` 有 `60%` 的簡單工單只需 `2` 回合即可完成，且改用 Claude Haiku 5.5（`$0.10 / $0.50` USD / MTok，前綴仍為 `6,000` tokens，每回合新增 `1,200` tokens、輸出 `350` tokens）。請計算這 `60%` 工單的單筆成本與每日總成本（每天 `50,000 × 60% = 30,000` 筆）。\n\n### 參考解答\n\n1. **解答**：因為 LLM API 無狀態，每一輪都必須重送完整前綴（`6,000` tokens）與先前所有回合的對話歷史，因此輸入隨回合線性膨脹：`6,000 → 7,200 → 8,400 → 9,600 → 10,800`。固定 3 步驟任務若改寫成 `Agent Loop`，會引入多餘的模型推理延遲、非確定性步驟順序、額外 token 費用與重複呼叫風險，應改用 Prompt Chaining 並在每步之間加上確定性格式閘門（見「Workflow 與 Agent 的決策光譜」）。\n2. **解答**：結尾檢查雖可在正常走到該檢查點後攔截下一輪，但若迴圈中有 `continue`、例外分支或工具派發前未再次檢查，仍可能多發起無效呼叫，且無法即時中止已卡住的呼叫；因此首次呼叫前、迴圈開頭與每次派發工具前都應檢查剩餘 deadline，並為 API 與工具呼叫設置可執行的超時機制。此外，目前範例僅對 `client.messages.create` 套用 `AbortController`，若本地 `executeTool`（例如呼叫外部 HTTP 或 DB）卡住，仍可能突破 `18,000 ms` SLO；生產環境必須為每個工具呼叫也加上獨立的 `AbortSignal` 超時。同時要留意，`Promise.race` 僅讓等待方提早返回，並不會自動取消或回滾已經送出的外部寫入請求，因此寫入型工具（如 `issue_refund`）必須搭配冪等鍵與超時後對帳機制，才能避免「客戶端判定超時、但金流端實際已退款」的狀態分裂問題。\n3. **解答**：\n   - 2 回合累計輸入 = `6,000 + 7,200 = 13,200` tokens；累計輸出 = `350 × 2 = 700` tokens。\n   - 單筆成本（Haiku 5.5）= `(13,200 ÷ 1,000,000) × $0.10 + (700 ÷ 1,000,000) × $0.50 = $0.00132 + $0.00035 = $0.00167`。\n   - 每日總成本（`30,000` 筆）= `$0.00167 × 30,000 = $50.10`（`$1,503/月`，相較於未優化 Sonnet 5.5 單筆 `$0.1015`，該分群單筆降幅達 `98.35%`）。若剩餘 `40%` 複雜工單仍按 5 輪 Sonnet 基準，月總成本為 `$62,403`；要達成整體 `≤ $18,000/月`（平均 `$0.012/筆`，總降幅 `88.18%`），複雜工單平均成本須壓至 `≤ $0.027495/筆`（其對全部工單的加權成本貢獻須 `≤ $0.010998/總工單筆`），這部分待第 8 章透過 Prompt Caching 與 Batch API 實證驗證（Batch API 的處理時限依官方文件為準，且相依的 client-tool turns 須等前一輪結果）。\n\n## 延伸閱讀\n\n- Anthropic 官方工程指南：[Building Effective Agents](https://www.anthropic.com/engineering/building-effective-agents)（Workflow vs Agent 決策光譜與六種基礎模式）。\n- Claude Messages API 規格：[Handling Stop Reasons](https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons)（Tool Use 與 `stop_reason` 狀態機設計）。\n- 本書後續章節：第 2 章（Tool Use 契約與 MCP）、第 6 章（持久化斷點續跑）、第 8 章（成本與延遲優化帳本）。\n"}, {"id": "ch02-tool-use-and-mcp", "file": "ch02-tool-use-and-mcp.md", "group": "Part I — 核心引擎與契約", "title": "第 2 章：Tool Use 契約、Strict Schema 與 MCP 企業整合", "md": "# 第 2 章：Tool Use 契約、Strict Schema 與 MCP 企業整合\n\n## 從你已知的出發\n\n寫微服務時，你用 OpenAPI 定義端點契約，在閘道器擋掉缺欄位或型別錯誤的請求，並在金流寫入端點加上 `Idempotency-Key` 標頭，防止網路超時重試造成重複扣款。\n\n把這套工程直覺帶進 Agent 系統，**契約與冪等性依然成立，但「呼叫端」換成了機率性的 LLM**：\n\n- **成立邊界**：`Tool Use` 的 `input_schema` 就像 OpenAPI Spec，定義了參數型別、必填欄位與枚舉值；寫入型工具（例如 `issue_refund`）同樣需要確定性的冪等鍵（Idempotency Key）與 `dry_run` 預檢，才能在 Agent 重試或迴圈重播時不重複動帳。\n- **失效邊界**：微服務的呼叫端是寫死的程式碼，收到 HTTP `400 Bad Request` 只能依錯誤碼決定重試、查詢狀態或告警；Agent 的呼叫端是模型，它會讀懂工具回傳的錯誤訊息並依錯誤類別處置（可修正的參數錯誤回填給模型重試、結果未知的寫入先查持久操作狀態、不可恢復的權限或政策違規直接轉人工）。因此，可修正的工具失敗不該直接拋出例外中斷迴圈，而必須將結構化的錯誤原因作為 `tool_result` 回填給模型。\n\n在 `OrderOps` 主軸系統中，我們共有 **18** 個工具（**12** 個唯讀 Read-only 工具 + **6** 個寫入／金流 Mutating 工具），這些工具的 Schema 合計佔用 **3,600** tokens（加上 System Prompt **2,400** tokens，構成 **6,000** tokens 的基準前綴）。本章教你如何設計抗幻覺的工具契約、用 `strict: true` 與 `output_config.format` 鎖死型別，並將企業內部工具封裝為可水平擴展的 Stateless Streamable HTTP MCP Server，在支付商冪等契約覆蓋所有重試與對帳情境、且系統正確實作操作狀態與餘額保留時，可防止所涵蓋情境的重複動帳（實際仍須依支付商契約與故障測試驗證）。\n\n---\n\n## 核心機制\n\n### 1. 工具面切分與抗歧義 Schema 設計\n\n企業級 Agent 的第一個設計決策，是將「唯讀查詢」與「狀態變更／金流寫入」明確切分。`OrderOps` 的 **18** 個工具分為兩類：\n\n```text\nOrderOps Tools (18)\n├── Read-only (12): get_ticket, get_order, list_customer_orders,\n│                   get_shipment_tracking, get_inventory_level,\n│                   get_warehouse_sla, get_refund_policy, get_invoice,\n│                   list_payment_transactions, get_carrier_status,\n│                   search_kb_articles, get_audit_log\n└── Mutating  (6) : issue_refund, create_replacement_order,\n                    update_shipping_address, cancel_order,\n                    apply_store_credit, escalate_to_hitl\n```\n\n設計工具的 `input_schema` 與授權邊界時，必須遵守四個原則：\n\n1. **枚舉約束取代自由字串**：例如退款原因 `reason_code` 必須限定為 `[\"shipping_delay\", \"damaged_item\", \"inventory_shortage\", \"invoice_error\"]`，不能只寫 `type: \"string\"`。\n2. **禁止多餘欄位**：所有物件一律加上 `additionalProperties: false`，並在 `required` 列出所有必要欄位，防止模型自行發明 `note` 或 `override` 等未定義參數。\n3. **兩階段寫入契約與後端強制預檢**：金流與狀態變更工具內建 `dry_run: boolean`，模型應先以 `dry_run: true` 驗證政策上限與帳戶餘額，確認 `would_approve: true` 後再以 `dry_run: false` 提交。但**模型可直接送出 `dry_run: false` 或在預檢後篡改金額與訂單**，因此提交時後端必須驗證綁定 `(tenant_id, actor, operation, order_id, amount_usd)`（含原始付款識別碼及其他授權與政策判斷必要參數）的短效預檢紀錄，並在提交當下重查政策與可退餘額，同時禁止模型自行調降金額以繞過人工審批門檻。\n4. **不可信資料隔離與身分授權**：工單內容、知識庫、MCP 工具描述與回傳結果皆視為不可信資料。`tenant_id` 必須從已驗證的身分上下文取得（而非信任模型填入的字串），依工具與資源逐次授權，並由後端產生操作鍵；人工審批（HITL）必須由可信工作流執行，最終 `refund_id` 與狀態一律以帳本為準。\n\n### 2. Wire-Level Payload、`strict: true` 與 `output_config.format`\n\n傳統的 JSON Schema 只是「提示」模型遵守格式，模型在長對話或高負載時仍可能漏掉必填欄位或輸出非法型別。Claude API 提供兩個層級的結構化保證：\n\n- **Tool Input 強制契約（`strict: true`）**：在工具定義中設定 `strict: true`（搭配 `additionalProperties: false` 與完整的 `required` 陣列），API 會在解碼階段以受限採樣（Constrained Decoding）強制成功完成的 `tool_use.input` 符合支援的 JSON Schema 子集。實際支援的 JSON Schema 子集與限制須依相應版本的官方文件核對，且官方文件未承諾首次編譯必低於特定毫秒數；此外，金額上下限（如 `amount_usd \u003e 0` 與小數精度）仍須在應用層驗證。\n- **最終輸出強制契約（`output_config.format`）**：當 Agent 完成所有工具呼叫、準備輸出結構化決策給下游微服務時，設定 `output_config: { format: ... }`（可透過 TypeScript 的 Zod 或 Python 的 Pydantic 包裝，確切 wire 欄位與 SDK helper 簽章須依官方文件核對）鎖定最終 JSON 回應結構。在 `OrderOps` 中，最終輸出強制包含 `ticket_id`、`decision`（枚舉）、`refund_id`（必填且可為 `null`）、`amount_usd`、`confidence_score` 與 `summary`，並先檢查 `stop_reason` 與內容區塊 `type` 再解析。\n- **迴圈終止條件（`stop_reason` 分支）與 Thinking 保留**：生產級 Agent Loop 必須顯式處理所有已記載的 `stop_reason`：`\"tool_use\"` 代表保留完整 assistant 內容（含帶簽章的 `thinking` blocks），並在緊接的單一 `user` 訊息開頭為每個本機呼叫回傳恰好一筆 `tool_result`；`\"end_turn\"` 代表完成推理；`\"max_tokens\"` 代表輸出截斷，若發生在 `tool_use` 中途必須丟棄該回合或重試；其餘官方文件記載的終止原因（如安全拒答或上下文視窗限制等）及任何未知 `stop_reason` 一律明確處置或轉人工。若需調整或停用思考模式，應依所使用模型與 API 版本的官方文件確認支援的 `thinking` 設定及錯誤行為，並以實測比較延遲。\n\n以下為第 2 回合的 Wire-Level `tool_use` 回應範例（已有 `6,000` tokens 基準前綴命中快取，`1,200` tokens 為未快取的新增輸入，依第 5 節算例總輸入為 `7,200` tokens；省略 `role`、`model` 等外層欄位）：\n\n```jsonc\n// Assistant 回應（stop_reason: \"tool_use\"）\n{\n  \"id\": \"msg_01XFDUDYJgAACzvnptvVoYEL\",\n  \"stop_reason\": \"tool_use\",\n  \"content\": [\n    {\n      \"type\": \"tool_use\",\n      \"id\": \"toolu_01A09q90qw90lq917835lq9\",\n      \"name\": \"issue_refund\",\n      \"input\": {\n        \"tenant_id\": \"TENANT-ACME\",\n        \"order_id\": \"ORD-9042\",\n        \"amount_usd\": 45.0,\n        \"reason_code\": \"shipping_delay\",\n        \"idempotency_key\": \"refund:TENANT-ACME:ORD-9042:TKT-101\",\n        \"dry_run\": true\n      }\n    }\n  ],\n  \"usage\": {\n    \"input_tokens\": 1200,\n    \"cache_creation_input_tokens\": 0,\n    \"cache_read_input_tokens\": 6000,\n    \"output_tokens\": 350\n  }\n}\n```\n\n此外，Prompt Caching 的前綴匹配順序為 `tools → system → messages`。若僅將 `cache_control: { \"type\": \"ephemeral\" }` 放在最後一個工具上，只會快取 `tools`；要同時涵蓋固定的 `system` prompt，必須將斷點放在**最後一個固定 `system` 內容區塊**，並確保工具陣列順序、定義與 `system` 前綴在每個回合完全一致（快取命中屬 best effort）。\n\n以下為 `issue_refund` 工具的 `strict: true` 定義（完整可執行程式見 `examples/ts/ch02/index.ts` 與 `examples/py/ch02/main.py`）：\n\n```typescript\n// examples/ts/ch02/index.ts\n{\n  name: \"issue_refund\",\n  description:\n    \"Issue a customer refund. Always run with dry_run=true first to validate policy caps, then execute with dry_run=false and a deterministic idempotency_key.\",\n  strict: true,\n  input_schema: {\n    type: \"object\",\n    properties: {\n      tenant_id: { type: \"string\" },\n      order_id: { type: \"string\" },\n      amount_usd: { type: \"number\", description: \"Refund amount in USD (\u003e 0)\" },\n      reason_code: {\n        type: \"string\",\n        enum: [\"shipping_delay\", \"damaged_item\", \"inventory_shortage\", \"invoice_error\"],\n      },\n      idempotency_key: {\n        type: \"string\",\n        description: \"Deterministic key: refund:\u003ctenant_id\u003e:\u003corder_id\u003e:\u003cticket_id\u003e\",\n      },\n      dry_run: { type: \"boolean\" },\n    },\n    required: [\"tenant_id\", \"order_id\", \"amount_usd\", \"reason_code\", \"idempotency_key\", \"dry_run\"],\n    additionalProperties: false,\n  },\n}\n```\n\n### 3. 生產級儲存契約與配置基線\n\n工具執行層的可靠性取決於外部共享狀態與全鏈路超時邊界，不能依賴單機記憶體：\n\n- **全鏈路超時與併發基線**：單次 Messages API 請求設 `timeout = 30,000 ms`、唯讀工具 `5,000 ms`、寫入工具 `10,000 ms`，但**整條呼叫鏈必須共同執行 `18,000 ms` wall-clock deadline**（作為多步處置 `p95 ≤ 18s` SLO 的呼叫鏈預算；超時或轉人工工單是否納入分母與計算口徑須另行定義，並以實際延遲與結果分布驗證）：每次模型或工具呼叫都應以「剩餘 deadline」限制 timeout（包含 `Retry-After` 與 SDK 內建重試），剩餘預算不足時立即停止重試或轉人工，且 `max_turns = 8`。若 `12 req/s` 為工單進件率，5 回合穩態下約對應 `60` 次模型請求/秒（未計重試），工具併發、RPM、token 限額與連線池（如 `maxSockets = 64`、`keepAliveTimeout = 60,000 ms`）須依實際負載分別估算驗證。\n- **端到端冪等與 PostgreSQL 帳本契約**：唯一索引只能保護資料庫寫入；若支付商已完成退款而程序在寫回帳本前崩潰，重試仍可能重複動帳。因此必須先以 `(tenant_id, idempotency_key)` 原子建立持久操作紀錄並比對正規化業務酬載雜湊，再將同一操作鍵傳給支付商，明確定義 `pending`、`succeeded`、`failed` 與 `unknown` 狀態轉移及對帳流程；同時在交易內鎖定或原子預留同一筆支付的可退餘額，避免兩個不同操作鍵超額退款。\n  ```sql\n  CREATE TABLE refund_ledger (\n    refund_id        TEXT PRIMARY KEY,\n    tenant_id        TEXT NOT NULL,\n    order_id         TEXT NOT NULL,\n    idempotency_key  TEXT NOT NULL,\n    payload_hash     TEXT NOT NULL,\n    amount_usd       NUMERIC(10, 2) NOT NULL CHECK (amount_usd \u003e 0),\n    reason_code      TEXT NOT NULL,\n    status           TEXT NOT NULL,\n    created_at       TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    UNIQUE (tenant_id, idempotency_key)\n  );\n  ```\n- **Redis 分散式租約與熱快取**：高併發重試時，先以 `SET idemp:refund:\u003ctenant_id\u003e:\u003corder_id\u003e:\u003cticket_id\u003e \u003cowner_token\u003e NX EX 30` 搶佔 30 秒處理租約（釋放時須驗證持有者）；執行成功後寫入結果快取 `EX 86400`（24 小時 TTL），減少資料庫鎖爭用。\n\n### 4. MCP 傳輸層演進與 Stateless Streamable HTTP\n\n**MCP**（Model Context Protocol）將工具的「定義、探索與執行」從 Agent 程式碼中抽離為標準協定。在企業生產環境中，傳輸層的選擇直接決定了擴展性：\n\n- **Stdio（本地子行程）**：適合本機開發與 CLI 工具，但無法跨容器共享連線，也不適合多租戶高併發部署。\n- **Streamable HTTP（Stateless 模式）**：企業生產環境的標準選擇，可在負載平衡器後無狀態水平擴展（不依賴 Sticky Session）。即使不使用 `Mcp-Session-Id`，仍須依指定版本的 MCP 規範處理初始化生命週期（如 `initialize`、`notifications/initialized` 與 `tools/list` / `tools/call`）及對應的 HTTP 回應狀態碼與標頭，並驗證 `Origin` 標頭與請求大小上限。所有認證與租戶上下文（`Authorization`、`X-Tenant-Id`、`X-Trace-Id`）都必須隨每個 HTTP 請求完整傳遞。\n\n此外，Claude API 支援透過 `mcp_servers` Connector（搭配 `tools` 中的 `mcp_toolset` 設定）由服務端直接連線至可公開存取的遠端 Streamable HTTP MCP Server，並以受限授權憑證（OAuth 2.1 / Bearer）傳遞身分（是否需要特定 beta 標頭與對應區塊型別名稱須依官方文件核對）。當企業需要細粒度工具權限過濾、動態注入已驗證 `tenant_id` 或統一稽核日誌時，仍建議由應用層代理處理初始化、HTTP 生命週期、逾時控制與工具派發。\n\n### 5. 真實數字 Worked Example：Strict Schema 消除重試的成本帳\n\n以下以 `OrderOps` 基準（**18** 個工具 Schema 共 **3,600** tokens、System Prompt **2,400** tokens、基準 **5** 回合、第 1 回合總輸入為 **6,000** tokens、其後每回合新增保留對話與工具結果 **1,200** tokens、每回合計費輸出 **350** tokens 含 thinking、Claude Sonnet 5.5 牌價 Input `$2.00 / MTok`、Output `$10.00 / MTok`）計算 `strict: true` 帶來的成本節省：\n\n```text\n1. 前綴與基準單筆成本（無快取，5 回合）：\n   - 基準前綴 = 2,400 (System) + 3,600 (18 Tools) = 6,000 tokens\n   - 第 1~5 回合輸入：6,000 + 7,200 + 8,400 + 9,600 + 10,800 = 42,000 tokens\n   - 第 1~5 回合輸出：350 × 5 = 1,750 tokens\n   - 基準單筆成本 = (42,000 × $2.00 + 1,750 × $10.00) / 1,000,000\n                  = $0.0840 + $0.0175 = $0.1015 / 筆\n\n2. 未開啟 strict: true 時的非法參數重試開銷（情境假設：12% 工單多出 1 回合且錯因可由 strict 消除）：\n   - 額外第 6 回合輸入 12,000 tokens、輸出 350 tokens\n   - 單次額外回合成本 = (12,000 × $2.00 + 350 × $10.00) / 1,000,000 = $0.0275\n   - 平均每筆工單期望節省 = $0.0275 × 0.12 = $0.0033 / 筆\n   - 放大至每日 50,000 筆工單：50,000 × $0.0033 = $165.00 / 天（情境估算 $4,950 / 月）\n   - 實際延遲改善仍須以實測的錯誤分類、重試位置與延遲分布驗證。\n```\n\n（若要進一步透過工具動態裁切降低 **3,600** tokens 的前綴開銷，請見第 8 章的單位經濟學優化。）\n\n---\n\n## 故障模式與防禦\n\n1. **HTTP `429` / `529` 與 Streaming 半途斷線殘缺 JSON**\n   - **現象**：尖峰流量（12 req/s）時觸發 `429 Too Many Requests` 或 `529 overloaded_error`，或 SSE 串流在 `input_json_delta` 傳輸到一半時斷線，留下未閉合的 `tool_use` 區塊。\n   - **防禦**：讀取回應標頭 `retry-after`（若無則採指數退避加 Full Jitter：`base = 500 ms`、`cap = 4,000 ms`、`max_retries = 4`），並受剩餘 wall-clock deadline 約束。串流應在完整訊息確認後才派發寫入；若已派發寫入且結果未知，應查詢持久操作狀態，絕不可整回合重播造成重複動帳。\n   - **觀測與告警**：記錄 `http_status`、`retry_after_ms`、`stop_reason`；當 5 分鐘內（至少 100 次請求）`429`/`529` 比例超過 `2%` 時觸發限流告警。\n\n2. **業務錯誤直接拋出例外，或遺漏 `tool_use_id` 配對**\n   - **現象**：退款金額超過上限時開發者直接 `throw new Error(...)` 中斷迴圈，或未針對每個 `tool_use.id` 回填 `tool_result`，導致下一輪 API 回傳 `400 invalid_request_error`。\n   - **防禦**：攔截可預期的業務錯誤，在 `tool_result` 設定 `is_error: true` 並回傳結構化 JSON（如 `{\"error\": \"refund_exceeds_policy_cap\", \"max_allowed_usd\": 100}`），同時設定 `max_consecutive_tool_errors = 3` 熔斷器，連續失敗 3 次即轉交 `escalate_to_hitl`。組裝下一輪 `messages` 前，以程式斷言檢查每個 `tool_use.id` 都有對應的 `tool_result`。\n\n3. **冪等鍵衝突（Idempotency Collision）與並發競態**\n   - **現象**：模型在 Turn 2 與 Turn 3 並發發出兩個相同 `idempotency_key` 的 `issue_refund` 請求，或以相同的 `idempotency_key` 夾帶不同的 `amount_usd` 重試。\n   - **防禦**：Redis 租約搭配 PostgreSQL `UNIQUE(tenant_id, idempotency_key)` 攔截並發寫入，並比對正規化 `payload_hash`。若鍵相同但參數不同，回傳 `is_error: true`（`409 idempotency_payload_mismatch`），記錄 `idempotency_conflict_count` 並觸發 P1 告警。\n\n4. **Prompt Cache 靜默失效（Silent Cache Miss）**\n   - **現象**：`usage.cache_read_input_tokens` 持續為 `0`，`cache_creation_input_tokens` 每回合都大於 `0`，導致成本暴增。\n   - **防禦**：檢查是否在工具 `description` 或 `system` 區塊中動態注入了時間戳記或工單 ID，或重新排序了 18 個工具。五回合基準的固定前綴總量雖為 `30,000 / 42,000 = 71.43%`，但若第一回合為冷啟動寫入快取、後四回合均命中，快取讀取量為 `4 × 6,000 = 24,000` tokens（占總輸入 `57.14%`）；僅當第一回合已命中既有快取時，五回合快取讀取才達 `71.43%`。因此監控應以**符合快取條件的前綴／請求**為分母設定 `80%` 告警（15 分鐘視窗），並另外追蹤總輸入快取讀取占比與冷啟動率。\n\n5. **診斷日誌與可觀測性欄位基線**\n   - 每次工具呼叫與 API 回應都必須寫入結構化 JSON 日誌，至少包含：`trace_id`、`tenant_id`、`turn`、`tool_name`、`tool_use_id`、`is_error`、`http_status`、`retry_after_ms`、`cache_read_input_tokens`、`cache_creation_input_tokens`、`latency_ms`（避免記錄原始憑證及敏感酬載）。服務層以 5 分鐘視窗（至少 50 次工具呼叫）統計 `tool_error_rate \u003e 5%` 或 `p95 \u003e 4,000 ms` 觸發告警，並按工具、租戶與錯誤類別聚合。\n\n---\n\n## 動手做\n\n本章對應的範例程式路徑如下（請依實際檔案內容與本機執行結果驗證）：\n- TypeScript：`examples/ts/ch02/index.ts`（含 `ORDEROPS_TOOLS`、`TicketResolutionSchema`、`IdempotentRefundExecutor`、Agent Loop 與 Stateless Streamable HTTP MCP Server）\n- Python：`examples/py/ch02/main.py`（含 `ORDEROPS_TOOLS`、Pydantic `TicketResolution`、`IdempotentRefundExecutor`、Agent Loop 與 `ThreadingHTTPServer` MCP 端點）\n\n### 執行 Python 範例與驗證輸出\n\n```bash\ncd books/enterprise-agents/examples/py\npip install -r requirements.txt\npython3 -B ch02/main.py\n```\n\n未設定 `ANTHROPIC_API_KEY` 時，程式會自動執行本地的 `dry_run` → `commit` → `replay` 冪等去重測試；若已設定 `ANTHROPIC_API_KEY`，則會進一步執行完整 Agent Loop 驗證 `strict: true` 工具呼叫與 `TicketResolution` 結構化輸出（若啟用 Prompt Caching，呼叫 `calculate_cost_usd` 時須傳入對應的 cache usage 欄位）。預期輸出如下：\n\n```text\nDry-run: ('{\"dry_run\": true, \"would_approve\": true, \"order_id\": \"ORD-9042\", \"amount_usd\": 45.0, \"idempotency_key\": \"refund:TENANT-ACME:ORD-9042:TKT-101\"}', False)\nCommit: ('{\"refund_id\": \"REF-...\", \"tenant_id\": \"TENANT-ACME\", \"order_id\": \"ORD-9042\", \"amount_usd\": 45.0, \"reason_code\": \"shipping_delay\", \"idempotency_key\": \"refund:TENANT-ACME:ORD-9042:TKT-101\", \"status\": \"approved\"}', False)\nReplay: ('{\"refund_id\": \"REF-...\", \"tenant_id\": \"TENANT-ACME\", \"order_id\": \"ORD-9042\", \"amount_usd\": 45.0, \"reason_code\": \"shipping_delay\", \"idempotency_key\": \"refund:TENANT-ACME:ORD-9042:TKT-101\", \"status\": \"approved\", \"deduplicated\": true}', False)\nANTHROPIC_API_KEY not set; skipping live Claude API call.\n```\n\n### 執行 TypeScript 範例\n\n```bash\ncd books/enterprise-agents/examples/ts\nnpm install\nnpx tsx ch02/index.ts\n```\n\n### 邊界測試與 MCP 端點驗證\n\n1. **驗證 `dry_run` 不動帳與超限拒絕**：確認 `Dry-run` 不含 `refund_id` 且回傳 `would_approve: true`；金額超過 `$100` 時回傳 `would_approve: false` 與 `status: \"pending_hitl\"`。\n2. **驗證冪等去重、同鍵異參與跨租戶隔離**：確認 `Replay` 的 `refund_id` 與 `Commit` 一致且帶有 `\"deduplicated\": true`；以相同 `idempotency_key` 傳入不同金額應回傳 `IDEMPOTENCY_PAYLOAD_MISMATCH`；不同 `tenant_id` 使用相同 `idempotency_key` 不應重播他租戶紀錄。\n3. **驗證 Stateless MCP HTTP 端點**：啟動 MCP Server 後，依序發送 `initialize` → `notifications/initialized` → `tools/list` → `tools/call`（唯讀 `get_order`）：\n   ```bash\n   python3 -B ch02/main.py --serve\n   # 另開終端機執行：\n   curl -s -X POST http://127.0.0.1:8787/mcp \\\n     -H \"Content-Type: application/json\" \\\n     -H \"Accept: application/json, text/event-stream\" \\\n     -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-03-26\",\"capabilities\":{},\"clientInfo\":{\"name\":\"curl\",\"version\":\"1.0\"}}}'\n   curl -i -s -X POST http://127.0.0.1:8787/mcp \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\"jsonrpc\":\"2.0\",\"method\":\"notifications/initialized\"}'\n   curl -s -X POST http://127.0.0.1:8787/mcp \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\",\"params\":{}}'\n   curl -s -X POST http://127.0.0.1:8787/mcp \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"tools/call\",\"params\":{\"name\":\"get_order\",\"arguments\":{\"tenant_id\":\"TENANT-ACME\",\"order_id\":\"ORD-9042\"}}}'\n   ```\n4. **驗證負數與 `NaN` 金額邊界**：將 `amount_usd` 改為 `-10` 或 `NaN` 呼叫 `issue_refund`，確認帳本層回傳 `is_error: true` 且不寫入任何退款紀錄。\n\n---\n\n## 自我檢核\n\n1. （**入門｜10 分鐘**） 為什麼在 Agent 系統中，工具執行遇到業務邏輯錯誤（如「退款金額超過上限」）時，應該回傳 `is_error: true` 的 `tool_result`，而不是直接拋出例外中斷程式？\n2. （**進階｜15 分鐘**） `strict: true` 能保證什麼？它**不能**保證什麼？請以 `OrderOps` 的 `issue_refund` 工具為例說明。\n3. （**挑戰｜20 分鐘**） 假設你的 `OrderOps` MCP Server 部署在 Kubernetes 上（3 個 Pod），前端透過 Load Balancer 輪詢發送請求。如果模型在 Turn 2 呼叫 `issue_refund(dry_run=true)` 命中 Pod A，Turn 3 呼叫 `issue_refund(dry_run=false)` 命中 Pod B，系統該如何確保冪等性與一致性？\n\n### 參考解答\n\n1. **解答**：在微服務中，呼叫端是確定性程式碼，收到例外只能依錯誤碼重試或告警；但在 Agent Loop 中，呼叫端是具備推理能力的 LLM。將結構化的業務錯誤透過 `is_error: true` 回填為 `tool_result`，等同於提供觀測訊號給模型，讓模型在下一回合修正參數或改為升級人工審批（`escalate_to_hitl`）。同時，Messages API 強制要求每個 `tool_use.id` 都必須有對應的 `tool_result`，若因例外中斷而遺漏配對，下一輪請求會直接回傳 `400 invalid_request_error`。工程上應搭配 `max_consecutive_tool_errors = 3` 熔斷器，避免模型陷入死循環。\n2. **解答**：`strict: true` 在 API 解碼層透過受限採樣，保證成功完成的 `tool_use.input` 符合支援的 JSON Schema 子集結構、型別、必填欄位與 `enum` 約束（在 12% 情境假設下可望省下每月約 `$4,950` 的無效重試成本）。但它**不能**保證語意與業務邏輯正確——例如它無法阻止模型填入一個「型別正確但不存在的 `order_id`」，也無法驗證 `amount_usd \u003e 0` 或是否超過該租戶的政策上限，因此後端仍必須執行 `dry_run` 預檢、範圍檢查與權限驗證。\n3. **解答**：MCP Server 本身必須保持 Stateless，不將 `dry_run` 結果或冪等紀錄存在 Pod 本地記憶體，否則跨 Pod 路由時會發生狀態遺失或重複動帳。所有 `(tenant_id, idempotency_key)` 的鎖定與狀態紀錄必須寫入外部共享儲存：先以 Redis 租約搶佔處理權，再於 PostgreSQL 原子建立持久操作紀錄並以 `UNIQUE(tenant_id, idempotency_key)` 兜底與比對 `payload_hash`，將同一操作鍵傳給支付商並將結果快取 `EX 86400`（24 小時）。這樣無論 Turn 3 路由到哪一個 Pod，都能查詢到一致的帳本狀態，並在參數一致時回傳 `deduplicated: true`，參數不一致時回傳 `409` 衝突錯誤。\n\n---\n\n## 延伸閱讀\n\n- Anthropic 官方文件：*Tool use with Claude*（`strict: true` 受限採樣與 `tool_result` 錯誤處理規範）\n- Anthropic 官方文件：*Structured outputs*（`output_config.format` 與 JSON Schema 支援子集限制）\n- Model Context Protocol (MCP) 規範：*Streamable HTTP Transport*（Stateless 無狀態傳輸模式與 JSON-RPC 2.0 雙向訊息格式）\n"}, {"id": "ch03-context-and-prompt-engineering", "file": "ch03-context-and-prompt-engineering.md", "group": "Part I — 核心引擎與契約", "title": "第 3 章：Context Engineering：從 Prompt 調校到上下文預算管理", "md": "# 第 3 章：Context Engineering：從 Prompt 調校到上下文預算管理\n\n在生產環境裡，多數工程師把 Prompt 當成「調整語氣與措辭的文案」，但對企業級 Agent 而言，Context Window 就是執行期的**工作記憶體**（Working Memory）。當 `OrderOps` 每天處理 50,000 筆工單、每筆平均經歷 5 個回合時，塞進 Context 的每一個多餘 token 都會在後續回合被重複計費，同時稀釋模型對關鍵規則的注意力。\n\n本章把焦點從單次 Prompt 寫作，轉移到系統層級的 **Context Engineering**：如何像規劃記憶體分頁與快取前綴一樣，編排靜態前綴與動態載荷、配置 Extended Thinking 預算，並在長對話中用截斷與 Compaction 守住延遲與成本邊界。\n\n---\n\n## 從你已知的出發\n\n資深後端工程師設計高效能服務時，會利用「**CPU 快取局部性**（Cache Locality）」與「**虛擬記憶體分頁**（Virtual Memory Paging）」來壓低延遲與記憶體壓力。這兩個機制與 LLM 的 Context 管理有直接的結構對照：\n\n- **CPU 快取前綴對照 Prompt Caching**：CPU 依賴空間局部性來重用穩定資料；LLM 推論引擎的 KV Cache 也是如此：API 請求必須依照 `tools` → `system` → `messages` 的固定前綴順序送出，當請求前綴字元完全一致、符合模型最低門檻，且已有尚未到期的對應快取項目時，就能命中快取，以基礎輸入單價的 **0.05×**（Sonnet 5.5 / Opus 5.5）或 **0.10×**（Haiku 5.5）讀取（冷啟動、TTL 到期與首次回應開始前的並發建立期間仍可能未命中）。需注意 KV Cache 使用量、上下文容量與計費口徑是三種不同的量。\n- **虛擬記憶體分頁對照 Context Compaction**：當行程的 working set 超出實體記憶體，作業系統會把冷資料換出（swap out），只把熱頁留在 RAM。Agent 進入較長對話（例如示例第 4 回合以後），早期工具回傳與中間推理過程會快速膨脹，我們必須透過「工具結果截斷」與「對話歷史 Compaction」，把舊回合壓縮成精簡摘要，只保留最近回合（例如最近 2 個完整回合）在 Context 中。\n\n這個技術對照的**成立邊界**在於「重用穩定內容與熱／冷資料分層」：靜態規則放最前、動態工單放最後、過期觀測壓縮換出。**失效邊界**則在於：LLM 的 KV Cache 對任何一個空白字元或時間戳記的改動都會使該斷點及其後段失效（Cache Miss）；此外，作業系統的分頁換入換出是無損的，而 Context Compaction 是有損壓縮，一旦把關鍵訂單編號或金額壓掉，模型就無法憑空還原。\n\n---\n\n## 核心機制\n\n### Context Window 組成與 Context Rot\n\n一次完整的 Claude Messages API 請求，上下文由三個請求內容區塊加上生成輸出預算組成：\n\n```text\n[1. tools]        -\u003e 18 個工具 Schema（OrderOps 基準：3,600 tokens）\n[2. system]       -\u003e 角色定義、合規規則、Few-shot（OrderOps 基準：2,400 tokens）\n[3. messages]     -\u003e 多回合對話、tool_use、tool_result、thinking blocks\n[4. output]       -\u003e 本回合生成的 thinking + text / tool_use（受 max_tokens 約束）\n```\n\n把這四塊全部塞滿並不代表效果最好。實務上常討論 **Context Rot**（上下文腐化）風險：隨著無關資訊或冗長日誌累積，模型在長上下文中段（Middle）的資訊檢索準確率可能下滑，且無關的干擾物可能稀釋對系統規則的注意力（實際影響幅度須透過自身任務的評測驗證）。對 `OrderOps` 而言，把一份 8,000 tokens 的完整 ERP 原始 JSON 塞進 `tool_result`，不僅浪費輸入預算，還會提高模型漏看工單真實退款上限的風險（可透過評測驗證）。\n\n### 前綴穩定排序與 `cache_control` 斷點\n\nClaude API 的 Prompt Caching 採前綴比對（Prefix Matching），評估順序固定為 **`tools` → `system` → `messages`**（與 JSON 欄位序列化順序無關），且前綴需達模型最低門檻（依模型版本與官方文件確認，例如較新旗艦模型 `claude-opus-5-5` 為 512 tokens，標準 Sonnet 系列如 `claude-sonnet-5` 為 1,024 tokens，部分較舊模型則為 4,096 tokens；`OrderOps` 的 3,600 與 6,000 tokens 前綴均已超過上述 512 與 1,024 tokens 門檻，但各模型實際最低門檻，包括 Sonnet 5.5，仍須依官方文件另行確認）。為了最大化快取命中率，必須把靜態內容集中在前段，動態內容推到最尾端：\n\n1. **`tools` 尾端斷點**：在最後一個工具定義加上 `cache_control: { type: \"ephemeral\" }`，把 `OrderOps` 的 3,600 tokens 工具面鎖進快取。\n2. **`system` 尾端斷點**：把 2,400 tokens 的靜態營運規範與 Few-shot 放在 `system`，並在最後一個 text block 加上 `cache_control: { type: \"ephemeral\" }`。\n3. **動態載荷後置**：工單編號、客戶訊息、當前時間等每次請求都會變動的資料，一律放在 `messages` 的 `user` 訊息中，絕對不要插進 `system` 前段。\n\n\u003e [!NOTE]\n\u003e 本章僅處理前綴結構與斷點擺放；關於 5 分鐘（1.25× 寫入）與 1 小時（2.0× 寫入，`ttl: \"1h\"`）的完整 FinOps 損益平衡精算，見 ch08。若需進一步約束輸出形狀，可在工具定義使用 `strict: true` 控制工具名稱與參數，或在請求使用 `output_config.format` 控制最終 JSON 輸出（遠端 MCP Connector 與 Batch API 見後續章節）。\n\n以下是 TypeScript 的前綴分層建構核心片段（完整可執行檔見 `books/enterprise-agents/examples/ts/ch03/index.ts`，Python 對照實作見 `books/enterprise-agents/examples/py/ch03/main.py`）：\n\n```typescript\n// 節錄自 examples/ts/ch03/index.ts（動態欄位已省略並須經 XML escaping）\nexport function buildLayeredPrompt(\n  ticket: OrderOpsTicket,\n  tools: Anthropic.Tool[],\n  staticPolicyText: string,\n): LayeredPrompt {\n  const cachedTools = tools.map((tool, idx) =\u003e\n    idx === tools.length - 1\n      ? { ...tool, cache_control: { type: \"ephemeral\" as const } }\n      : tool,\n  );\n\n  const system: Anthropic.TextBlockParam[] = [\n    {\n      type: \"text\",\n      text: staticPolicyText,\n      cache_control: { type: \"ephemeral\" },\n    },\n  ];\n\n  return {\n    tools: cachedTools,\n    system,\n    messages: [{ role: \"user\", content: `\u003cticket_context\u003e...\u003c/ticket_context\u003e` }],\n  };\n}\n```\n\n### XML 結構化分區與 Few-shot 邊界案例\n\n在企業級 Prompt 中，可使用 XML 標籤（如 `\u003crole\u003e`、`\u003crules\u003e`、`\u003cexamples\u003e`、`\u003cticket_context\u003e`）與可靠序列化標示指令與不可信資料的邊界；實際防護效果仍應透過提示注入評測驗證，並配合應用層權限控制。寫入 `\u003cticket_context\u003e` 前必須先做 XML escaping（或可靠序列化），並把工單、ERP 自由文字與壓縮摘要一律視為不可信資料。\n\n與其寫十條抽象形容詞（「請保持專業且謹慎」），不如在 `\u003cexamples\u003e` 中放 2 到 3 個**邊界案例**（Edge Cases）。例如針對 `OrderOps` 的示例業務規則：明確示範「當物流追蹤碼依最後更新時間已超過 72 小時無更新且訂單狀態為 `delayed` 時，先查庫存再決定是否補償」，以及「當工單要求退款金額大於訂單總額時，必須拒絕並回報異常」。這能直接校準模型的輸出格式與決策邊界。\n\n### Extended Thinking 配置與多回合保留\n\n面對高難度異常工單（例如跨倉調撥衝突或複雜發票對帳），可以啟用 **Extended Thinking**，讓模型在輸出最終回覆或 `tool_use` 之前，先在內部完成多步驟推理：\n\n- **模式與配額**：較新模型支援自適應推理模式，亦可使用 `thinking: { type: \"enabled\", budget_tokens: N }`（具體預設模式與可調參數依模型版本與官方文件確認）。設定 `budget_tokens` 時，`max_tokens` 必須嚴格大於 `budget_tokens`，以保留最終答案或工具呼叫的輸出配額。\n- **計費與延遲**：`thinking` 產生的 tokens 會增加輸出成本與延遲（Sonnet 5.5 輸出單價為 `$10.00 / MTok`，Opus 5.5 為 `$20.00 / MTok`；實際 `thinking` 計費與 `usage` 欄位計數口徑應依所用模型與官方文件確認），因此應依任務品質改善、錯誤風險、延遲與成本評測決定啟用範圍，而非無條件全量預設開啟。\n- **多回合保留 `thinking` block**：在 `tool_use` 迴圈中，把上一回合 `assistant` 的回應寫回 `messages` 時，**必須原封不動保留先前的 `thinking` block（包含其中的 `signature`）**，並依所用 API 規格處理 `tool_result`（以 `tool_use_id` 配對）及其他加密推理區塊的格式與排序。\n\n```python\n# 節錄自 examples/py/ch03/main.py\nresponse = client.messages.create(\n    model=\"claude-sonnet-5-5\",\n    max_tokens=8000,\n    thinking={\"type\": \"adaptive\"},\n    tools=prompt[\"tools\"],\n    system=prompt[\"system\"],\n    messages=prompt[\"messages\"],\n)\n# 多回合必須原樣保留 response.content（含 thinking block 與 signature）\nupdated_messages = [*prompt[\"messages\"], {\"role\": \"assistant\", \"content\": response.content}]\n```\n\n### 工具結果截斷、Compaction 與 Scratchpad\n\n當對話進入多回合（例如示例第 3 回合以後），Context 膨脹的主要元兇往往不是使用者的幾句話，而是工具回傳的龐大資料。生產系統必須同時採用三道壓縮防線：\n\n1. **工具結果截斷**（Truncation）：在寫入 `tool_result` 之前，對超過閾值（例如粗估 600 tokens / 約 2,400 字元）的回傳採頭尾保留、中段省略的截斷（並確保小上限時不會反向膨脹），優先投影必要欄位與分頁，避免單次粗估 8,000-token 的 ERP 日誌在後續回合被反覆計費。\n2. **歷史 Compaction**：以 token 預算與輸出預留量為準（例如第 4 回合作為示例觸發條件），只壓縮已完成的工具交換為結構化 `\u003ccompacted_history\u003e` 摘要，不可切斷 `tool_use` 與其對應的 `tool_result`，並原樣保留最近回合。\n3. **Scratchpad 與應用層邊界**：可要求模型把已確認的事實寫入狀態區塊，但模型產出的 `refund_eligible: true` 只能視為待驗證線索。租戶身分必須來自已驗證的請求憑證，工具執行器須按租戶查驗訂單權限，並在退款前依權威帳本重查餘額、幣別、資格與冪等鍵。\n\n---\n\n## Worked Example：Extended Thinking 與工具裁剪的真實成本帳本\n\n以下以 `OrderOps` 基準（Sonnet 5.5：Input `$2.00 / MTok`、Output `$10.00 / MTok`；基準前綴 `6,000` tokens；第 2–5 回合每回合新增歷史輸入 `1,200` tokens（已含重送的可見 assistant 輸出與工具結果）、每回合輸出 `350` tokens；5 回合未優化基準累計 `42,000` input / `1,750` output，單筆 `$0.1015`）獨立實算兩個情境：\n\n```text\n情境 A（獨立首輪載荷情境）：單筆高難度工單開啟 Extended Thinking（max_tokens = 8,000）\n假設第 1 回合寫入 6,000-token 前綴（5m TTL 寫入倍率 1.25×），首輪另有動態輸入 1,200 tokens，\n且觀測到計費輸出為 4,000 thinking tokens + 350 回覆 tokens（合計 4,350 output tokens）：\n- 前綴快取寫入成本 = (6,000 × $2.00 × 1.25) ÷ 1,000,000 = $0.015000\n- 新增輸入成本     = (1,200 × $2.00) ÷ 1,000,000        = $0.002400\n- 輸出成本（含思考）= (4,350 × $10.00) ÷ 1,000,000       = $0.043500\n- 單回合總計       = $0.060900（光 thinking 4,000 tokens 就佔了 $0.040000）\n\n情境 B（獨立大回傳情境）：第 2 回合工具回傳從 8,000 tokens 裁剪為 600 tokens，對後續 3 回合的乘法節省\n- 單次省下的輸入量 = 8,000 - 600 = 7,400 tokens\n- 後續第 3、4、5 回合共 3 次重送都會帶入該工具結果（未命中快取的新增對話區，且假設中途未經 Compaction 移除）：\n  後續重送累計省下 = 7,400 × 3 = 22,200 input tokens（若加計第 2 回合首次送入則端到端為 29,600 tokens）\n- 以 Sonnet 5.5 基礎輸入單價 $2.00 / MTok 計算：\n  後續重送節省 = (22,200 × $2.00) ÷ 1,000,000 = $0.044400（含首次送入為 $0.059200）\n```\n\n這組數字清楚說明兩個工程決策：第一，Extended Thinking 的輸出單價極高，必須只針對高風險或複雜工單按需開啟；第二，工具回傳的截斷具有**乘法效應**，越早截斷，後續回合省下的輸入成本與延遲越多。\n\n---\n\n## 故障模式與防禦\n\n1. **前綴汙染導致 Cache Silent Miss**\n   - **現象**：API 正常回傳 `200 OK`，但監控發現 `usage.cache_creation_input_tokens` 持續偏高、而 `usage.cache_read_input_tokens` 遠低於預期（或為 `0`）。\n   - **根因**：有人在 `system` prompt 最前端插入了 `current_timestamp`、`request_id` 等動態變數。由於前綴評估順序為 `tools` → `system` → `messages`，`tools` 斷點（3,600 tokens）仍可命中讀取，但 `system`（2,400 tokens）與後續斷點會失配重寫；此外並發請求在第一個回應開始前也可能同時 miss。\n   - **防禦**：嚴格執行 `tools` → `system` → `messages` 分層；CI 加入前綴雜湊檢查；上線後在監控區間加總各欄位，追蹤 `cache_read_input_tokens / (input_tokens + cache_creation_input_tokens + cache_read_input_tokens)`，按前綴版本區分冷啟動、TTL 到期與持續失配，低於示例告警門檻（如 70%）即告警。\n\n2. **遺失 `thinking` block 或 `signature` 導致多回合失敗**\n   - **現象**：在 `tool_use` 迴圈第 2 回合送出請求時，API 回傳 `400 invalid_request_error` 提示 thinking block 格式錯誤或簽章無效。\n   - **根因**：開發者在組裝歷史訊息時，只擷取了 `text` 與 `tool_use` block，把 `thinking` block 過濾掉，或自行修改了 `signature`。\n   - **防禦**：使用 `appendAssistantTurn` 等統一 helper，將 `response.content` 陣列完整寫回 `messages`，Compaction 時也僅壓縮已完成的更早回合，不拆解當前回合的 `thinking` 區塊；遇到 `max_tokens` 或 `model_context_window_exceeded` 截斷時，禁止派送未完成的工具參數。\n\n3. **未截斷的工具回傳引發 Context 溢位或延遲飆升**\n   - **現象**：某筆工單呼叫 ERP 查詢後回傳大型日誌（例如 15,000 tokens），使端到端延遲面臨突破 p95 SLO（分流 2.5s / 多步處置 18s）或觸發截斷的風險。\n   - **根因**：直接把外部 API 的原始 JSON 全量塞進 `tool_result`。\n   - **防禦**：在工具執行層強制套用 `truncateToolResult`（上限粗估 600 tokens / 2,400 字元），並對清單類工具預設加上 `limit` 與欄位白名單。\n\n---\n\n## 動手做\n\n本節對應的完整可執行程式碼位於：\n- TypeScript：`books/enterprise-agents/examples/ts/ch03/index.ts`\n- Python：`books/enterprise-agents/examples/py/ch03/main.py`\n\n兩份程式皆實作了 `buildLayeredPrompt`、`truncateToolResult` 與 `compactHistory`，並支援在未設定 `ANTHROPIC_API_KEY` 時自動切換為離線驗證模式，示範工具結果截斷、多回合歷史 Compaction 與 Extended Thinking 成本帳本。\n\n執行 Python 版本驗證：\n\n```bash\npython3 books/enterprise-agents/examples/py/ch03/main.py\n```\n\n若已設定 `ANTHROPIC_API_KEY` 與 TypeScript 相依套件（`@anthropic-ai/sdk`、`tsx`），可執行 TypeScript 版本或跑型別檢查：\n\n```bash\nnpx --prefix books/enterprise-agents/examples/ts tsx books/enterprise-agents/examples/ts/ch03/index.ts\n```\n\n---\n\n## 自我檢核\n\n1. **（入門｜預估 10 分鐘）** 為什麼在 Claude API 中，把當前時間 `2026-11-21T10:00:00Z` 放在 `system` prompt 的第一行，會讓 `OrderOps` 的 `system` 前綴快取失效？此時 `tools`（3,600 tokens）與 `system`（2,400 tokens）分別會發生什麼事？應該改放在哪裡？\n2. **（進階｜預估 15 分鐘）** 在多回合 `tool_use` 迴圈中，為什麼在支援手動 `budget_tokens` 的模式下 `max_tokens` 不能小於或等於 `budget_tokens`？而在使用自適應推理模式時，應如何依官方文件確認深度控制與輸出上限？把上一回合的 `assistant` 回應寫回 `messages` 時，必須遵守什麼規則？\n3. **（挑戰｜預估 20 分鐘）** 假設在獨立大回傳情境下，`OrderOps` 某個工具平均回傳 5,000 tokens，且每筆工單平均還有 4 個後續回合（假設未經 Compaction 移除）。若你實作截斷器將其壓縮為 500 tokens，在 Sonnet 5.5（Input `$2.00 / MTok`）下，僅計後續重送每筆工單可省下多少輸入 tokens 與美元成本？若每日有 50,000 筆工單觸發此工具，每月（30 天）共省下多少美元？（若加計首次送入，端到端總節省又為何？）\n\n### 參考解答\n\n1. **解答**：Prompt Caching 採用嚴格前綴比對（`tools` → `system` → `messages`）。時間戳記放在 `system` 第一行時，已寫入且仍有效的 `tools` 斷點（3,600 tokens）仍可命中讀取，但從 `system` 斷點起（2,400 tokens）會因位元組改變而失配並重新寫入快取。正確做法是將靜態政策留在 `system`，把時間戳記等動態欄位放進 `messages` 最後的 `user` 訊息（例如 `\u003cticket_context\u003e`）中。\n2. **解答**：在手動 `budget_tokens` 模式下，`max_tokens` 是單回合所有輸出（包含 `thinking` tokens 與最終可見的 `text` / `tool_use` tokens）的總上限，因此必須嚴格大於 `budget_tokens`，否則沒有配額輸出最終答案。若使用較新模型的自適應推理模式，應依該模型版本的官方文件確認對應的深度控制與 `max_tokens` 設定。寫回 `messages` 時，必須原封不動保留 `response.content` 中的 `thinking` block 與其 `signature`（其他加密區塊與格式細節依所用 API 官方規格確認）。\n3. **解答**：\n   - 單次省下輸入：`5,000 - 500 = 4,500` tokens。\n   - 僅計後續 4 個回合重送：`4,500 × 4 = 18,000` input tokens / 筆，單筆省下 `(18,000 × $2.00) ÷ 1,000,000 = $0.036` / 筆；每月（1,500,000 筆）省下 `$54,000` / 月。\n   - 若加計首次送入（共 5 次）：`4,500 × 5 = 22,500` tokens / 筆，單筆 `$0.045` / 筆，每月 `$67,500` / 月。\n\n---\n\n## 延伸閱讀\n\n- [Anthropic Prompt Caching 官方文件](https://platform.claude.com/docs/en/build-with-claude/prompt-caching)：深入檢視 `cache_control` 斷點數量上限與 TTL 規則。\n- [Anthropic Extended Thinking 指南](https://platform.claude.com/docs/en/build-with-claude/thinking)：了解手動 `budget_tokens`、自適應推理模式與 `thinking` block 簽章驗證機制。\n- 本書第 8 章（`ch08-cost-and-latency-optimization.md`）：完整 5m vs 1h TTL 損益平衡與 `OrderOps` 月成本壓縮帳本。\n"}, {"id": "ch04-state-memory-and-retrieval", "file": "ch04-state-memory-and-retrieval.md", "group": "Part II — 狀態、記憶與多代理協作", "title": "第 4 章 持久化狀態、多層記憶與企業知識檢索（Agentic RAG）", "md": "# 第 4 章 持久化狀態、多層記憶與企業知識檢索（Agentic RAG）\n\n## 從你已知的出發\n\n資深後端工程師設計分散式服務時，靠兩項資料庫基石保證系統可恢復與多租戶隔離：**預寫日誌與檢查點**（WAL Checkpoint）確保程序崩潰或重啟後，能從最後一個已提交的交易邊界或恢復點續跑；**列級權限**（Row-Level Security, RLS）則在查詢引擎層強制過濾 `tenant_id`，不讓應用層的疏忽外洩跨租戶資料。\n\n把這組機制對照到企業級 Agent：\n- **成立邊界**：`OrderOps` 處理「等待供應商回覆 ETA」的工單時，可能暫停數小時。將每回合的 `messages`、已執行的 `tool_use` 與 `tool_result` 配對以及 `waiting_for` 狀態持久化到 PostgreSQL，可讓無狀態 Worker 節點恢復上下文；但要做到安全喚醒續跑，還須結合併發控制（CAS）、可恢復的操作紀錄、外部副作用的冪等或對帳，以及權限重查。同樣地，企業知識庫檢索必須在向量與全文查詢前就套用 `tenant_id` 與 `acl_roles` 過濾（相當於 RLS）。\n- **失效邊界**：資料庫 WAL 恢復依賴已記錄的資料變更與恢復規則，而重新執行 LLM 推理及外部工具則具備非確定性與副作用。一旦某個 `tool_result` 已經寫入持久化狀態，續跑時**絕不能**重新呼叫一次寫入型工具（否則會重複退款），只能把已保存的觀測結果直接餵回模型；此外，RLS 只管得到結構化資料列，若把未過濾的檢索段落塞進 Context Window，LLM 仍可能在生成階段把機密條文混合輸出。\n\n## 核心機制\n\n### 1. 三層記憶模型與儲存配置基線\n\n企業級 Agent 不能把所有資訊都塞進單次請求的 `messages` 陣列，必須拆分為生命週期與存取延遲截然不同的三層記憶：\n\n```text\n[1] Working Context (單次 API 請求生命週期)\n    └─ System Prompt + Tools + 近期對話 + 本回合檢索段落（受 Context Window 上限約束）\n[2] Session State Store (數分鐘～數天，PostgreSQL + Redis)\n    └─ 工單對話歷史、turn_count、waiting_for、待喚醒的 tool_use_id\n[3] Long-term Memory (跨工單長期留存，Vector DB + Full-Text Index)\n    └─ Episodic（歷史工單處置紀錄）與 Semantic（退貨政策、供應商合約）\n```\n\n在 `OrderOps` 中，設定基線如下：Redis 負責熱快取，Key 格式為 `orderops:session:{tenant_id}:{session_id}`，快取 TTL 設為 `86,400` 秒（24 小時），單 Worker 連線池上限 `50`、單次讀取 timeout `150 ms`。PostgreSQL 負責持久化落盤，單 Worker 連線池設為 `min=5, max=20`、寫入 timeout `2,000 ms`，單筆 `messages_json` 軟上限為 `512 KB`（超過即觸發早期回合摘要壓縮，避免序列化與網路傳輸拖垮延遲）。正式部署時須為資料表啟用 PostgreSQL RLS 政策並在交易內設定租戶身分（例如 `SET LOCAL app.tenant_id = ...`），且應用連線角色不可為表擁有者或具備 `BYPASSRLS` 權限。\n\n寫入路徑必須以 PostgreSQL 為唯一事實來源（Source of Truth）：先寫 PostgreSQL，成功後再更新或失效 Redis；喚醒、授權與寫入決策一律以資料庫為準，快取回填須帶 `version` 保護，避免舊讀取在較新寫入後回填過期版本。請嚴格區分三種期限：Redis 快取 TTL（24 小時）、外部等待逾時 `expires_at`（例如 24 小時）與法遵資料留存期限（依企業稽核規範另定）。當工單進入 `waiting_external` 狀態時，Worker 釋放記憶體與連線，直到供應商 Webhook 回調才從資料庫載入 `AgentSessionState` 繼續下一回合；並另建獨立的操作與稽核紀錄表，確保 `messages_json` 壓縮摘要時仍能保留未完成工具配對、退款事實與稽核證據。若工單在 `waiting_external` 超過 `expires_at` 仍無外部回調，背景排程器會以條件更新（`WHERE status = 'waiting_external' AND version = $3`）與正常喚醒競爭同一狀態轉移，確保只有一方能成功推進狀態；至於超時通知與退款的互斥，仍須透過完整狀態機、操作紀錄、可靠派送及下游冪等機制確保。\n\n### 2. 對話歷史的 Schema 化持久化與 Wire-Level 契約\n\n直接把整個 `messages` 陣列序列化成單一純文字 Blob，會在模型升級或 Schema 變更時難以除錯。生產環境應為 `agent_sessions` 建立明確欄位，並加入 `version` 樂觀鎖防止併發喚醒覆寫：\n\n```sql\nCREATE TABLE agent_sessions (\n  tenant_id     TEXT NOT NULL,\n  session_id    TEXT NOT NULL,\n  ticket_id     TEXT NOT NULL,\n  status        TEXT NOT NULL, -- 'active' | 'waiting_external' | 'completed' | 'expired'\n  turn_count    INTEGER NOT NULL DEFAULT 0,\n  version       INTEGER NOT NULL DEFAULT 1,\n  messages_json JSONB NOT NULL,\n  waiting_for   TEXT,\n  expires_at    TIMESTAMPTZ NOT NULL,\n  PRIMARY KEY (tenant_id, session_id)\n);\nCREATE INDEX idx_sessions_waiting ON agent_sessions (status, expires_at)\n  WHERE status = 'waiting_external';\n```\n\n每次 `Turn` 結束（無論是 `tool_use` 還是進入 `waiting_external`），系統先以帶狀態條件的 CAS（`UPDATE ... SET version = version + 1 WHERE tenant_id = $1 AND session_id = $2 AND status = $3 AND version = $4 AND expires_at \u003e NOW()`）檢查更新列數是否為 `1`，並在同一交易寫入可恢復的操作紀錄，再回傳外部事件（跨節點分散式重試與 Outbox 見 ch06）。\n\n在 Wire-Level 上，訊息配對與區塊順序（例如 `assistant` 的 `tool_use` 與後續 `user` 訊息中 `tool_result` 的對應與排列）須依相應版本的官方 Messages API 工具使用文件核對；`createdAt` 等本地 metadata 必須留在 wire payload 之外，而工具回合所需的原始 `assistant` `thinking` / `redacted_thinking` 區塊與簽章則須完整保留。未完成的呼叫可先存為工作紀錄，組裝 API 歷史時才要求配對完整；若 `pending_external` 已作為 `tool_result` 寫入，後續 Webhook 應成為新的事件輸入（例如新的 `user` 訊息）。程式必須依據回應中的 `stop_reason` 分派流程、依 `usage` 計量與執行預算政策：\n\n```json\n{\n  \"id\": \"msg_01XFDUDYJgAACzvnptvVoYEL\",\n  \"stop_reason\": \"tool_use\",\n  \"content\": [\n    {\n      \"type\": \"tool_use\",\n      \"id\": \"toolu_01A09q90qw90lq917835lq9\",\n      \"name\": \"search_knowledge_base\",\n      \"input\": { \"query\": \"carrier delay 72 hours APAC\", \"top_k\": 3 }\n    }\n  ],\n  \"usage\": {\n    \"input_tokens\": 1840,\n    \"cache_read_input_tokens\": 6000,\n    \"output_tokens\": 92\n  }\n}\n```\n\n當 `stop_reason === \"tool_use\"` 時，Worker 執行工具並寫回 `tool_result`（若工具失敗則帶上 `\"is_error\": true` 與錯誤訊息讓模型降級處理）；`end_turn` 或 `stop_sequence` 代表本輪推理正常結束；若出現 `max_tokens` 或 `model_context_window_exceeded` 代表輸出或上下文截斷，`refusal` 代表安全拒答，皆不可當成正常回覆；若使用服務端工具並收到 `pause_turn`，則須依協定續跑。串流收到 `message_stop` 後仍須檢查 `stop_reason`、完整區塊、schema 與授權，並處理 HTTP `200` 之後才送出的 SSE `error` 事件。\n\n### 3. 靜態 RAG 的盲點 vs Agentic RAG\n\n傳統靜態 RAG 在使用者輸入進來後，固定執行一次向量檢索並把 Top-10 文件硬塞進 Prompt。這種作法在企業場景有兩個致命傷：第一，簡單工單（例如單純查詢物流單號）根本不需要政策文件，卻白白承擔數千 tokens 的上下文噪音與費用；第二，單次查詢詞彙若與合約條文用語不同（例如工單寫「海關卡關」，合約寫「不可抗力清關延遲」），靜態 RAG 沒有機會換詞重試。\n\n**Agentic RAG** 把檢索包裝成一個唯讀工具（例如 `search_knowledge_base`）。由 Agent 自主決定何時需要查資料、拆解關鍵字、結合 **Hybrid Search**（BM25 全文檢索 + Vector 語意檢索 + RRF 倒數排名融合，常數 `k = 60`），並在首輪結果不足時自主改寫查詢詞重試。設定上，單次檢索工具 timeout 設為 `800 ms`，單回合最多允許 `max_search_retries = 2` 次改寫重試（串行檢索最多耗 `2.4 s`，尚須加上改寫、排隊與模型延遲，適用 `18 s` 多步處置 SLO，而非 `2.5 s` 分流 SLO）。\n\n在 Prompt Caching 佈局上，Claude 依 `tools → system → messages` 順序建立快取前綴；為維持穩定前綴，檢索回來的動態段落應放在穩定 `tools` 與 `system` 前綴之後的適當訊息中（工具檢索結果通常放在對應 `tool_result`），絕不能插入 `tools` 或 `system` 之間。System Prompt（`2,400` tokens）與 18 個工具定義（`3,600` tokens）合計構成 `6,000` tokens 的穩定前綴；若只把 `cache_control: { \"type\": \"ephemeral\" }` 放在最後一個工具，僅能涵蓋約 `3,600` tokens 的工具區段，因此應將斷點設在最後一個穩定的 `system` 內容區塊，才能完整涵蓋 `6,000` tokens（5 分鐘 TTL 讀取僅需基礎輸入單價的 `0.05×`）。若數小時後才喚醒續跑，快取可能已過期而產生 `cache_creation_input_tokens \u003e 0`，不可假設必然命中。\n\n在排序融合上，BM25（建議初始參數 `k1 = 1.2, b = 0.75`）擅長精準匹配料號、條文編號與專有名詞，密集向量（Dense Vector Cosine Similarity）則擅長捕捉語意同義詞。兩者原始分數尺度不同，採用 RRF（`k = 60`）只看 1-based 名次不看絕對分數：`rrf_score = 1 / (60 + rank_bm25) + 1 / (60 + rank_vector)`；若候選文件未出現在某路檢索結果中，該路貢獻為 `0`，且可依 `(rrf_score DESC, chunk_id ASC)` 穩定處理同分，並依實際資料量測 Top-3 品質。\n\n### 4. 多租戶 ACL 前置過濾與 Citation 驗證\n\n企業知識庫常同時存放多個租戶的專屬合約與由受信任發布路徑管理的 `global` 規範。`tenant_id` 與 `acl_roles` 必須來自已驗證的呼叫身分，且 **ACL 過濾必須發生在檢索評分之前**（Pre-filtering），絕不能先做全域 Top-K 檢索再由程式碼或 LLM 過濾，否則高分機密文件會把該租戶真正有權限的文件擠出 Top-K，甚至在 Prompt 中造成跨租戶洩漏（資安攻擊防禦全貌見 ch09）。須注意部分向量近似索引（如 HNSW/IVFFlat）在結合 `WHERE` 過濾時可能出現有效結果少於 K 的情況（實際行為與 iterative scan 選項須依所用資料庫與 pgvector 版本官方文件確認），應依 ACL 選擇性搭配確切搜尋或分區索引並量測 `recall@K` 與 p95。同時，已授權的文件仍可能包含過時政策或 prompt injection，因此退款工具必須獨立驗證工單歸屬、金額、政策版本與 HITL 門檻，並在續跑時重新檢查已撤銷的權限。\n\n此外，為防止模型捏造條文編號或漏引來源，系統必須對政策型回答要求結構化輸出（例如以 `output_config.format` 約束 JSON claim、來源 ID、條款與版本，並以 `strict: true` 約束工具參數；若需併用原生 Citations 與結構化輸出，須依撰寫時官方 API 文件確認相容性），再於應用層執行確定性 **Citation 驗證**：下例函式只檢查至少存在一個可辨識引用，且所有可辨識引用均在檢索結果清單中；完整輸出格式、逐項主張的引用覆蓋率與引用內容對應關係，仍須另行驗證：\n\n```typescript\n// 摘自 examples/ts/ch04/index.ts\nexport function verifyCitations(\n  answerText: string,\n  retrieved: SearchResult[],\n  requireCitation = true,\n): { valid: boolean; cited: string[]; fabricated: string[]; missingCitation: boolean } {\n  const allowed = new Set(retrieved.map((r) =\u003e `${r.chunk.docId}#${r.chunk.clauseId}`));\n  const matches = [...answerText.matchAll(/\\[([A-Za-z0-9-]+#[0-9.]+)\\]/g)].map((m) =\u003e m[1]);\n  const fabricated = matches.filter((id) =\u003e !allowed.has(id));\n  const missingCitation = requireCitation \u0026\u0026 matches.length === 0;\n  return { valid: !missingCitation \u0026\u0026 fabricated.length === 0, cited: matches, fabricated, missingCitation };\n}\n```\n\n### 5. Worked Example：靜態 RAG vs Agentic RAG 的真實成本帳\n\n以 `OrderOps` 每日 **50,000** 筆工單（每月 **1,500,000** 筆，平均 `0.58 req/s`、尖峰 `12 req/s` 約 `20×`）、預設工作模型 **Claude Sonnet 5.5**（Input 牌價 **$2.00 / MTok**）計算兩種架構的**檢索片段單次輸入費**差異（情境假設：每筆觸發工單僅檢索一次，且檢索片段只在當次請求按未快取輸入計費；若計算端到端淨節省，尚須計入多輪 Messages 歷史重送、快取寫讀、查詢改寫、工具呼叫與輸出、embedding／搜尋服務成本及品質門檻）：\n\n```text\n條件基準：\n- 日工單量：50,000 筆/天（30 天 = 1,500,000 筆/月）\n- 模型：Claude Sonnet 5.5（Input = $2.00 / MTok）\n\n方案 A：靜態 RAG（情境假設：每筆工單固定塞入 Top-10 文件 = +6,500 tokens）\n- 每日額外輸入 = 50,000 × 6,500 = 325,000,000 tokens = 325.0 MTok/天\n- 每日檢索輸入成本 = 325.0 × $2.00 = $650.00 / 天\n- 每月檢索輸入成本 = $650.00 × 30 = $19,500.00 / 月\n\n方案 B：Agentic RAG（情境假設：僅 35% 工單觸發檢索，Top-3 精準段落 = +1,800 tokens）\n- 每日觸發筆數 = 50,000 × 35% = 17,500 筆/天\n- 每日額外輸入 = 17,500 × 1,800 = 31,500,000 tokens = 31.5 MTok/天\n- 每日檢索輸入成本 = 31.5 × $2.00 = $63.00 / 天\n- 每月檢索輸入成本 = $63.00 × 30 = $1,890.00 / 月\n\n檢索片段輸入費降幅（單次未快取口徑）：\n- 每日節省 = $650.00 - $63.00 = $587.00 / 天\n- 每月節省 = $19,500.00 - $1,890.00 = $17,610.00 / 月（檢索片段輸入費降幅 90.3%）\n```\n\n## 故障模式與防禦\n\n1. **孤兒 `tool_use` 與崩潰後重複退款**（HTTP `400 invalid_request_error`）\n   - **成因**：Worker 在收到模型回傳的 `tool_use` 後、執行外部工具前崩潰，或退款成功後、寫入 `tool_result` 前崩潰，導致 `messages_json` 缺少配對或下一個 Worker 重送退款。\n   - **診斷與告警**：Log 記錄 `tenant_id`、`session_id`、`turn_count`、`http_status: 400`、`error_type: \"invalid_request_error\"`；當全服務 `400` 錯誤率在 5 分鐘內（最少 100 筆請求）超過 `0.5%` 時觸發 PagerDuty 告警。\n   - **防禦**：只在工具執行完畢並產出 `tool_result` 後才更新 `messages_json`；寫入型工具（如退款）在呼叫前先以資料庫 CAS 寫入可恢復的操作紀錄並遞增 `version`，使用綁定業務操作、跨推理重試穩定的 idempotency key（例如 `{tenant_id}:{ticket_id}:refund:{operation_id}`），下游逾時則查詢既有結果或進入 `pending_reconciliation`。若為非同步外部等待，先寫入合成的 `tool_result`（`status: \"pending_external\"`），後續 Webhook 則作為新的 `user` 事件輸入。\n2. **後置過濾造成授權文件被擠出 Top-K**（Post-filtering）\n   - **成因**：向量資料庫先取全域 Top-5，應用層再依 `tenant_id` 剔除不屬於該租戶的文件，結果有效段落只剩 0 或 1 筆，Agent 誤判「查無政策」而拒絕合理退款。\n   - **診斷與告警**：Log 記錄 `search_query`、`pre_filter_count` 與 `returned_chunks_count`；當全服務 `returned_chunks_count == 0` 比例在 5 分鐘內（最少 50 次檢索）超過 `15%` 時觸發檢索品質告警。\n   - **防禦**：在向量索引與 BM25 查詢語句中強制帶入 `WHERE (tenant_id = $1 OR tenant_id = 'global') AND acl_roles \u0026\u0026 $2::text[]`，並依資料選擇性驗證 pgvector 過濾後的 `recall@K`。\n3. **高併發喚醒下的樂觀鎖競爭與 Webhook 重複**\n   - **成因**：供應商 Webhook 重試機制在 500 ms 內連續送出兩次相同回調，或到期排程與喚醒同時觸發，兩個 Worker 同時載入同一份 `waiting_external` 狀態並各自呼叫退款工具。\n   - **診斷與告警**：Log 記錄 `session_id`、`expected_version`、`actual_version` 與 `idempotency_key`；單一 `session_id` 出現連續 `version_conflict` 超過 3 次即告警。\n   - **防禦**：Webhook 須依已驗證來源與事件 ID 去重，且事件經持久化接收後才回傳 `200 OK`；喚醒與到期排程皆須以 `agent_sessions.version` 與 `status = 'waiting_external'` 執行條件 CAS 搶佔（正常喚醒另須檢查 `expires_at \u003e NOW()`，到期轉移則檢查 `expires_at \u003c= NOW()`，並在成功時變更狀態與遞增 `version`，檢查更新列數為 `1`），搶佔失敗立即放棄。\n4. **上游限流、過載與串流斷線**（HTTP `429` / `529` / 殘缺 JSON）\n   - **成因**：尖峰時段觸發 Anthropic API 限流（`429` 附帶 `retry-after` header）或系統過載（`529 overloaded_error`），或者 SSE 串流在輸出 `tool_use` 參數中途斷線，留下無法解析的殘缺 JSON。\n   - **診斷與告警**：Log 記錄 `http_status`、`retry_after_ms`、`stream_truncated: true`；全服務 `529` 或串流截斷率連續 3 分鐘（最少 100 筆請求）超過 `2%` 時告警。\n   - **防禦**：SDK 與 Worker 重試須共用總期限與次數預算，不超過 `18 s` 多步處置 SLO；針對 `429` 嚴格遵守 `retry-after`（若超過剩餘期限則立即失敗降級）；針對 `529` 採用指數退避加 Full Jitter（基底 `500 ms`、上限 `16,000 ms`、最多重試 `4` 次，上界合計至多 `7.5 s`）；串流階段只在收到完整 `message_stop` 事件且 `stop_reason`、JSON 與授權檢查通過後，才允許推進 `turn_count` 並落盤。\n5. **Prompt Caching 失效導致成本暴增**（`cache_read_input_tokens = 0`）\n   - **成因**：開發者在檢索結果出爐後，動態將段落插入 System Prompt 或工具定義之間，破壞了前綴雜湊，或因工具陣列順序未固定，導致讀取 miss 並可能產生新的快取寫入（`cache_creation_input_tokens \u003e 0`）；若 `cache_creation_input_tokens` 與 `cache_read_input_tokens` 皆為 `0`，則應另查斷點位置、最小可快取門檻及快取是否實際啟用。\n   - **診斷與告警**：Log 記錄每回合 `usage.cache_read_input_tokens` 與 `usage.cache_creation_input_tokens`；當連續 5 分鐘（最少 100 筆請求）快取命中率低於 `80%` 時觸發 FinOps 告警。\n   - **防禦**：固定工具定義與 System Prompt 順序，將 `cache_control: { \"type\": \"ephemeral\" }` 斷點設在最後一個穩定的 `system` 內容區塊以涵蓋完整 `6,000` tokens 前綴，並將動態檢索段落嚴格限縮在 `tool_result` 或最新一筆 `user` 訊息中；若兩個欄位皆為 `0`，應優先排查斷點位置與最小 token 門檻。\n\n## 動手做\n\n本章完整可執行範例分別位於 [examples/ts/ch04/index.ts](examples/ts/ch04/index.ts) 與 [examples/py/ch04/main.py](examples/py/ch04/main.py)（本機模擬程式，未直接呼叫真實 Anthropic SDK、MCP 或 Batch API）。兩個範例都實作了：\n1. `SessionStateStore`（Python 版使用內建 `sqlite3` 模擬 PostgreSQL `agent_sessions` 複合主鍵、`version` 樂觀鎖與 TTL 過期檢查）。\n2. `MultiTenantKnowledgeBase` / `hybrid_search`（強制 `tenant_id` 與 `acl_roles` 前置過濾，並以 RRF 融合 BM25 與向量餘弦分數）。\n3. `verifyCitations` / `verify_citations`（比對輸出中的 `[doc_id#clause_id]` 是否皆來自本次授權檢索結果，並攔截漏引）。\n\n執行驗證步驟（TypeScript 需 Node.js 22+ 原生執行或安裝 `tsx`）：\n\n```bash\n# Python 版本\npython3 books/enterprise-agents/examples/py/ch04/main.py\n\n# TypeScript 版本（Node.js 22+）\nnode --experimental-strip-types books/enterprise-agents/examples/ts/ch04/index.ts\n```\n\n預期終端輸出（以 Python 版為例）：\n\n```text\nResumed session: sess-88412 turn: 3 version: 2 conflict_caught: True\nAuthorized chunks: ['POL-RET-APAC#4.2', 'POL-SUP-SLA#2.1']\nGood citation check: {'valid': True, 'cited': ['POL-RET-APAC#4.2'], 'fabricated': [], 'missing_citation': False}\nBad citation check: {'valid': False, 'cited': ['POL-VIP-EU#9.1'], 'fabricated': ['POL-VIP-EU#9.1'], 'missing_citation': False}\nUncited check: {'valid': False, 'cited': [], 'fabricated': [], 'missing_citation': True}\nRetrieved chunks input cost (USD): 0.003600\nRetrieved chunks (1,800) + 350 output tokens cost (excl. prefix/other input/history, USD): 0.007100\n```\n\n建議進一步測試更多邊界情境：將 `ttl_hours` 設為 `-1` 驗證過期、以 `tenant-eu-02` 搭配 `ops_agent` 驗證跨租戶隔離、故意漏引或混入 `[POL-FAKE#1.0]`，以及測試同文件多條款、空檢索結果、重複 Webhook 與退款成功後崩潰恢復。上線時除了將 `SQLiteSessionStore` 替換為 PostgreSQL 連線池並開啟 RLS 策略外，還須實作並驗證交易內租戶身分傳遞、狀態與版本 CAS、外部操作紀錄與冪等、Webhook 去重及故障恢復機制，才能安全銜接多節點部署。\n\n## 自我檢核\n\n1. **【入門｜10 分鐘】** 為什麼在 `OrderOps` 中不能把所有歷史工單的政策文件都放進 System Prompt，而必須區分 Working Context、Session State Store 與 Long-term Memory？\n2. **【進階｜15 分鐘】** 假設 `OrderOps` 某租戶的知識庫有 10,000 筆文件，其中 9,990 筆屬於其他租戶。請說明若改用「先取全域 Top-5 再做應用層過濾（Post-filtering）」會發生什麼問題，並寫出正確的 SQL／檢索過濾條件。\n3. **【挑戰｜20 分鐘】** 當 `OrderOps` 工單在等待供應商回覆（`waiting_external`）超過 24 小時後被喚醒，若直接重放整個 `Agent Loop`，如何確保先前已經呼叫過的唯讀查詢或寫入型工具不會被重複執行？\n\n### 參考解答\n\n1. **解答**：System Prompt 受限於 Context Window 上限與每回合線性增加的輸入成本（在 5 回合對話中，若均按未快取費率計價，前綴每多 1,000 tokens 就會乘以 5 倍消耗；以 Sonnet 5.5 `$2.00 / MTok` 計算，單筆多花 `$0.01`，每日 50,000 筆就是 `$500`），且過多無關文件會引發 Context Rot 稀釋注意力。拆分為三層後，Working Context 只保留當下推理所需的最小集合（單次請求結束即釋放），Session State Store 負責跨小時暫停與恢復（Redis 熱快取 + PostgreSQL 落盤），Long-term Memory 則透過 Agentic RAG 按需載入。\n2. **解答**：全域 Top-5 極可能被其他租戶的高相似度文件佔滿，導致應用層過濾後剩下 0 筆結果，使 Agent 誤判「查無資料」而拒絕合理請求（實際 Top-5 失敗率仍須依資料分佈量測）；若改把未過濾段落送進 Prompt 再叫 LLM 忽略，則會造成跨租戶機密外洩。正確做法是在向量與全文檢索階段就執行 Pre-filtering，例如在 PostgreSQL/pgvector 中加上 `WHERE (tenant_id = $1 OR tenant_id = 'global') AND acl_roles \u0026\u0026 $2::text[]`，確保進入 RRF 排名融合的候選集 100% 合法，並可為 `(tenant_id, acl_roles)` 建立帶 `btree_gin` 的 GIN 複合索引，搭配查詢計畫與壓測驗證是否達標 `50 ms` 目標。\n3. **解答**：持久化 `AgentSessionState` 時，必須把已完成的 `tool_use` 與對應 `tool_result` 成對寫入 `messages_json`，並以帶狀態條件的 `version` 樂觀鎖 CAS 確保只有一個喚醒 Worker 能推進狀態。喚醒續跑時，將這份完整的 `messages_json` 作為新一次 Messages API 請求的歷史上下文，模型會看到工具已經執行完畢並取得結果，有助於接續推理；但不得依賴模型自行避免重複呼叫，寫入型工具在呼叫前仍應先在同一交易寫入可恢復的操作紀錄，並使用綁定業務操作、跨推理重試穩定的 idempotency key（例如 `{tenant_id}:{ticket_id}:refund:{operation_id}`）搭配下游冪等或對帳機制，即使發生崩潰或跨節點重試也不會重複退款。\n\n## 延伸閱讀\n\n- PostgreSQL Row-Level Security（RLS）與 WAL 官方文件：多租戶資料列隔離與檢查點恢復的資料庫層實作參考。\n- Reciprocal Rank Fusion（RRF）：Hybrid Search 結合 BM25 與密集向量、只需單一平滑常數 `k`（常用 `60`）且無須分數正規化的排名融合方法。\n- 本書第 6 章（ch06）：進一步探討跨節點分散式重試、Transactional Outbox 與 HITL 長任務暫停／喚醒狀態機，以及多租戶配額隔離。\n"}, {"id": "ch05-multi-agent-orchestration", "file": "ch05-multi-agent-orchestration.md", "group": "Part II — 狀態、記憶與多代理協作", "title": "第 5 章：多 Agent 協作架構：Orchestrator、Handoff 與隔離沙盒", "md": "# 第 5 章：多 Agent 協作架構：Orchestrator、Handoff 與隔離沙盒\n\n## 從你已知的出發\n\n做過微服務架構的後端工程師，對**分散式 Saga 編排與補償**（Orchestrated Saga）並不陌生：當單一服務要同時協調訂單、庫存、金流與物流時，把所有邏輯塞進同一支 Transaction Script 會讓狀態耦合、權限過大、失敗恢復困難；因此我們改由一個中央 Orchestrator 依序或平行派發子任務給各領域服務，只收集結構化的執行結果，再決定下一步或觸發補償。\n\n多 Agent 協作（Multi-Agent Orchestration）的**成立邊界**就在這裡：當單一 `Agent Loop` 需要攜帶過多工具、處理跨領域調查，或同時握有唯讀與高風險寫入權限時，拆成「中央協調者 + 專責 Sub-agent」能隔離 Context 汙染、縮小工具面（Tool Surface），並把權限鎖在最小範圍內。\n\n兩者的**失效邊界**同樣明確：傳統 Saga 透過命令、RPC 或事件協調各服務的本地交易與補償，步驟通常採明確契約，但不必然是確定性 RPC（一樣可能逾時、重複執行或依外部狀態產生不同結果）；Agent 之間的傳遞卻包含自然語言推理與機率性工具呼叫，這帶來兩個傳統微服務沒有的新問題——**上下文膨脹**（Context Bloat）與**交接失真**（Handoff Drift，例如摘要遺漏已退款金額，或將「物流狀態未知」改寫成「尚未出貨」）。如果把 Sub-agent 的完整對話與工具回傳原封不動塞回主 Agent，主 Agent 的 Context Window 會在幾回合內被垃圾資訊淹沒；反之，如果摘要過度簡化，主 Agent 又會因為缺少關鍵證據而誤判。本章直接從單 Agent 的擴展瓶頸切入，建立三大協作拓撲、Handoff 壓縮契約、平行扇出容錯與 SDK 選型邊界。\n\n---\n\n## 核心機制\n\n### 單 Agent 的擴展瓶頸\n\n在 `OrderOps` 基準設定中，系統共有 `18` 個工具（12 唯讀 Read-only + 6 寫入／金流 Mutating），單一 Agent 的基準前綴大小為 `6,000` tokens（System Prompt 2,400 + 18 工具 Schema 3,600）。當業務繼續擴張到 30–50 個工具時，單 Agent 會同時撞上三個擴展瓶頸（實際影響幅度依工具描述重疊度與任務分布而異）：\n\n1. **工具誤選率上升**：模型在每個 `Turn` 都要從數十個相似的 JSON Schema 中挑出正確工具，描述重疊度一高，參數填錯或叫錯工具的機率會顯著上升。\n2. **長調查汙染決策上下文**：查物流軌跡、比對倉庫庫存與翻閱帳務明細會產生大量中間 JSON 與除錯訊息。這些只屬於「調查階段」的雜訊留在主對話裡，會稀釋後續「退款仲裁」時的注意力（Context Rot，見 ch03）。\n3. **權限無法最小化**：只要同一個 `Agent Loop` 裡同時掛著 `get_order` 與 `issue_refund`，Prompt Injection 或模型幻覺就有機會直接觸發金流寫入，違反最小權限原則（詳細權限治理見 ch09）。\n\n### 三大協作拓撲與選型\n\n企業級多 Agent 系統通常收斂為三種基本拓撲，彼此可依任務複雜度組合使用：\n\n```text\n1. Router + Specialists（分流＋專責）\n   Ticket -\u003e Haiku Router (0 tools)\n               |-- shipping_investigator (6 tools)\n               |-- inventory_investigator (6 tools)\n               +-- refund_arbitrator (Opus, 6 tools)\n\n2. Orchestrator-Workers（協調者＋平行工人）\n   Orchestrator\n     |--[fan-out]--\u003e Worker A (carrier_status)\n     |--[fan-out]--\u003e Worker B (warehouse_stock)\n     +--[fan-out]--\u003e Worker C (billing_ledger)\n     \u003c--[compressed WorkerHandoff]--\n\n3. Evaluator-Optimizer（生成＋審查迴圈）\n   Generator Agent --[draft]--\u003e Evaluator Agent\n        ^                              |\n        +------[reject + feedback]-----+\n```\n\n- **Router + Specialists**：適合工單意圖明確、各領域邊界清楚的場景。Router 本身不掛任何工具（`0` 個工具），只輸出結構化路由決策，延遲與成本極低。\n- **Orchestrator-Workers**：適合單一工單需要同時查多個獨立系統（例如同時查物流與帳務）的場景。Orchestrator 動態決定要扇出（Fan-out）哪些唯讀 Worker，等結果收斂後再決定是否升級給高階模型。\n- **Evaluator-Optimizer**：適合合規報告、法務回覆或高風險退款理由生成，由獨立的 Evaluator 檢查事實引用與政策合規性，不通過則退回重寫（最多設 `max_revisions = 2` 防無窮迴圈）。\n\n### Wire-Level 呼叫與 Sub-agent Handoff 契約\n\n多 Agent 協作的成敗，取決於**線上請求邊界**與 Sub-agent 回傳給父層的**交接契約**（Handoff Contract）。\n\n在分流階段，Haiku Router 呼叫 `messages.create` 時必須省略 `tools`（或設 `tools: []`）與非必要取樣參數（依模型官方文件確認），`max_tokens` 鎖在 `256`（若啟用 adaptive thinking 需預留足夠預算或降低 `output_config.effort`），並透過 `output_config.format`（`{ type: \"json_schema\", schema: ... }`）約束結構化 JSON 輸出；若要啟用 Prompt Caching，靜態路由 System Prompt 必須達到該模型的最小快取門檻（須依官方文件逐模型確認，例如 `claude-opus-5-5` 為 `512` tokens、`claude-sonnet-5` 與先前的 Sonnet 4.5／4.6 為 `1,024` tokens，至於 Sonnet 5.5 則依其官方文件確認，低於門檻時 `cache_control: { type: \"ephemeral\" }` 會靜默不寫入），且絕對不能把動態 `ticketId` 放在 `cache_control` 斷點之前。Router 回傳後，應用程式必須明確處理 `refusal`、`max_tokens` 截斷、空內容與解析失敗，並由程式驗證 `lane`、任務白名單、去重、數量與 `confidence` 範圍；Router 的輸出僅授權查詢白名單內的唯讀任務，工具服務仍須以可信的租戶與身分執行服務端授權。\n\n在調查階段，每個唯讀 Worker 獨立執行自己的 `Agent Loop`。當模型回傳 `stop_reason: \"tool_use\"` 時，回應 `content` 內含 `tool_use` 區塊（附帶 `id: \"toolu_...\"`、`name` 與 `input`）；下一則 `user` 訊息開頭必須放上所有對應的 `tool_result`（逐一配對 `tool_use_id`，失敗時設 `is_error: true`），並保留完整的 assistant `content`（包含適用的 `thinking` 區塊），直到 `stop_reason === \"end_turn\"` 或觸及 `max_turns = 4` 上限；若使用 Streaming，必須等完整訊息收斂且通過本地驗證後才派發工具，並對 SSE `error` 事件分類處理。每次 API 回應的 `usage` 欄位（`input_tokens`、`output_tokens`、`cache_read_input_tokens`、`cache_creation_input_tokens`）都會逐次記錄，依該次呼叫的模型與各類費率（一般輸入、輸出、快取讀取及對應 TTL 的快取寫入）分別換算為美元後累加寫入 `WorkerHandoff.costUsd`；逾時等無法確認的帳務則另行標示並對帳。\n\n父層 Orchestrator **絕對不該接收 Sub-agent 的完整 `messages` 陣列或原始工具回傳**，而只應接收固定結構的壓縮物件。為了防範交接失真與 Prompt Injection，模型產生的 `summary` 必須與後端驗證的 `facts` 分開保留，`facts` 應具備版本化欄位、大小上限、證據來源與觀測時間，例外則映射為安全錯誤碼。以下是 `OrderOps` 採用的 `WorkerHandoff` 契約（完整實作見 `examples/ts/ch05/index.ts` 與 `examples/py/ch05/main.py`）：\n\n```typescript\nexport interface WorkerHandoff {\n  workerId: string;\n  task: string;\n  status: \"ok\" | \"timeout\" | \"error\";\n  summary: string;                  // 1-2 句精簡結論，供 LLM 閱讀（不可信來源）\n  facts: Record\u003cstring, unknown\u003e;   // 後端驗證的結構化關鍵欄位（orderId, status, totalUsd）\n  latencyMs: number;\n  costUsd: number;\n}\n```\n\n這個設計把「調查過程的 3,000–8,000 tokens 雜訊（示意值）」隔離在 Worker 自己的區域變數裡，只讓精簡的結構化 `WorkerHandoff`（約 120–180 tokens 示意值，依實際欄位長度而定）進入父層 Context。\n\n### 生產配置基線與狀態儲存\n\n為了讓平行扇出在 `OrderOps` 的多步處置延遲 SLO（p95 ≤ `18` 秒）內穩定收斂，生產環境必須鎖定以下參數與儲存結構：\n\n- **逾時、期限與併發上限**：單一 Worker 執行上限 `WORKER_TIMEOUT_MS = 8_000`（包含最多 `max_turns = 4` 回合），單次工單整體單調時鐘（monotonic）Wall-clock 期限 `18_000ms`（依序分配給 Router、Worker、仲裁與持久化）。在尖峰 `12 tickets/s` 下，每筆扇出 3–4 個 Worker 代表 `36–48` 次 Worker 啟動／秒（若耗滿 4 回合則達 `144–192` 次呼叫／秒），因此除了單工單 `MAX_PARALLEL_WORKERS = 4` 之外，還必須配置跨工單的全域／租戶併發限制、RPM／token 配額與有限佇列背壓，並分別追蹤成功、逾時與人工轉介。\n- **Redis 租約與退款冪等**：派發前以原子取鎖（`SET ... NX PX` 搭配租約持有者 token 與安全比對釋放）寫入 `orderops:ch05:orch:{ticketId}:lock`（TTL `30s`），並以持久狀態的版本檢查或 fencing token 拒絕逾時後仍嘗試提交的舊持有者。示範用的 `orderops:ch05:idem:{orderId}:{action}`（TTL `86400s`）僅供短時防重；生產環境退款必須使用包含 `tenant_id` 與穩定 `refund_intent_id` 的持久唯一鍵，綁定請求參數與金流供應商的冪等鍵（避免阻擋合法的第二筆部分退款，也防止 24 小時後重放），並定義「供應商已接受、回應遺失」時的查單與對帳流程。\n- **PostgreSQL 交接稽核表**：每次 Worker 結束後寫入 `agent_handoffs (handoff_id UUID PRIMARY KEY, ticket_id TEXT NOT NULL, workflow_run_id UUID NOT NULL, attempt_no INT NOT NULL, worker_id TEXT NOT NULL, status TEXT NOT NULL, facts JSONB NOT NULL, latency_ms INT NOT NULL, cost_usd NUMERIC(10,6) NOT NULL, created_at TIMESTAMPTZ DEFAULT now())`，並在 `(ticket_id, created_at)` 建立複合索引供查詢使用；另以符合入帳語意的持久唯一約束（例如 `(workflow_run_id, attempt_no, worker_id)`）搭配交易處理，區分工作流與重試次數並防止重複入帳。\n- **預算熔斷保護**：Orchestrator 在派發前會預留最大待完成支出並檢查累計 `totalCostUsd`（區分已知成本與逾時後尚未確認的帳務）；若單筆工單累計成本超過 `$0.050`（約為分層基準 `$0.005085` 的 10 倍），立即停止後續非必要扇出並轉入人工審核，防止異常迴圈燒毀配額。\n\n### Worked Example：單一 Sonnet（18 工具）vs 分層路由與隔離（Haiku Router + 3 Specialists）\n\n以 `OrderOps` 的基準數字計算單筆工單的**純前綴輸入成本**（僅計入 System Prompt 與工具 Schema 前綴，不含快取折扣與各層輸出；Claude Haiku 5.5 牌價為 `$0.10 / $0.50` USD / MTok，Claude Sonnet 5.5 牌價為 `$2.00 / $10.00` USD / MTok，Claude Opus 5.5 牌價為 `$4.00 / $20.00` USD / MTok）：\n\n```text\n[方案 A：單一 Sonnet 5.5 攜帶全部 18 個工具]\n- 前綴大小：6,000 tokens（System Prompt 2,400 + 18 工具 Schema 3,600）\n- 假設 5 回合對話、五回合累計前綴：\n  前綴累計輸入 = 6,000 × 5 = 30,000 tokens\n- 前綴輸入成本 = 30,000 × ($2.00 / 1,000,000) = $0.060000 / 筆\n- 工具選擇風險：18 個工具同台競爭，多步驟工單誤觸寫入工具的風險較高。\n\n[方案 B：Haiku Router (0 工具) + 專責 Specialist (各 6 工具)]\n（容量假設：每筆平均 1 個唯讀 Worker、20% 工單額外觸發 Opus 仲裁）\n1. Haiku Router（1 回合、0 工具、前綴 450 tokens）：\n   前綴輸入成本 = 450 × ($0.10 / 1,000,000) = $0.000045 / 筆\n   （註：若計入 90 tokens 輸出則另加 $0.000045，合計 $0.000090 / 筆）\n2. 唯讀調查 Worker（Haiku 5.5、6 工具、前綴 2,800 tokens、2 回合）：\n   前綴累計輸入 = 2,800 × 2 = 5,600 tokens\n   前綴輸入成本 = 5,600 × ($0.10 / 1,000,000) = $0.000560 / 筆\n3. 高風險退款仲裁（僅 20% 工單觸發 Opus 5.5、6 工具、前綴 2,800 tokens、2 回合）：\n   觸發時前綴成本 = (2,800 × 2) × ($4.00 / 1,000,000) = $0.022400 / 筆\n   攤提至全量工單（× 20%）= $0.004480 / 筆\n- 方案 B 合計平均純前綴成本 = $0.000045 + $0.000560 + $0.004480 = $0.005085 / 筆\n- 純前綴成本降幅 = ($0.060000 - $0.005085) / $0.060000 = 91.53%\n```\n\n透過拆分工具面與分層模型，純前綴輸入成本從每筆 `$0.060000` 降至 `$0.005085`（降幅 `91.53%`；若平均每筆扇出 2 個等量 Worker 則為 `$0.005645`，降幅 `90.59%`），同時把 18 個工具的選擇空間縮小為每個 Specialist 僅面對 6 個工具（完整月度財務總帳與快取疊加計算見 ch08）。\n\n### 自建 Loop vs Claude Agent SDK 選型邊界\n\n實作多 Agent 編排時，團隊常面臨「自己寫 `messages.create` 迴圈」還是「採用官方 Claude Agent SDK（TypeScript `@anthropic-ai/claude-agent-sdk` 或 Python `claude-agent-sdk`）」的選擇：\n\n| 評估維度 | 自建 Orchestrator Loop | Claude Agent SDK |\n|---|---|---|\n| 控制粒度 | 完全掌控每次 `messages.create`、自訂 Retry/Circuit Breaker 與任意資料庫狀態機 | 內建 Sub-agent 派發、工具執行迴圈與標準 Hook 生命週期 |\n| 隔離與沙盒 | 需自行實作檔案系統／行程隔離與 `max_turns` 保護 | 原生支援工作目錄隔離、權限控制（`allowedTools` / `disallowedTools`）與 Sub-agent 上下文切分（租戶／行程隔離仍須搭配實際沙盒） |\n| 適用場景 | 需要深度整合既有微服務佇列、自訂 Saga Checkpoint（見 ch06）或極致壓榨延遲 | 開發內部工程助手、程式碼／文件自動化管線或標準多步驟研究代理 |\n\n在 `OrderOps` 這類高併發交易系統中，我們通常選擇自建 Orchestrator Loop，原因在於必須把 `WorkerHandoff` 與外部 PostgreSQL／Redis 狀態機緊密綁定，並在 `429`／`529` 發生時精準控制退避與降級；反之，若團隊建置的是離線程式碼審查或知識庫研究代理，直接採用 Claude Agent SDK 的 `allowedTools`（Python 為 `allowed_tools`）預先核准清單與 `disallowedTools`（細節依官方 SDK 文件確認）搭配沙盒環境，能省下大量樣板碼。\n\n---\n\n## 故障模式與防禦\n\n多 Agent 系統最常見的線上故障不是單一模型答錯，而是扇出雪崩與部分失敗處理不當。線上維運必須針對以下四種故障建立結構化 log（`trace_id`、`ticket_id`、`worker_id`、`http_status`、`retry_after_ms`、`stop_reason`、`cache_read_input_tokens`、`handoff_status`）與對應告警：\n\n1. **平行扇出部分失敗與逾時**（Partial Failure \u0026 Timeout）：\n   使用 `Promise.all`（TS）或未加保護的 `asyncio.gather`（Python）時，只要其中一個唯讀 Worker 逾時或拋出例外，整個請求就會直接失敗，浪費其他已完成 Worker 的 token 成本。\n   **防禦**：一律使用 `Promise.allSettled`（TS）或 `asyncio.gather(..., return_exceptions=True)`（Python），並為每個 Worker 設定獨立的 `WORKER_TIMEOUT_MS = 8_000` 與 `max_turns = 4` 上限（同時傳播取消訊號與 deadline）。退款與唯讀結案必須由**應用程式**依路由強制檢查必要證據（例如退款必須同時具備有效的 `carrier_status` 與 `billing_ledger`，且核對租戶、訂單、幣別、付款狀態與證據時效）；缺件、衝突或過期一律降級為 `degraded_pending_hitl`（人工審批），金流寫入前再由可信服務複檢可退款餘額。告警閾值：`worker_timeout_rate \u003e 2%`（以所有 Worker 派發為分母）或 `degraded_hitl_rate \u003e 5%`（以所有工單為分母），採 5 分鐘滾動視窗且最低樣本數 ≥ `100`。\n2. **上游限流與過載雪崩**（429 / 529 Cascade）：\n   單筆工單同時扇出 3–4 個 Worker，尖峰時會讓 API 呼叫量瞬間放大 3–4 倍，觸發 HTTP `429`（附帶 `retry-after` header）或 `529 overloaded_error`。若所有 Worker 同時無腦重試，會引發重試風暴；此外 SDK 預設自身也會重試（預設次數依 SDK 版本文件確認），若外層再包重試而不關閉內建重試，內外層各「1 次初始呼叫 + 2 次重試」會膨脹成 `(1+2) × (1+2) = 最多 9 次` 嘗試。\n   **防禦**：限制單工單併發上限 `MAX_PARALLEL_WORKERS = 4` 並搭配全域限流；明確設定 SDK `maxRetries = 0`（由外層統一控制），Worker 內部對 `429` 優先讀取 `retry-after` 秒數等待，對 `529` 採用指數退避加 Full Jitter（`sleep = random(0, min(cap, base × 2^n))`，`n` 從 `0` 起算，`base = 500ms`、`cap = 8_000ms`、`max_retries = 2`；第 1、2 次重試分別為 `0–500ms` 與 `0–1,000ms`，單次等待上界為 `1,000ms`，兩次累計等待上界為 `1,500ms`）；若 `Retry-After` 或下一次嘗試將超出剩餘 deadline，直接降級。告警閾值：`429_rate \u003e 1%` 或 `529_rate \u003e 0.5%`（以所有 API 請求為分母，5 分鐘滾動視窗且最低樣本數 ≥ `100`）。\n3. **Streaming 半途斷線與靜默快取失效**（Partial SSE \u0026 Silent Cache Miss）：\n   啟用 Streaming 時，SSE 連線可能在 `content_block_delta` 傳送一半時中斷而未收到 `message_stop`，導致 `tool_use.input` 留下殘缺 JSON；另一種隱性故障是可快取前綴低於該模型的最小門檻（須依官方文件逐模型確認）導致 `cache_creation_input_tokens = 0` 且 `cache_read_input_tokens = 0`，或是將動態 `ticketId` 誤放在 `cache_control` 斷點之前，導致每次請求都 miss 並重複寫入快取。\n   **防禦**：SSE 解析器必須驗證 `message_stop` 事件與完整 JSON Schema 後才允許執行工具，否則視為可重試的傳輸錯誤；同時對符合快取條件的請求監控整體快取讀取覆蓋率 `cache_hit_rate = cache_read_input_tokens / (input_tokens + cache_creation_input_tokens + cache_read_input_tokens)`，低於 `80%` 立即告警。\n4. **無限遞迴委派與跨 Agent 寫入衝突**（Delegation Loop \u0026 Write Collision）：\n   如果 Agent A 能呼叫 Agent B，而 Agent B 的工具清單裡又包含呼叫 Agent A，兩者會在邊界條件不明時互相踢皮球直到耗盡預算；或者兩個平行 Worker 同時對同一筆訂單執行補償寫入，造成重複退款。\n   **防禦**：由派發器（Dispatcher）在拓撲上強制有向無環圖（DAG）結構，執行 `depth`（呼叫深度，預設上限 `max_depth = 2`）與整筆工單的派發總數上限。所有唯讀調查 Worker 嚴格禁止掛載 Mutating 工具；只有單一仲裁 Specialist 能執行寫入，且必須攜帶基於租戶與穩定退款意圖 ID 的 `IdempotencyKey`（底層佇列與 Saga 重放細節見 ch06）。\n\n---\n\n## 動手做\n\n本節的完整可執行程式碼位於 `books/enterprise-agents/examples/ts/ch05/index.ts`（TypeScript）與 `books/enterprise-agents/examples/py/ch05/main.py`（Python）。兩者皆內建離線模擬模式（無須 `ANTHROPIC_API_KEY` 即可執行驗證）；設定環境變數 `ANTHROPIC_API_KEY` 後，Haiku Router 會切換為真實 Claude API 呼叫，而 Worker 與 Opus Specialist 仍維持本地模擬，方便在不消耗高額 Opus 配額的情況下驗證路由與成本／降級邏輯。\n\n### 關鍵實作：平行扇出與部分失敗降級\n\n在 TypeScript 版本（`examples/ts/ch05/index.ts`）中，`orchestrateTicket` 先由 Haiku Router 產生結構化路由，再用 `Promise.allSettled` 與 `withTimeout` 平行執行唯讀 Worker，最後僅將壓縮後的 `WorkerHandoff[]` 交給應用程式檢查必要證據並決定是否升級給高階 Specialist：\n\n```typescript\nconst settled = await Promise.allSettled(\n  decision.parallelReadOnlyTasks.map(async (task) =\u003e {\n    const startedAt = Date.now();\n    try {\n      return await withTimeout(runReadOnlyWorker(ticket, task), WORKER_TIMEOUT_MS, task);\n    } catch (err) {\n      throw { err, latencyMs: Date.now() - startedAt };\n    }\n  }),\n);\n\nconst handoffs: WorkerHandoff[] = settled.map((res, idx) =\u003e {\n  const task = decision.parallelReadOnlyTasks[idx];\n  if (res.status === \"fulfilled\") return res.value;\n  const { err, latencyMs } = res.reason as { err: unknown; latencyMs: number };\n  const isTimeout = err instanceof WorkerTimeoutError;\n  const errorCode = isTimeout ? \"WORKER_TIMEOUT\" : \"WORKER_EXECUTION_ERROR\";\n  // 詳細例外僅寫入受控日誌，不將原始錯誤字串交給父層\n  return {\n    workerId: `worker-${task}`,\n    task,\n    status: isTimeout ? \"timeout\" : \"error\",\n    summary: `Worker failed with safe code ${errorCode}`,\n    facts: { errorCode, costStatus: \"unconfirmed\" },\n    latencyMs,\n    costUsd: confirmedCostUsd, // 帶入失敗前已確認的累計費用；未確認的在途帳務由 costStatus: \"unconfirmed\" 另行對帳\n  };\n});\n```\n\nPython 版本（`examples/py/ch05/main.py`）採用相同架構，以 `asyncio.wait_for` 搭配 `asyncio.gather(*coros, return_exceptions=True)` 實作隔離扇出。\n\n### 執行驗證與預期輸出\n\n```bash\n# TypeScript（於 books/enterprise-agents/examples/ts 目錄下）\nnpx tsx ch05/index.ts\n\n# Python\npython3 books/enterprise-agents/examples/py/ch05/main.py\n```\n\n執行後會依序處理一般物流延遲工單 `TKT-5001` 與高風險退款工單 `TKT-5002`，以下為 TypeScript 離線模擬模式的示意輸出節錄（依範例內模擬的 token 數量計算，採用 2 個 Worker 與 1 次 Opus 呼叫，與上節容量假設不同；若需獨立重算或驗證兩筆 `totalCostUsd`，須核對範例程式內各模型呼叫的輸入、輸出與快取用量及實際執行結果；Python 輸出結構相同但欄位採 `snake_case`）：\n\n```text\n[ch05] Running OrderOps Orchestrator (OFFLINE SIMULATION)\n{\n  \"ticketId\": \"TKT-5001\",\n  \"route\": { \"lane\": \"shipping_investigator\", \"parallelReadOnlyTasks\": [\"carrier_status\", \"warehouse_stock\"] },\n  \"finalAction\": \"resolved_read_only\",\n  \"totalCostUsd\": 0.00051\n}\n{\n  \"ticketId\": \"TKT-5002\",\n  \"route\": { \"lane\": \"refund_arbitrator\", \"parallelReadOnlyTasks\": [\"carrier_status\", \"billing_ledger\"] },\n  \"finalAction\": \"refund_approved_by_opus_specialist\",\n  \"totalCostUsd\": 0.01811\n}\n```\n\n### 邊界測試建議\n\n1. **模擬單一 Worker 逾時**：在 `runReadOnlyWorker` 針對 `billing_ledger` 注入超過 `WORKER_TIMEOUT_MS`（`8_000ms`）的延遲，驗證 `TKT-5002` 的 `handoffs` 中該項目是否正確標記 `status: \"timeout\"`，且 `finalAction` 降級為 `degraded_pending_hitl` 而非未捕獲例外。\n2. **驗證缺少帳務證據時不放行退款**：當 Router 遺漏 `billing_ledger` 或後端回傳 `not_found`（`status: \"error\"`）時，驗證 `refund_arbitrator` 仍會降級為 `degraded_pending_hitl`。\n\n---\n\n## 自我檢核\n\n1. **（入門｜10 分鐘）** 在 `OrderOps` 的 Router + Specialists 架構中，為什麼我們刻意讓 Haiku Router 攜帶 `0` 個工具，而不是順便讓它掛載 2 個常用查詢工具？\n2. **（進階｜15 分鐘）** 如果 `OrderOps` 的某個 `billing_ledger` Worker 在 `Promise.allSettled` 中回傳 `status: \"timeout\"`，而 `carrier_status` Worker 回傳 `status: \"ok\"`，請說明 Orchestrator 應該如何處理「一般物流查詢工單」與「高風險退款工單」的差異？\n3. **（挑戰｜20 分鐘）** 假設你的團隊想在 Evaluator-Optimizer 迴圈中加入「最大重試 2 次」與「每次評估結果必須包含結構化違規欄位」的限制，請設計這組 Handoff 介面，並說明若 Evaluator 本身發生 529 Overloaded 時該如何降級而不讓工單卡死。\n\n### 參考解答\n\n1. **Router 零工具原則**：Router 的唯一職責是分類與派發。若掛載查詢工具，模型可能忍不住先呼叫工具再分類，導致延遲從單次呼叫（分流基準 SLO 為 p95 ≤ `2.5s`）暴增為多回合 `Agent Loop`，同時把工具 Schema 前綴（每個工具約 `200` tokens，2 個工具即 `400` tokens）乘上全量 `50,000` 筆／天的流量（每日多出 `20,000,000` 輸入 tokens，按 Haiku ≤100K 無快取牌價約多 `$2`／日），浪費不必要的輸入成本與配額。\n2. **部分失敗的差異化降級**：對「一般物流查詢工單」，`carrier_status` 成功即足以回答出貨進度，Orchestrator 可直接採用既有事實回覆並註明帳務系統暫時無法查詢；但對「高風險退款工單」，缺少 `billing_ledger` 的付款／已退金額確認會導致超額退款風險，因此 Orchestrator 必須將 `finalAction` 降級為 `degraded_pending_hitl`，將已收集的 `WorkerHandoff[]` 連同失敗原因轉交人工審批而非自動放行。\n3. **Evaluator-Optimizer 降級設計**：可定義 `EvaluationHandoff { passed: boolean; violations: string[]; revisionCount: number; evaluatorStatus: \"ok\" | \"overloaded\" }`。`max_revisions = 2` 代表「初稿 + 最多 2 次改寫」（最多 3 次語意評估，與每次評估最多 2 次傳輸重試分開計算）。每次退回 Generator 時遞增 `revisionCount` 並附上 `violations` 陣列；當 `revisionCount \u003e= 2` 仍未通過，或 Evaluator 遭遇 `529 overloaded_error` 且經過指數退避加 Full Jitter（`max_retries = 2`）仍失敗時，應立即終止迴圈並標記 `escalated_to_human_review`，將「評估未完成」狀態、最後一版草稿與 `violations` 一併送入人工審核佇列，確保工單不會無限重試或靜默失敗。\n\n---\n\n## 延伸閱讀\n\n- Anthropic Engineering：*Building effective agents*（官方對 Router、Orchestrator-Workers 與 Evaluator-Optimizer 三大協作模式的設計指引）\n- Anthropic Docs：*Claude Agent SDK*（`@anthropic-ai/claude-agent-sdk` / `claude-agent-sdk` 的 Sub-agent 派發與權限隔離機制）\n"}, {"id": "ch06-reliability-and-durable-execution", "file": "ch06-reliability-and-durable-execution.md", "group": "Part II — 狀態、記憶與多代理協作", "title": "第 6 章 企業級可靠性：重試、熔斷、Checkpoint 與長任務執行", "md": "# 第 6 章 企業級可靠性：重試、熔斷、Checkpoint 與長任務執行\n\n單機跑通一個 Agent Loop 只需要幾十行程式碼，但把這套迴圈放進企業生產環境，面對的卻是完全不同的物理現實：上游 LLM API 會在尖峰時段回傳 `429` 與 `529`、Streaming 回應會在吐出半截 JSON 時斷線、外部 ERP 或金流工具會逾時，而高額退款還必須暫停等待人工審批（Human-in-the-Loop，以下簡稱 **HITL**）。\n\n本章為 `OrderOps` 建立企業級可靠性基礎設施：從雙層故障分類、感知 `Retry-After` 的指數退避與熔斷器，到 Event-sourced Checkpoint、Batch API 狀態追蹤與 HITL 暫停／喚醒狀態機，在持久化儲存、供應商冪等與查單等條件成立時，降低重複退款與進度遺失的風險；當結果不明且無法安全確認時，暫停自動重送並轉由人工對帳。\n\n## 從你已知的出發\n\n後端工程師對**熔斷器**（Circuit Breaker）與 **Transactional Outbox 模式**並不陌生：當下游付款閘道連續失敗達閾值，熔斷器切到 `OPEN` 狀態快速失敗，避免執行緒池被雪崩拖垮；而為了讓「寫入訂單狀態」與「發送退款事件」具備原子性，我們把事件寫進同一個資料庫交易的 Outbox 表，再由背景 Worker 非同步派送，配合 Idempotency Key 防止重複執行。\n\n把這兩個機制映射到 Agent 系統，**成立邊界**在於「失敗隔離」與「副作用去重」完全相通：Agent 呼叫 LLM API 的行為等同於呼叫高延遲、配額受限的外部微服務，適用熔斷與退避；而 Agent 決定呼叫寫入型工具（例如 `issue_refund`）時，把決策寫入 Checkpoint 日誌再執行工具，正如同 Outbox 先落盤再派送。\n\n**失效邊界**則出在「重試成本與狀態長度」：傳統微服務重試一次只需幾毫秒與幾百 bytes，但 Agent 每次重試整個 Turn 都可能重算數萬 tokens，且 Streaming 半途斷線時，模型已經吐出一半的推理內容與不完整的 `tool_use` JSON 參數，無法直接當作冪等結果重播，必須在 Checkpoint 邊界明確區分「LLM 推理中斷」與「工具已送出但未收到回執」。\n\n## 核心機制\n\n### 雙層故障分類：LLM 層與工具層\n\n企業級 Agent 的錯誤處理必須把「LLM API 層」與「外部工具層」切開，因為兩者的失敗語意、HTTP 回應結構與重試代價截然不同：\n\n1. **LLM API 層**：\n   - `429 rate_limit_error`：觸及 RPM（Requests Per Minute）、ITPM（Input Tokens Per Minute）、OTPM（Output Tokens Per Minute）配額上限，或是流量爬升限制／支出上限。配額型回應標頭通常附帶 `retry-after`（秒數）以及剩餘配額與重設時間相關標頭（例如 `anthropic-ratelimit-*` 系列標頭，確切標頭名稱與格式依官方文件為準）；支出上限型 `429` 則可能沒有 `retry-after`，不應無止盡重試。\n   - `529 overloaded_error`：供應商推理叢集暫時過載（例如回應主體帶 `overloaded_error` 類型，確切錯誤主體格式依官方文件為準）。此類錯誤屬於瞬態故障，可重試但需要較長冷卻視窗，且不應計入業務邏輯失敗。\n   - **Streaming 半途斷線與停止原因**：SSE 連線須以 `event: message_stop` 確認正常結束，並依 `message_delta` 中的 `stop_reason` 決定下一步（完整回應仍可能是截斷、拒答或暫停等非正常結束原因，確切 `stop_reason` 列舉值依官方文件為準；HTTP `200` 之後也可能出現 SSE `error`）。若連線在 `message_stop` 前中斷，造成 `input_json_delta` 累積的 `tool_use.input` 出現殘缺 JSON，絕不能送進工具層，應丟棄該次殘缺輸出；確認未發生外部副作用後才重試整個 Turn（若使用 MCP Connector 等遠端代呼叫模式而可能已執行工具，應先查詢遠端狀態並依冪等保障決定是否重送或人工對帳）。\n   - **非重試錯誤**：`400 invalid_request_error`、`401 authentication_error`、`403 permission_error` 與 `413 request_too_large` 屬於契約或權限錯誤，重試只會浪費配額，必須立即終止並標記為 `failed`。\n\n2. **外部工具層**：\n   - **唯讀工具逾時**（如 `get_order`、`check_inventory`）：無副作用，單次工具 timeout 設為 `5s`。若逾時或連線重置，可直接重試 `2` 次（總預算 `5s × 3 = 15s`，未計退避）；若仍失敗，在 `tool_result` 區塊設定 `is_error: true` 並回傳精簡錯誤訊息，讓模型決定改查替代欄位或回覆使用者。\n   - **寫入／金流工具逾時或授權邊界**（如 `issue_refund`）：單次工具 timeout 設為 `10s`。由於模型輸出、工具／MCP 回傳與訂單備註都可能夾帶 prompt injection，**業務授權必須放在工具執行端**：依可信身分驗證租戶、訂單、角色、付款狀態、可退餘額與核准範圍，並以條件更新防止併發超退。去重鍵必須綁定持久化業務操作 `(tenant_id, refund_operation_id)`（綁定訂單、最小貨幣單位金額與幣別，對同鍵異參數回報衝突）。送出前記錄授權後的操作意圖；逾時後依供應商的冪等有效期與查單能力決定查詢、同鍵重送或人工對帳。\n\n### Token Bucket 與 Retry-After 感知的退避重試\n\n單純的固定間隔重試會在尖峰時段引發「重試風暴」。生產環境應在客戶端（按模型池與租戶配額作用域）維護本地 Token Bucket 限流器（補充速率設為租戶配額的 `90%`，例如 `2,400 RPM` 配額對應 `36 calls/s`，突發容量 `burst = 54`），並以 **Exponential Backoff with Full Jitter** 結合伺服器回傳的 `retry-after` 標頭；共用 `retry-after` 下限醒來後仍須經限流器放行，避免多 Worker 同時湧入：\n\n```text\ndelay_ms = max(retry_after_ms, random(0, min(max_delay_ms, base_delay_ms * 2^(attempt - 1))))\n```\n\n建議生產工程基線配置如下（若由應用程式掌管重試，應設 TypeScript `maxRetries: 0`、Python `max_retries=0`，避免與 SDK 預設重試相乘）：\n- **單次 LLM 請求與 SSE timeout**：單次 HTTP timeout 設為 `60s`；Streaming 需將 transport idle（含 `ping` 保活）與模型進度 timeout 分開，避免把只有 `ping` 或暫無 `content_block_delta` 的活連線誤判斷線。\n- **退避與同步／背景預算**：`base_delay_ms = 500ms`、`max_delay_ms = 30,000ms`（前 `4` 次退避上限依序為 `0.5s、1s、2s、4s`，合計 `7.5s`）。同步 API 請求總 wall-clock 上限 `120s` 須同時約束單次呼叫與睡眠的剩餘 deadline（兩次 `60s` 呼叫即會耗盡同步預算，分流目標為 `p95 ≤ 2.5s`、多步處置 `p95 ≤ 18s`，超時即轉非同步）；非同步背景 Worker 總預算設為 `3,600s`。\n- **熔斷器參數**（按模型池／Pod 維護）：滑動視窗 `60s` 內連續發生 `failure_threshold = 5` 次 `529` 或 `5xx` 錯誤即切為 `OPEN`，冷卻 `cooldown = 30s` 後進入 `HALF_OPEN`，僅放行 `1` 個探測請求（並以 epoch／token 防止舊的在途請求關閉新開的 breaker）；成功則復歸 `CLOSED`，失敗則重設 `30s` 冷卻。\n- **Prompt Caching 與結構化輸出邊界**：重試時應保持 `tools → system → messages` 中截至 `cache_control: {\"type\": \"ephemeral\"}` 斷點的有效前綴一致，但命中仍受 TTL、模型最低可快取長度與處理時序影響；計費與排錯應同時記錄 `input_tokens`、`cache_creation_input_tokens`、`cache_read_input_tokens` 與 `output_tokens`。若啟用 `strict: true` 或 `output_config.format` 約束 JSON 結構，業務授權仍由工具端負責；Extended Thinking 可透過 `thinking: { type: \"enabled\", budget_tokens: N }` 或較新模型支援的 adaptive reasoning 模式啟用（具體預設與支援參數依模型版本與官方文件確認），Replay 時須保留同一工具回合要求回傳的 thinking 區塊與簽章。\n\n### Event-sourced Checkpoint 與 Replay 執行日誌\n\n為了讓長任務在 Pod 重啟、Deployment 滾動更新或 HITL 暫停後能從斷點續跑，Agent Loop 的每一步狀態轉移都必須以 append-only 事件寫入持久化儲存（PostgreSQL 為主儲存，Redis 負責分散式鎖與超時提醒），並在寫入前遮罩敏感欄位、控管讀取權限與保留期限：\n\n- `llm_turn`：記錄原始請求（或可重建版本）、完整 `assistant` 訊息（含 thinking 區塊與簽章）、各 `tool_use_id`、`usage` 與 `stop_reason`。\n- `tool_call`：記錄 `tool_use_id`、工具名稱、輸入參數、`idempotency_key`（基於 `refund_operation_id`）、`is_err
