services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nexus-nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./api
    container_name: nexus-api
    environment:
      PORT: "3000"
      DATABASE_URL: "postgres://nexus:nexuspass@postgres:5432/nexuspay"
      REDIS_URL: "redis://redis:6379"
      JWT_TTL_SECONDS: "900"
      JWKS_CACHE_TTL_SECONDS: "300"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: nexus-pg
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexuspass
      POSTGRES_DB: nexuspay
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - nexus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexuspay"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nexus-bin:
    profiles: ["bin"]
    platform: linux/amd64
    build:
      context: ./bin
    container_name: nexus-bin
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./workspace:/workspace
    tty: true
    stdin_open: true

volumes:
  nexus_pg_data:
